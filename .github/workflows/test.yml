name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FUNDAMENT_TEST_CACHE_DIR: /tmp/fundament-test-pg

jobs:
  organization-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Trek binary
        id: cache-trek
        uses: actions/cache@v5
        with:
          path: ~/go/bin/trek
          key: trek-${{ runner.os }}-v0.12.1

      - name: Cache embedded PostgreSQL
        uses: actions/cache@v5
        with:
          path: ${{ env.FUNDAMENT_TEST_CACHE_DIR }}
          key: embedded-pg-${{ runner.os }}

      - name: Install dependencies
        run: go get ./...

      - name: Install Trek
        if: steps.cache-trek.outputs.cache-hit != 'true'
        run: go install github.com/printeers/trek@v0.12.1

      - name: Run tests (organization-api)
        working-directory: organization-api
        run: go test ./... -count=1

  cluster-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Trek binary
        id: cache-trek
        uses: actions/cache@v5
        with:
          path: ~/go/bin/trek
          key: trek-${{ runner.os }}-v0.12.1

      - name: Cache embedded PostgreSQL
        uses: actions/cache@v5
        with:
          path: ${{ env.FUNDAMENT_TEST_CACHE_DIR }}-cw
          key: embedded-pg-cw-${{ runner.os }}

      - name: Install dependencies
        run: go get ./...

      - name: Install Trek
        if: steps.cache-trek.outputs.cache-hit != 'true'
        run: go install github.com/printeers/trek@v0.12.1

      - name: Run tests (cluster-worker)
        working-directory: cluster-worker
        run: go test ./... -count=1

  authz-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Trek binary
        id: cache-trek
        uses: actions/cache@v5
        with:
          path: ~/go/bin/trek
          key: trek-${{ runner.os }}-v0.12.1

      - name: Cache embedded PostgreSQL
        uses: actions/cache@v5
        with:
          path: ${{ env.FUNDAMENT_TEST_CACHE_DIR }}-authz-worker
          key: embedded-pg-authz-worker-${{ runner.os }}

      - name: Install dependencies
        run: go get ./...

      - name: Install Trek
        if: steps.cache-trek.outputs.cache-hit != 'true'
        run: go install github.com/printeers/trek@v0.12.1

      - name: Run tests (authz-worker)
        working-directory: authz-worker
        run: go test ./... -count=1

  common:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Trek binary
        id: cache-trek
        uses: actions/cache@v5
        with:
          path: ~/go/bin/trek
          key: trek-${{ runner.os }}-v0.12.1

      - name: Cache embedded PostgreSQL
        uses: actions/cache@v5
        with:
          path: ${{ env.FUNDAMENT_TEST_CACHE_DIR }}-common
          key: embedded-pg-common-${{ runner.os }}

      - name: Install dependencies
        run: go get ./...

      - name: Install Trek
        if: steps.cache-trek.outputs.cache-hit != 'true'
        run: go install github.com/printeers/trek@v0.12.1

      - name: Run tests (common)
        working-directory: common
        run: go test ./... -count=1

  functl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build and vet
        working-directory: functl
        run: |
          go build ./...
          go vet ./...

  dcim-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Trek binary
        id: cache-trek
        uses: actions/cache@v5
        with:
          path: ~/go/bin/trek
          key: trek-${{ runner.os }}-v0.12.1

      - name: Cache embedded PostgreSQL
        uses: actions/cache@v5
        with:
          path: ${{ env.FUNDAMENT_TEST_CACHE_DIR }}
          key: embedded-pg-${{ runner.os }}

      - name: Install dependencies
        run: go get ./...

      - name: Install Trek
        if: steps.cache-trek.outputs.cache-hit != 'true'
        run: go install github.com/printeers/trek@v0.12.1

      - name: Run tests (dcim-api)
        working-directory: dcim-api
        run: go test ./... -count=1

  test-other:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go get ./...

      - name: Run tests
        run: go test -count=1 $(go list ./... | grep -v -E '/(organization-api|authz-worker|cluster-worker|common|dcim-api)/')

  openfsc-console-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-openfsc-${{ hashFiles('plugins/openfsc/console-ui/bun.lock') }}

      - name: Install dependencies
        working-directory: plugins/openfsc/console-ui
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: plugins/openfsc/console-ui
        run: bun run typecheck

      - name: Run tests
        working-directory: plugins/openfsc/console-ui
        run: bun run test

      # Catches a broken or missing HTML entry point here rather than at image build.
      # Note this does not verify the emitted names against definition.yaml's
      # customComponents — a renamed entry builds clean and only fails in the iframe.
      - name: Build
        working-directory: plugins/openfsc/console-ui
        run: bun run build

  gateway-api-console-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-gateway-api-${{ hashFiles('plugins/gateway-api/envoy-gateway/console-ui/bun.lock') }}

      - name: Install dependencies
        working-directory: plugins/gateway-api/envoy-gateway/console-ui
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: plugins/gateway-api/envoy-gateway/console-ui
        run: bun run typecheck

      - name: Run tests
        working-directory: plugins/gateway-api/envoy-gateway/console-ui
        run: bun run test

      # Catches a broken or missing HTML entry point here rather than at image build.
      # Note this does not verify the emitted names against definition.yaml's
      # customComponents — a renamed entry builds clean and only fails in the iframe.
      - name: Build
        working-directory: plugins/gateway-api/envoy-gateway/console-ui
        run: bun run build

  # The docs image build in build.yml is gated behind `should_deploy`, so it is
  # skipped on draft PRs and on PRs labelled no-preview-env. This job runs
  # unconditionally so broken links are caught on every PR.
  docs-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Pinned to the version docs-frontend/Dockerfile builds with, so a CI pass
      # means the image build passes too.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Astro's tooling rejects Bun's Node-compat version; it needs a real Node.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-docs-frontend-${{ hashFiles('docs-frontend/bun.lock') }}

      - name: Install dependencies
        working-directory: docs-frontend
        run: bun install --frozen-lockfile

      - name: Sync docs
        working-directory: docs-frontend
        run: node scripts/sync-docs.mjs

      # src/links-validator.ts runs at the end of the build and fails it on any
      # link that does not resolve. External http(s) links are not checked here
      # — DOCS_CHECK_EXTERNAL=1 does that, and needs the network.
      - name: Build and validate links
        working-directory: docs-frontend
        run: bun run build

