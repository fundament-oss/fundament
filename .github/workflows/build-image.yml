name: Build Image

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      build-args:
        required: false
        type: string
        default: ""
      push-image:
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fundament

jobs:
  build:
    name: Build ${{ inputs.image-name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Container Registry
        if: inputs.push-image
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ inputs.image-name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tags="$IMAGE:$GITHUB_SHA-${GITHUB_REF_NAME//\//-}-$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: ${{ inputs.push-image }}
          tags: ${{ steps.tags.outputs.tags }}

      # publish-chart stamps the chart with digests rather than tags, and matrix
      # jobs cannot aggregate outputs - so each build leaves its digest as an
      # artifact for the chart job to collect.
      - name: Record digest
        if: inputs.push-image
        run: |
          mkdir -p digest
          echo '${{ steps.build.outputs.digest }}' > "digest/${{ inputs.image-name }}"

      - name: Upload digest
        if: inputs.push-image
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ inputs.image-name }}
          path: digest/
          retention-days: 1
