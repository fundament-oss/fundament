name: Docs external links

# Link rot in the docs' outbound links is invisible to the PR build, which
# deliberately stays off the network (see the docs-frontend job in test.yml).
# This job runs the same build with DOCS_CHECK_EXTERNAL=1 on a weekly schedule,
# so a dead upstream URL surfaces here rather than in front of a reader.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Astro's tooling rejects Bun's Node-compat version; it needs a real Node.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-docs-frontend-${{ hashFiles('docs-frontend/bun.lock') }}

      - name: Install dependencies
        working-directory: docs-frontend
        run: bun install --frozen-lockfile

      - name: Sync docs
        working-directory: docs-frontend
        run: node scripts/sync-docs.mjs

      - name: Build and validate links, including external
        working-directory: docs-frontend
        env:
          DOCS_CHECK_EXTERNAL: '1'
        run: bun run build
