name: Release plugin-sdk

# plugin-sdk is a separate Go module that third-party plugin authors import.
# Go resolves a nested module from a `<subdir>/vX.Y.Z` tag, so releasing is
# nothing but pushing that tag; there are no artifacts to build or upload.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release, e.g. v0.1.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-plugin-sdk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must look like v1.2.3, got '${VERSION}'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/plugin-sdk/${VERSION}" >/dev/null; then
            echo "ERROR: tag plugin-sdk/${VERSION} already exists"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify the module builds and tests clean
        working-directory: plugin-sdk
        run: |
          go build ./...
          go test ./... -count=1

      - name: Tag and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "plugin-sdk/${VERSION}" -m "plugin-sdk ${VERSION}"
          git push origin "plugin-sdk/${VERSION}"
          echo "Released plugin-sdk ${VERSION}"
          echo "Consumers: go get github.com/fundament-oss/fundament/plugin-sdk@${VERSION}"
