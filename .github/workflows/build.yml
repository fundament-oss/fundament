name: Build

on:
  push:
    branches: [master]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
    branches: [master]

concurrency:
  # A label event other than no-preview-env gets a group of its own, so it never
  # cancels a running build.
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && github.event.label.name != 'no-preview-env' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOMAIN: preview.fundament.digilab.reviews
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fundament
  PR_NUMBER: ${{ github.event.number }}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      should_teardown: ${{ steps.check.outputs.should_teardown }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          LABEL_NAME: ${{ github.event.label.name }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-preview-env') }}
        run: |
          should_deploy=false
          should_teardown=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            case "$ACTION" in
              closed|converted_to_draft)
                should_teardown=true
                ;;
              labeled)
                [ "$LABEL_NAME" = "no-preview-env" ] && should_teardown=true
                ;;
              opened|reopened|synchronize|ready_for_review|unlabeled)
                if [ "$ACTION" = "unlabeled" ] && [ "$LABEL_NAME" != "no-preview-env" ]; then
                  :
                elif [ "$IS_DRAFT" = "false" ] && [ "$HAS_SKIP_LABEL" = "false" ]; then
                  should_deploy=true
                fi
                ;;
            esac
          fi

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "should_teardown=$should_teardown" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: github.event_name == 'push' || needs.gate.outputs.should_deploy == 'true'
    strategy:
      matrix:
        include:
          - image-name: authn-api
            dockerfile: authn-api/Dockerfile
            context: "."
          - image-name: organization-api
            dockerfile: organization-api/Dockerfile
            context: "."
          - image-name: db-migrations
            dockerfile: db/Dockerfile
            context: db
          - image-name: console-frontend
            dockerfile: console-frontend/Dockerfile
            context: "."
          # Same image, built from the demo entrypoint: the guided walkthrough on
          # in-memory data, served on the console-demo subdomain.
          - image-name: console-demo-frontend
            dockerfile: console-frontend/Dockerfile
            context: "."
            build-args: BUILD_SCRIPT=build:demo
          - image-name: cluster-worker
            dockerfile: cluster-worker/Dockerfile
            context: "."
          - image-name: authz-worker
            dockerfile: authz-worker/Dockerfile
            context: "."
          - image-name: kube-api-proxy
            dockerfile: kube-api-proxy/Dockerfile
            context: "."
          - image-name: plugin-controller
            dockerfile: plugin-controller/Dockerfile
            context: "."
          - image-name: plugin-proxy
            dockerfile: plugin-proxy/Dockerfile
            context: "."
          - image-name: openfga-bootstrap
            dockerfile: openfga/bootstrap/Dockerfile
            context: "."
          - image-name: docs-frontend
            dockerfile: docs-frontend/Dockerfile
            context: "."
          - image-name: dcim-api
            dockerfile: dcim-api/Dockerfile
            context: "."
          - image-name: dcim-frontend
            dockerfile: dcim-frontend/Dockerfile
            context: "."
          - image-name: marketplace-frontend
            dockerfile: marketplace-frontend/Dockerfile
            context: "."
          - image-name: dcim-authn-api
            dockerfile: dcim-authn-api/Dockerfile
            context: "."
          - image-name: openfsc-operator
            dockerfile: openfsc-operator/Dockerfile
            context: "."
          - image-name: marketplace-catalog-api
            dockerfile: marketplace-catalog-api/Dockerfile
            context: "."
          - image-name: marketplace-registry-api
            dockerfile: marketplace-registry-api/Dockerfile
            context: "."
          - image-name: marketplace-admin-api
            dockerfile: marketplace-admin-api/Dockerfile
            context: "."
          # Same image source as marketplace-frontend, built for the developer
          # and reviewer audiences (FUN-20), like console-demo-frontend.
          - image-name: marketplace-registry-frontend
            dockerfile: marketplace-frontend/Dockerfile
            context: "."
            build-args: BUILD_SCRIPT=build:registry
          - image-name: marketplace-admin-frontend
            dockerfile: marketplace-frontend/Dockerfile
            context: "."
            build-args: BUILD_SCRIPT=build:admin
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      build-args: ${{ matrix.build-args }}

  # Plugins ship outside the chart and outside the preview environments, so
  # publish-chart and preview-label must not depend on this job.
  build-plugins:
    needs: gate
    if: github.event_name == 'push' || needs.gate.outputs.should_deploy == 'true'
    strategy:
      matrix:
        include:
          - image-name: cert-manager-plugin
            dockerfile: plugins/cert-manager/Dockerfile
          - image-name: external-dns-plugin
            dockerfile: plugins/external-dns/Dockerfile
          - image-name: gateway-api-envoy-plugin
            dockerfile: plugins/gateway-api/envoy-gateway/Dockerfile
          - image-name: gateway-api-istio-plugin
            dockerfile: plugins/gateway-api/istio/Dockerfile
          - image-name: openfsc-plugin
            dockerfile: plugins/openfsc/Dockerfile
          - image-name: ceph-rook-plugin
            dockerfile: plugins/storage/ceph-rook/Dockerfile
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: "."

  # Packages the chart with every image digest stamped into values.yaml, so one
  # version string names the chart and the exact images it deploys.
  #
  # This lives in build.yml rather than its own workflow because
  # github.run_number is per workflow file: sharing it with `build` is what
  # makes chart 0.1.0-master.<n> and image tag <sha>-master-<n> the same build.
  # `needs: build` also cannot cross workflow files, and a version that can
  # outlive a failed image build does not identify anything.
  #
  # Master charts go to charts/, PR builds to charts-pr/. They must not share a
  # repository: semver compares prerelease identifiers as ASCII, so
  # 0.1.0-pr417.2345 sorts ABOVE 0.1.0-master.2363, and anything tracking a
  # version range on master would silently pull a PR build.
  publish-chart:
    needs: [gate, build]
    if: github.event_name == 'push' || needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      chart_repo: ${{ steps.version.outputs.chart_repo }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: Compute chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHART_VERSION="0.1.0-master.${{ github.run_number }}"
            CHART_REPO="${IMAGE_PREFIX}/charts"
          else
            CHART_VERSION="0.1.0-pr${PR_NUMBER}.${{ github.run_number }}"
            CHART_REPO="${IMAGE_PREFIX}/charts-pr"
          fi
          {
            echo "CHART_VERSION=${CHART_VERSION}"
            echo "CHART_REPO=${CHART_REPO}"
          } >> "$GITHUB_ENV"
          {
            echo "chart_version=${CHART_VERSION}"
            echo "chart_repo=${CHART_REPO}"
          } >> "$GITHUB_OUTPUT"

      # Stamped in the CI workspace and never committed. The chart in git keeps
      # its :latest defaults, which is what leaves skaffold and every consumer
      # that reads charts/fundament straight from the repo unaffected.
      #
      # The revision annotation is what makes a version resolvable back to a
      # commit (`helm show chart`); without it 0.1.0-master.2366 names a build
      # nobody can diff.
      - name: Collect image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Stamp the chart
        run: |
          V="$CHART_VERSION" SHA="${{ github.sha }}" mise exec -- yq -i '
            .version = strenv(V) |
            .appVersion = strenv(V) |
            .annotations."org.opencontainers.image.revision" = strenv(SHA) |
            .annotations."org.opencontainers.image.source" = "https://github.com/fundament-oss/fundament"
          ' charts/fundament/Chart.yaml
          V="$CHART_VERSION" mise exec -- yq -i '.deploymentVersion = strenv(V)' charts/fundament/values.yaml

          # By digest, not tag: a tag can be repointed after review, a digest
          # cannot. The image name is the last path segment of the ref, which is
          # what build-image.yml named the artifact after. A missing digest fails
          # the build - every image in `images:` must have a build in the matrix.
          for key in $(mise exec -- yq -r '.images | keys | .[]' charts/fundament/values.yaml); do
            ref=$(mise exec -- yq -r ".images.\"$key\"" charts/fundament/values.yaml)
            repo=${ref%:*}
            file="digests/${repo##*/}"
            if [ ! -s "$file" ]; then
              echo "no digest for images.$key ($ref)" >&2
              exit 1
            fi
            KEY="$key" VAL="${repo}@$(cat "$file")" mise exec -- \
              yq -i '.images[strenv(KEY)] = strenv(VAL)' charts/fundament/values.yaml
          done
          mise exec -- yq '.images' charts/fundament/values.yaml

      - name: Lint and package
        run: |
          mise exec -- helm lint charts/fundament
          mise exec -- helm package charts/fundament --destination dist

      - name: Verify the package
        run: |
          TGZ="dist/fundament-${CHART_VERSION}.tgz"
          # Every image must be digest-pinned. A tag survives review and can be
          # repointed afterwards; on this registry :latest is rewritten by every
          # pull_request build.
          if mise exec -- helm show values "$TGZ" | mise exec -- yq -r '.images[]' | grep -v '@sha256:'; then
            echo "ERROR: the packaged chart has image references that are not digests" >&2
            exit 1
          fi
          mise exec -- helm show chart "$TGZ"

      - name: Push
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | mise exec -- helm registry login ghcr.io \
            --username '${{ github.actor }}' --password-stdin
          mise exec -- helm push "dist/fundament-${CHART_VERSION}.tgz" "oci://${CHART_REPO}"

  # flux-operator on digikluster previews every open PR labelled flux-preview. Fork PRs are
  # skipped: their runs cannot publish the chart or write labels.
  preview-label:
    needs: [gate, publish-chart]
    if: needs.gate.outputs.should_deploy == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Label for a preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label flux-preview

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-environment
          message: |
            ## PR Environment

            | Service | URL |
            |---------|-----|
            | Console | https://console.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Console demo (walkthrough) | https://console-demo.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Authn API | https://authn.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Organization API | https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Kube API Proxy | https://k8s-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Docs | https://docs.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | DCIM | https://dcim.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | DCIM API | https://dcim-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | DCIM Auth | https://dcim-authn.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Marketplace | https://marketplace.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Marketplace Catalog API | https://marketplace-catalog-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Marketplace Registry API | https://marketplace-registry-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Marketplace Admin API | https://marketplace-admin-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Marketplace Developer Portal | https://marketplace-registry.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Marketplace Review Backoffice | https://marketplace-admin.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |

            **Chart:** `${{ needs.publish-chart.outputs.chart_version }}`
            **Namespace:** `tn-fundament-preview-${{ env.PR_NUMBER }}`

            > flux-operator picks up the `flux-preview` label within a minute; the install takes a few more.

            <details>
            <summary>Test credentials (all passwords: <code>password</code>)</summary>

            - alice@acme-corp.com (Acme Corp)
            - bart@acme-corp.com (Acme Corp)
            - cindy@acme-corp.com (Acme Corp)
            - david@globex.com (Globex)
            - emily@globex.com (Globex)
            - frank@initech.com (Initech)
            - grace@initech.com (Initech)
            </details>

            How previews work and how to debug one: [preview environments](https://github.com/fundament-oss/fundament/blob/master/docs/developer/fundament/preview-environments.md).

  # Owns the wait for Flux to roll out this commit, so the test jobs below start
  # against a settled environment instead of each polling for it themselves.
  # A failure here means the deployment never landed — the tests are skipped
  # rather than reporting it as a test failure.
  environment-ready:
    needs: [publish-chart, preview-label]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Wait for this commit to be deployed
        run: |
          .github/scripts/wait-for-deployment.sh \
            "https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
            "${{ needs.publish-chart.outputs.chart_version }}"

  terraform-acc-tests:
    needs: environment-ready
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Run Terraform acceptance tests
        run: |
          cd terraform-provider
          FUNDAMENT_ENDPOINT="https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          TF_ACC=1 \
          TF_ACC_TERRAFORM_PATH="$(which tofu)" \
          TF_ACC_PROVIDER_HOST=registry.opentofu.org \
          go test -v ./...

  e2e-tests:
    needs: environment-ready
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd e2e && bun install

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          cd e2e
          BASE_URL="https://console.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          ORGANIZATION_API_URL="https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          AUTHN_API_URL="https://authn.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          PLUGIN_PROXY_URL="https://plugin-proxy.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          bun run test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e/reports/

  preview-unlabel:
    needs: gate
    if: needs.gate.outputs.should_teardown == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove the preview label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label flux-preview

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-environment
          message: |
            ## PR Environment - Torn Down

            The environment for this PR has been removed.
