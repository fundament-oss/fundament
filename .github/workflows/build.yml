name: Build

on:
  push:
    branches: [master]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
    branches: [master]

concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOMAIN: fundament.digilab.reviews
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fundament
  PR_NUMBER: ${{ github.event.number }}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      should_teardown: ${{ steps.check.outputs.should_teardown }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          LABEL_NAME: ${{ github.event.label.name }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-preview-env') }}
        run: |
          should_deploy=false
          should_teardown=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            case "$ACTION" in
              closed|converted_to_draft)
                should_teardown=true
                ;;
              labeled)
                [ "$LABEL_NAME" = "no-preview-env" ] && should_teardown=true
                ;;
              opened|reopened|synchronize|ready_for_review|unlabeled)
                if [ "$IS_DRAFT" = "false" ] && [ "$HAS_SKIP_LABEL" = "false" ]; then
                  should_deploy=true
                fi
                ;;
            esac
          fi

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "should_teardown=$should_teardown" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: github.event_name == 'push' || needs.gate.outputs.should_deploy == 'true'
    strategy:
      matrix:
        include:
          - image-name: authn-api
            dockerfile: authn-api/Dockerfile
            context: "."
          - image-name: organization-api
            dockerfile: organization-api/Dockerfile
            context: "."
          - image-name: db-migrations
            dockerfile: db/Dockerfile
            context: db
          - image-name: console-frontend
            dockerfile: console-frontend/Dockerfile
            context: "."
          # Same image, built from the demo entrypoint: the guided walkthrough on
          # in-memory data, served on the console-demo subdomain.
          - image-name: console-demo-frontend
            dockerfile: console-frontend/Dockerfile
            context: "."
            build-args: BUILD_SCRIPT=build:demo
          - image-name: cluster-worker
            dockerfile: cluster-worker/Dockerfile
            context: "."
          - image-name: authz-worker
            dockerfile: authz-worker/Dockerfile
            context: "."
          - image-name: kube-api-proxy
            dockerfile: kube-api-proxy/Dockerfile
            context: "."
          - image-name: plugin-proxy
            dockerfile: plugin-proxy/Dockerfile
            context: "."
          - image-name: openfga-setup
            dockerfile: openfga/setup/Dockerfile
            context: openfga/setup
          - image-name: docs-frontend
            dockerfile: docs-frontend/Dockerfile
            context: "."
          - image-name: dcim-api
            dockerfile: dcim-api/Dockerfile
            context: "."
          - image-name: dcim-frontend
            dockerfile: dcim-frontend/Dockerfile
            context: "."
          - image-name: dcim-authn-api
            dockerfile: dcim-authn-api/Dockerfile
            context: "."
          - image-name: openfsc-operator
            dockerfile: openfsc-operator/Dockerfile
            context: "."
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      build-args: ${{ matrix.build-args }}

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    env:
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      JWT_SECRET: ${{ secrets.PR_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: image_tag
        run: |
          REF_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          IMAGE_TAG="${{ github.sha }}-${REF_NAME}-${{ github.run_number }}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          # Exported so the test jobs can wait for this release specifically.
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Clone Flux repo
        run: |
          git clone --depth 1 "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ vars.GITLAB_REPO_HOST }}/${{ vars.GITLAB_REPO_PATH }}.git" flux-repo
          cd flux-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate PR overlay
        run: |
          PR_DIR="flux-repo/apps/fundament/overlays/pr/pr-${PR_NUMBER}"
          mkdir -p "$PR_DIR"

          export PR_NUM="$PR_NUMBER"
          export PR_BRANCH="$PR_BRANCH"
          export DOMAIN="$DOMAIN"
          export IMAGE_PREFIX="$IMAGE_PREFIX"
          export IMAGE_TAG="$IMAGE_TAG"
          export JWT_SECRET="$JWT_SECRET"

          # Generate resources.yaml from the template in the repo.
          # Only the listed variables are substituted; dollar signs in bcrypt hashes are left intact.
          envsubst '${PR_NUM} ${PR_BRANCH} ${DOMAIN} ${IMAGE_PREFIX} ${IMAGE_TAG} ${JWT_SECRET}' \
            < charts/fundament/pr-overlay.yaml \
            > "$PR_DIR/resources.yaml"

      - name: Update kustomization.yaml
        run: |
          cd flux-repo
          KUSTOMIZATION="apps/fundament/overlays/pr/kustomization.yaml"

          # Create base kustomization if it doesn't exist
          if [ ! -f "$KUSTOMIZATION" ]; then
            mkdir -p "$(dirname "$KUSTOMIZATION")"
            cat > "$KUSTOMIZATION" << 'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
          EOF
          fi

          # Add PR resource entry if not already present
          PR_ENTRY="pr-${PR_NUMBER}/resources.yaml"
          if ! grep -q "$PR_ENTRY" "$KUSTOMIZATION"; then
            echo "  - $PR_ENTRY" >> "$KUSTOMIZATION"
          fi

      - name: Commit and push
        run: |
          cd flux-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: PR #${PR_NUMBER} environment

          Commit: ${IMAGE_TAG}
          Branch: ${PR_BRANCH}"
            git push
          fi

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-environment
          message: |
            ## PR Environment

            | Service | URL |
            |---------|-----|
            | Console | https://console.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Console demo (walkthrough) | https://console-demo.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Authn API | https://authn.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Organization API | https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Kube API Proxy | https://k8s-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | Docs | https://docs.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | DCIM | https://dcim.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | DCIM API | https://dcim-api.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |
            | DCIM Auth | https://dcim-authn.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }} |

            **Commit:** `${{ env.IMAGE_TAG }}`
            **Namespace:** `tn-fundament-pr-${{ env.PR_NUMBER }}`

            > Environment will be ready once Flux reconciles (~5 min after images are built).

            <details>
            <summary>Test credentials (all passwords: <code>password</code>)</summary>

            - alice@acme-corp.com (Acme Corp)
            - bart@acme-corp.com (Acme Corp)
            - cindy@acme-corp.com (Acme Corp)
            - david@globex.com (Globex)
            - emily@globex.com (Globex)
            - frank@initech.com (Initech)
            - grace@initech.com (Initech)
            </details>

            <details>
            <summary>Debugging this environment</summary>

            Kubeconfig and pinniped setup: see the [deployment and infra docs](https://gitlab.com/digilab.overheid.nl/miscellaneous/team-documentation/-/blob/main/deployment-and-infra.md).

            **1. Connect**

            ```bash
            export KUBECONFIG=~/.kube/pinniped_digikluster.yaml
            export NS=tn-fundament-pr-${{ env.PR_NUMBER }}
            kubectl -n $NS get pods
            ```

            **2. Flux reconciliation**

            ```bash
            kubectl -n $NS get helmrelease,gitrepository
            kubectl -n $NS describe helmrelease fundament
            kubectl -n $NS describe gitrepository fundament   # auth / branch / commit issues surface here

            # Force a retry
            kubectl -n $NS annotate --overwrite helmrelease/fundament \
              reconcile.fluxcd.io/requestedAt="$(date +%s)"
            ```

            **3. Pod / app state**

            ```bash
            kubectl -n $NS get pods
            kubectl -n $NS get events --sort-by=.lastTimestamp
            kubectl -n $NS describe pod <pod>   # readiness probes, env refs, and pod events
            kubectl -n $NS logs <pod>
            kubectl -n $NS logs <pod> --previous   # if the pod crashed

            # Narrow to a single service (app.kubernetes.io/name = authn-api, organization-api,
            # console-frontend, docs-frontend, cluster-worker, authz-worker, kube-api-proxy, dex, openfga)
            kubectl -n $NS get pods -l app.kubernetes.io/name=organization-api
            ```

            **4. OpenFGA / authorization config**

            ```bash
            # organization-api and kube-api-proxy readiness depend on OpenFGA.
            kubectl -n $NS get configmap openfga-config -o yaml
            kubectl -n $NS logs -l app.kubernetes.io/name=openfga -c setup
            kubectl -n $NS logs -l app.kubernetes.io/name=openfga -c openfga --tail=100

            # If consumers are still using an old store/model ID after setup patched openfga-config:
            kubectl -n $NS rollout restart deployment/organization-api deployment/kube-api-proxy
            ```

            **5. DB & migrations**

            ```bash
            kubectl -n $NS get cluster.postgresql.cnpg.io/db
            kubectl -n $NS describe cluster.postgresql.cnpg.io/db

            # Migrations run as a Job named db-migrations-<helm-revision>, with a
            # 5m TTL after success. If the Job is gone, migrations almost
            # certainly succeeded.
            kubectl -n $NS get jobs -l app.kubernetes.io/name=db-migrations
            kubectl -n $NS logs -l app.kubernetes.io/name=db-migrations -c migrations

            # OpenFGA blocks on that Job before migrating its schema. If openfga
            # is stuck in Init, this is why:
            kubectl -n $NS logs -l app.kubernetes.io/name=openfga -c wait-for-reset
            ```

            **6. Routes & TLS**

            ```bash
            kubectl -n $NS get httproutes
            kubectl -n istio-gateway get certificate tn-fundament-pr-${{ env.PR_NUMBER }}-wildcard-tls
            ```

            **7. Nothing deployed at all?**

            If the namespace is missing, the PR overlay never reached the cluster. Check the [PR overlay in the Flux repo](https://${{ vars.GITLAB_REPO_HOST }}/${{ vars.GITLAB_REPO_PATH }}/-/tree/master/apps/fundament/overlays/pr/pr-${{ env.PR_NUMBER }}) — if it's not there, the CI push to the Flux repo failed; if it is, the cluster-level Flux reconciliation is stuck.
            </details>

  terraform-acc-tests:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Wait for this commit to be deployed
        run: |
          .github/scripts/wait-for-deployment.sh \
            "https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
            "${{ needs.deploy.outputs.image_tag }}"

      - name: Run Terraform acceptance tests
        run: |
          cd terraform-provider
          FUNDAMENT_ENDPOINT="https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          TF_ACC=1 \
          TF_ACC_TERRAFORM_PATH="$(which tofu)" \
          TF_ACC_PROVIDER_HOST=registry.opentofu.org \
          go test -v ./...

  e2e-tests:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd e2e && bun install

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install chromium --with-deps

      - name: Wait for this commit to be deployed
        run: |
          .github/scripts/wait-for-deployment.sh \
            "https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
            "${{ needs.deploy.outputs.image_tag }}"

      - name: Run E2E tests
        run: |
          cd e2e
          BASE_URL="https://console.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          ORGANIZATION_API_URL="https://organization.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          AUTHN_API_URL="https://authn.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          PLUGIN_PROXY_URL="https://plugin-proxy.pr${{ env.PR_NUMBER }}.${{ env.DOMAIN }}" \
          bun run test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e/reports/

  teardown:
    needs: gate
    if: needs.gate.outputs.should_teardown == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Clone Flux repo
        run: |
          git clone --depth 1 "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ vars.GITLAB_REPO_HOST }}/${{ vars.GITLAB_REPO_PATH }}.git" flux-repo
          cd flux-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove PR overlay
        run: |
          cd flux-repo
          PR_DIR="apps/fundament/overlays/pr/pr-${PR_NUMBER}"

          # Remove PR directory
          rm -rf "$PR_DIR"

          # Remove entry from kustomization.yaml
          KUSTOMIZATION="apps/fundament/overlays/pr/kustomization.yaml"
          if [ -f "$KUSTOMIZATION" ]; then
            sed -i "\|pr-${PR_NUMBER}/resources.yaml|d" "$KUSTOMIZATION"
          fi

      - name: Commit and push
        run: |
          cd flux-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "teardown: PR #${PR_NUMBER} environment"
            git push
          fi

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-environment
          message: |
            ## PR Environment - Torn Down

            The environment for this PR has been removed.
