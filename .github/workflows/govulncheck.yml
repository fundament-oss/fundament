name: govulncheck
on:
  push:
  pull_request:
  schedule: # daily at 10:30 UTC
    - cron: '30 10 * * *'
  workflow_dispatch:
# Only runs of the same PR share a group; master pushes and scheduled runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Check dependency age
        run: go run ./tools/gomod-age/cmd/gomod-age --config .gomod-age.json
