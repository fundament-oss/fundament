<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fundament DCIM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link rel="shortcut icon" href="/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Apply the saved/system theme before first paint to avoid a flash of the
         wrong theme on reload. Mirrors ThemeService.initializeTheme(). The saved
         choice is a cookie shared with the other Fundament apps (see
         src/app/theme-cookie.ts); localStorage is where earlier versions kept it. -->
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/);
          var saved = match ? match[1] : localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
