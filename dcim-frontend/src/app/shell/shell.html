<nldd-app-view>
  <nldd-bar-split-view>
    <!-- Header: the product, the theme and who you are. Everything about a
         section moved into the sidebar, so this bar holds only what is true on
         every screen. -->
    <nldd-split-view-pane
      slot="header"
      sm-order="1"
      md-order="1"
      lg-order="1"
      background="base"
    >
      <nldd-container
        padding-left="16"
        padding-right="8"
        padding-block="8"
      >
        <nldd-toolbar label="Application">
          <nldd-toolbar-title
            slot="start"
            text="Fundament DCIM"
            href="/"
          >
            <!-- The same mark as the favicon, so the tab and the toolbar say the
                 same thing. Empty alt because the name stands beside it. -->
            <img
              slot="media"
              src="/img/favicon.svg"
              alt=""
              height="32"
            />
          </nldd-toolbar-title>
          <!-- Everything about your own account in one place: who you are, how
               the app looks and the way out. The theme was a control of its own
               in the bar, which put a setting you touch twice a year next to the
               things you use all day. -->
          <nldd-toolbar-item slot="end">
            <nldd-icon-button
              icon="account"
              [attr.accessible-label]="userName() || 'Account'"
              variant="secondary"
              expandable
              popup-type="menu"
            >
              <nldd-avatar
                slot="icon"
                [attr.name]="userName() || 'Unknown'"
                color="inherit"
                icon-aligned
                decorative
              ></nldd-avatar>
              <nldd-menu
                slot="popup"
                placement="bottom-end"
              >
                <!-- The header slot is unpadded on purpose, so the container
                     supplies the spacing. -->
                <nldd-container
                  slot="header"
                  padding-inline="16"
                  padding-block="12"
                >
                  <nldd-identity [attr.text]="userName() || 'Unknown'"></nldd-identity>
                </nldd-container>
                <nldd-menu-item
                  text="Appearance"
                  icon="appearance"
                >
                  <nldd-menu>
                    <nldd-menu-item
                      text="System"
                      icon="display"
                      type="radio"
                      [attr.selected]="theme.themePreference() === 'system' ? '' : null"
                      (select)="theme.setTheme('system')"
                    ></nldd-menu-item>
                    <nldd-menu-item
                      text="Light"
                      icon="light-mode"
                      type="radio"
                      [attr.selected]="theme.themePreference() === 'light' ? '' : null"
                      (select)="theme.setTheme('light')"
                    ></nldd-menu-item>
                    <nldd-menu-item
                      text="Dark"
                      icon="dark-mode"
                      type="radio"
                      [attr.selected]="theme.themePreference() === 'dark' ? '' : null"
                      (select)="theme.setTheme('dark')"
                    ></nldd-menu-item>
                  </nldd-menu>
                </nldd-menu-item>
                <nldd-menu-divider></nldd-menu-divider>
                <nldd-menu-item
                  text="Log out"
                  icon="logout"
                  (select)="handleLogout()"
                ></nldd-menu-item>
              </nldd-menu>
            </nldd-icon-button>
          </nldd-toolbar-item>
        </nldd-toolbar>
      </nldd-container>
    </nldd-split-view-pane>
    <nldd-split-view-pane
      slot="main"
      sm-order="2"
      md-order="2"
      lg-order="2"
    >
      <!-- No sidebar-as-sheet: collapsed to one column the split view drops
           `hide-back` on the deeper panes, and each page's title bar carries the
           way back. -->
      <nldd-navigation-split-view
        sidebar-accessible-label="Navigation"
        (back)="onPaneBack()"
      >
        <!-- The sections, which were a row of tabs above the page. A menu that
             stands beside what it opens can hold a count, a status dot and a
             second level; a row of tabs runs out of room at six. -->
        <nldd-split-view-pane
          slot="sidebar"
          background="base"
          has-content
        >
          <nldd-simple-section>
            <nldd-title size="3">
              <h1>Data center</h1>
            </nldd-title>
            <nldd-spacer size="8"></nldd-spacer>
            <nldd-list
              type="navigation"
              dividers="on-touch"
              aria-label="Sections"
            >
              @for (item of sections; track item.path) {
                <nldd-list-item
                  [attr.href]="item.path"
                  [attr.selected]="isCurrent(item.path) ? '' : null"
                  (click)="navigate($event, item.path)"
                >
                  <nldd-icon-cell
                    [attr.icon]="item.icon"
                    size="20"
                  ></nldd-icon-cell>
                  <nldd-spacer-cell size="8"></nldd-spacer-cell>
                  <nldd-text-cell [attr.text]="item.text"></nldd-text-cell>
                </nldd-list-item>
              }
            </nldd-list>
          </nldd-simple-section>
        </nldd-split-view-pane>
        <!-- Filled by the page: the rack list, the categories, the filters. The
             page knows that content and the data behind it. -->
        @if (secondaryNav.content(); as menu) {
          <nldd-split-view-pane
            slot="secondary-sidebar"
            background="base"
            [attr.has-content]="stackDepth() >= 1 ? '' : null"
          >
            <ng-container [ngTemplateOutlet]="menu"></ng-container>
          </nldd-split-view-pane>
        }
        <!-- The outlet anchor and the routed component around it are plumbing,
             and a pane grows everything it slots. Both are taken out of the
             layout in styles.css, so the page inside is the pane's own child. -->
        <nldd-split-view-pane
          slot="main"
          [attr.has-content]="stackDepth() >= 2 ? '' : null"
        >
          <router-outlet />
        </nldd-split-view-pane>
      </nldd-navigation-split-view>
    </nldd-split-view-pane>
  </nldd-bar-split-view>
</nldd-app-view>
