<nldd-page>
  <!-- The same lockup as the shell: this page has no navigation, but it is still
       the same product, and the bar is what says so. -->
  <nldd-container slot="header" padding-left="16" padding-right="8" padding-block="8">
    <nldd-toolbar label="Application">
      <nldd-toolbar-title slot="start" text="Fundament DCIM" href="/">
        <img slot="media" src="/img/fundament-logo.svg" alt="" height="32" />
      </nldd-toolbar-title>
      <nldd-toolbar-item slot="end">
        <app-theme-toggle />
      </nldd-toolbar-item>
    </nldd-toolbar>
  </nldd-container>

  <!-- Centered rather than top-aligned: the page holds one thing, and a form of
       two fields hanging under the header reads as an afterthought. -->
  <nldd-simple-section horizontal-alignment="center" vertical-alignment="center">
    <!-- The panel carries its own width; the section only says where it sits. -->
    <nldd-container max-width="480px">
      <!-- Everything in one box: the heading says what you are logging in to,
           so it belongs to the form rather than floating above it. -->
      <nldd-box>
        <!-- The inset grows with the box: 16 on a phone, 32 once there is room
             for it. The breakpoints resolve against this container's own width,
             not the page's. -->
        <nldd-container padding="16" md-padding="24" lg-padding="32">
          <nldd-title size="3">
            <h1>Log in to DCIM</h1>
          </nldd-title>
          <nldd-spacer size="12"></nldd-spacer>
          <nldd-rich-text spacing="flat">
            <p>Where your team keeps its racks, its cables and the work on them.</p>
          </nldd-rich-text>
          <nldd-spacer size="24"></nldd-spacer>
          @if (error(); as message) {
            <nldd-banner
              variant="critical"
              text="Signing in failed"
              [attr.supporting-text]="message"
            ></nldd-banner>
            <nldd-spacer size="16"></nldd-spacer>
          }
          <nldd-form [formGroup]="loginForm" (ngSubmit)="onSubmit()" (keydown.enter)="onSubmit()">
            <!-- No placeholders: the label already says which field this is, and
                 a hint that disappears the moment you type is a label you can
                 lose. -->
            <nldd-form-field label="Email address">
              <nldd-text-field
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                appAutofocus
                [value]="email?.value ?? ''"
                (input)="loginForm.get('email')!.setValue($any($event.target).value)"
                (blur)="loginForm.get('email')!.markAsTouched()"
                [invalid]="!!(email?.invalid && email.touched)"
                error-message="login-email-error"
              ></nldd-text-field>
              <nldd-form-field-error-text id="login-email-error">
                {{ getEmailError() }}
              </nldd-form-field-error-text>
            </nldd-form-field>
            <nldd-form-field label="Password">
              <nldd-password-field
                id="password"
                autocomplete="current-password"
                [value]="password?.value ?? ''"
                (input)="loginForm.get('password')!.setValue($any($event.target).value)"
                (blur)="loginForm.get('password')!.markAsTouched()"
                show-text="Show"
                show-accessible-label="Show password"
                hide-text="Hide"
                hide-accessible-label="Hide password"
                [invalid]="!!(password?.invalid && password.dirty)"
                error-message="login-password-error"
              ></nldd-password-field>
              <nldd-form-field-error-text id="login-password-error">
                {{ getPasswordError() }}
              </nldd-form-field-error-text>
            </nldd-form-field>
            <nldd-form-actions>
              <!-- Never switched off: a button you cannot press says nothing
                   about what is missing, and the loading state already says it
                   is busy. -->
              <nldd-button
                type="submit"
                text="Sign in"
                variant="primary"
                width="full"
                [attr.loading]="isLoading() ? '' : null"
                (click)="onSubmit()"
              ></nldd-button>
            </nldd-form-actions>
          </nldd-form>
        </nldd-container>
      </nldd-box>
    </nldd-container>
  </nldd-simple-section>
</nldd-page>
