<nldd-form>
  <nldd-form-field label="Title">
    <nldd-text-field
      #editTitleInput
      id="editTitle"
      accessible-label="Title"
      class="w-full"
      error-message="editTitle-error"
      [attr.invalid]="titleInvalid() ? '' : null"
      [value]="editFormTitle()"
      (change)="editFormTitle.set($any($event).detail?.value ?? '')"
      (input)="editFormTitle.set($any($event.target).value)"
      (keydown.enter)="save()"
    ></nldd-text-field>
    <nldd-form-field-error-text id="editTitle-error"
      >Title is required.</nldd-form-field-error-text
    >
  </nldd-form-field>
  <nldd-form-field label="Description" optional optional-label="Optional">
    <nldd-multi-line-text-field
      id="editDescription"
      rows="3"
      resize="vertical"
      [value]="editFormDescription()"
      (input)="editFormDescription.set($any($event).target.value)"
    ></nldd-multi-line-text-field>
  </nldd-form-field>
  <nldd-form-field label="Due date" optional optional-label="Optional">
    <nldd-date-field
      input-id="editDue"
      [attr.value]="editFormDue()"
      (change)="editFormDue.set($any($event).detail?.value ?? '')"
    ></nldd-date-field>
  </nldd-form-field>
  <nldd-form-field label="Assignee">
    <nldd-combo-box
      id="editAssignee"
      [attr.value]="editFormAssignee() ?? ''"
      (change)="editFormAssignee.set($any($event).detail.value || null)"
    >
      <nldd-menu>
        <nldd-menu-item value="" text="Unassigned"></nldd-menu-item>
        @for (tech of technicians(); track tech.id) {
          <nldd-menu-item
            [attr.value]="tech.id"
            [attr.text]="tech.name"
            [attr.details]="tech.available ? 'Available' : 'Busy'"
          ></nldd-menu-item>
        }
      </nldd-menu>
    </nldd-combo-box>
  </nldd-form-field>
  <nldd-form-field label="Status">
    <nldd-toggle-button-group type="radio" accessible-label="Status">
      @for (s of STATUSES; track s) {
        <nldd-toggle-button
          [attr.value]="s"
          [attr.text]="s"
          [attr.selected]="editFormStatus() === s ? '' : null"
          (change)="onStatusToggle(s, $any($event).detail.selected)"
        ></nldd-toggle-button>
      }
    </nldd-toggle-button-group>
  </nldd-form-field>
  <nldd-form-field label="Priority">
    <nldd-toggle-button-group type="radio" accessible-label="Priority">
      @for (p of PRIORITIES; track p) {
        <nldd-toggle-button
          [attr.value]="p"
          [attr.text]="p"
          [attr.selected]="editFormPriority() === p ? '' : null"
          (change)="onPriorityToggle(p, $any($event).detail.selected)"
        ></nldd-toggle-button>
      }
    </nldd-toggle-button-group>
  </nldd-form-field>
  <!-- A token field rather than one text box: a task carries more than
       one tag, and each stands on its own. -->
  <nldd-form-field label="Tags" optional optional-label="Optional">
    <!-- The tags already in use are offered as you type, so the same
         thing does not end up spelled three ways; anything new is still
         allowed. -->
    <nldd-token-field
      id="editTags"
      allow-custom
      [attr.values]="editFormTags().join(',')"
      (change)="editFormTags.set($any($event).detail.values ?? [])"
    >
      <nldd-menu>
        @for (tag of knownTags(); track tag) {
          <nldd-menu-item [attr.value]="tag" [attr.text]="tag"></nldd-menu-item>
        }
      </nldd-menu>
    </nldd-token-field>
  </nldd-form-field>
  <nldd-form-actions>
    <nldd-button variant="primary" width="full" text="Save" (click)="save()"></nldd-button>
  </nldd-form-actions>
</nldd-form>
