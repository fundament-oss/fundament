<nldd-page sticky-header>
  <!-- Its own page inside the sheet, so the cable form is one step back. The
       bar keeps the way back in full words until the title scrolls under it;
       from then on it carries the title and the back button is a chevron. -->
  <nldd-top-title-bar
    slot="header"
    [attr.text]="title()"
    back-text="Cable"
    collapse-anchor="ports-title"
    (back)="back.emit()"
  ></nldd-top-title-bar>

  <nldd-simple-section>
    <nldd-title id="ports-title" size="3">
      <h1>{{ title() }}</h1>
    </nldd-title>
    <nldd-spacer size="12"></nldd-spacer>

    <!-- What the device has. Removing is the one thing you can do to a row, and
         the button stands there rather than appearing on hover: on a touch
         screen there is no hover to appear on. -->
    <nldd-list variant="box-tinted" accessible-label="Ports" empty-text="No ports on this device">
      @for (port of ports(); track port.id) {
        <nldd-list-item>
          <nldd-text-cell width="full" [attr.text]="port.name"></nldd-text-cell>
          <nldd-spacer-cell size="12"></nldd-spacer-cell>
          <nldd-text-cell
            width="fit-content"
            color="secondary"
            [attr.text]="PORT_TYPE_LABEL[port.type]"
          ></nldd-text-cell>
          <nldd-spacer-cell size="12"></nldd-spacer-cell>
          <nldd-cell width="fit-content">
            <nldd-icon-button
              icon="trash"
              variant="secondary"
              size="sm"
              [attr.text]="'Remove ' + port.name"
              (click)="askRemove(port)"
            ></nldd-icon-button>
          </nldd-cell>
        </nldd-list-item>
      }
    </nldd-list>

    <nldd-spacer size="24"></nldd-spacer>

    <!-- In a box of its own, because it is something you fill in rather than
         another row of the list above. Adding writes straight through, so this
         is the only button here and it does what it says. -->
    <nldd-box background="tinted">
      <nldd-container padding-inline="16" padding-block="16">
        <nldd-form>
          <nldd-form-section text="Add port">
            <nldd-form-field label="Name">
              <nldd-text-field
                id="new-port-name"
                [attr.value]="newPortName()"
                [attr.invalid]="nameError() ? '' : null"
                [attr.error-message]="nameError() ? 'new-port-name-error' : null"
                (input)="newPortName.set($any($event.target).value)"
                (keydown.enter)="addPort()"
              ></nldd-text-field>
              @if (nameError()) {
                <nldd-form-field-error-text id="new-port-name-error">{{
                  nameError()
                }}</nldd-form-field-error-text>
              }
            </nldd-form-field>

            <nldd-form-field label="Type">
              <nldd-combo-box
                id="new-port-type"
                [attr.value]="newPortType()"
                (change)="newPortType.set($any($event).detail.value)"
              >
                <nldd-menu>
                  @for (pt of PORT_TYPES; track pt.value) {
                    <nldd-menu-item [attr.value]="pt.value" [attr.text]="pt.label"></nldd-menu-item>
                  }
                </nldd-menu>
              </nldd-combo-box>
            </nldd-form-field>
          </nldd-form-section>

          <nldd-form-actions>
            <nldd-button
              variant="secondary"
              text="Add port"
              start-icon="plus-small"
              width="full"
              (click)="addPort()"
            ></nldd-button>
          </nldd-form-actions>
        </nldd-form>
      </nldd-container>
    </nldd-box>
  </nldd-simple-section>
</nldd-page>

<!-- A port that carries a cable somewhere else disappears with it, so this asks
     before it happens: there is no save step left to take it back. -->
<nldd-modal-dialog
  #removeModal
  variant="alert"
  icon="trash"
  [attr.text]="'Remove ' + (removing()?.name ?? '') + '?'"
  supporting-text="The port disappears from this device. A cable that runs to it loses that end."
  accessible-label="Confirm removing the port"
  (close)="cancelRemove()"
>
  <nldd-button
    slot="actions"
    variant="primary"
    text="Keep port"
    (click)="cancelRemove()"
  ></nldd-button>
  <nldd-button
    slot="actions"
    variant="destructive"
    text="Remove port"
    (click)="confirmRemove()"
  ></nldd-button>
</nldd-modal-dialog>
