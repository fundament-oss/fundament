<!-- ══════════════════════════════════════════════════════════════
     CABLE LIST (this section's page)
     ══════════════════════════════════════════════════════════════ -->
<!-- The list carries the page: its own header, its own title, its own toolbar.
     What the buttons in that toolbar do lives here, because the cables, the
     shopping list and the topology are this component's data. -->
<app-cable-list
  class="contents"
  [cables]="dcCables()"
  [dcId]="selectedDcId()"
  [sites]="sites()"
  (editCable)="openEditCable($event)"
  (deleteCable)="openDeleteCable($event)"
  (dcSelected)="selectDc($event)"
  (addCable)="openAddCable()"
  (cableStatusChanged)="updateCableStatus($event)"
  (showShoppingList)="openShoppingList()"
  (showTopology)="openTopology()"
/>

<!-- ══════════════════════════════════════════════════════════════
     TOPOLOGY SHEET
     ══════════════════════════════════════════════════════════════ -->
<!-- The topology is a second way of looking at the same cables, not a second
     page: it opens over the list and closes back onto it. A bottom sheet gives
     the canvas the full width it needs and says it is temporary. -->
<nldd-sheet
  #topologySheet
  accessible-label="Cable topology"
  placement="bottom"
  (close)="topologyOpen.set(false)"
>
  <nldd-page sticky-header>
    <nldd-top-title-bar
      slot="header"
      text="Topology"
      dismiss-text="Close"
      (dismiss)="topologyOpen.set(false)"
    ></nldd-top-title-bar>
    <!-- One bar for everything you can set about the drawing: which hall, which
         states, which kinds. A container rather than a section, because this is
         a strip of controls over a canvas and not a piece of the page. -->
    <nldd-container padding-inline="16" padding-block="8">
      <nldd-toolbar label="Topology">
        <!-- Which hall is drawn. The list can show every location at once, a
             drawing cannot: two data centers on one canvas are two islands, not
             a floor. So the topology picks one, the way the shopping list
             does. -->
        @if (sites().length > 1) {
          <nldd-toolbar-item slot="start">
            <nldd-toggle-button-group type="radio" accessible-label="Data center">
              @for (dc of sites(); track dc.id) {
                <nldd-toggle-button
                  [attr.value]="dc.id"
                  [attr.text]="dc.name"
                  [attr.selected]="topologyDcId() === dc.id ? '' : null"
                  (change)="onTopologyDcToggle(dc.id, $any($event).detail.selected)"
                ></nldd-toggle-button>
              }
            </nldd-toggle-button-group>
          </nldd-toolbar-item>
        }
        <!-- The two filters as menus rather than as a row of buttons: six states
             and thirteen kinds is a wall of choices next to a location you can
             count on one hand, and the button says which one is on. -->
        <nldd-toolbar-item slot="start">
          <nldd-button
            variant="secondary"
            expandable
            popup-type="menu"
            [attr.text]="topologyStatusLabel()"
          >
            <nldd-menu slot="popup" accessible-label="Filter by status">
              <nldd-menu-item
                type="radio"
                text="All states"
                [attr.selected]="topologyStatusFilter() === '' ? '' : null"
                (select)="topologyStatusFilter.set('')"
              ></nldd-menu-item>
              @for (s of CABLE_STATUSES; track s.value) {
                <nldd-menu-item
                  type="radio"
                  [attr.text]="s.label"
                  [attr.selected]="topologyStatusFilter() === s.value ? '' : null"
                  (select)="topologyStatusFilter.set(s.value)"
                ></nldd-menu-item>
              }
            </nldd-menu>
          </nldd-button>
        </nldd-toolbar-item>
        <nldd-toolbar-item slot="start">
          <nldd-button
            variant="secondary"
            expandable
            popup-type="menu"
            [attr.text]="topologyTypeLabel()"
          >
            <nldd-menu slot="popup" accessible-label="Filter by type">
              <nldd-menu-item
                type="radio"
                text="All types"
                [attr.selected]="topologyTypeFilter() === '' ? '' : null"
                (select)="topologyTypeFilter.set('')"
              ></nldd-menu-item>
              @for (t of CABLE_TYPES; track t) {
                <nldd-menu-item
                  type="radio"
                  [attr.text]="CABLE_TYPE_LABEL[t]"
                  [attr.selected]="topologyTypeFilter() === t ? '' : null"
                  (select)="topologyTypeFilter.set(t)"
                ></nldd-menu-item>
              }
            </nldd-menu>
          </nldd-button>
        </nldd-toolbar-item>
        @if (topologyStatusFilter() || topologyTypeFilter()) {
          <nldd-toolbar-item slot="end">
            <nldd-button
              variant="secondary"
              text="Clear"
              (click)="topologyStatusFilter.set(''); topologyTypeFilter.set('')"
            ></nldd-button>
          </nldd-toolbar-item>
        }
      </nldd-toolbar>
    </nldd-container>
    <!-- Full bleed: the canvas is the content, so it takes the sheet's width and
         whatever height is left under the filters. -->
    <app-patch-mapping-flow
      class="block w-full flex-1 min-h-0"
      [cables]="topologyCables()"
      [devicePorts]="localDevicePorts()"
      [devices]="dcDevices()"
      [selectedCableId]="editCable()?.id ?? null"
      [dcId]="topologyDcId()"
      [filterStatus]="topologyStatusFilter()"
      [filterType]="topologyTypeFilter()"
      (cableSelected)="openEditCableById($event)"
      (connectionMade)="openAddCableFromConnection($event)"
      (cableStatusChanged)="updateCableStatus($event)"
    />
  </nldd-page>
</nldd-sheet>

<!-- ══════════════════════════════════════════════════════════════
     SHOPPING LIST SHEET
     ══════════════════════════════════════════════════════════════ -->
<nldd-sheet
  #shoppingSheet
  accessible-label="Shopping list"
  placement="right"
  (close)="shoppingListOpen.set(false)"
>
  <app-shopping-list [cables]="orderCables()" [sites]="sites()" />
</nldd-sheet>

<!-- ══════════════════════════════════════════════════════════════
     DELETE CABLE MODAL
     ══════════════════════════════════════════════════════════════ -->
<nldd-modal-dialog
  variant="alert"
  #deleteModal
  (close)="cancelDelete()"
  [attr.text]="
    'Delete cable ' +
    (deleteCable()?.label
      ? '&quot;' + deleteCable()!.label + '&quot;'
      : (deleteCable()?.aSide?.deviceName ?? '') +
        ' → ' +
        (deleteCable()?.bSide?.deviceName ?? '')) +
    '?'
  "
  supporting-text="The patch between both ports is removed and the ports become free again. This cannot be undone."
  accessible-label="Confirm cable deletion"
>
  <nldd-button
    slot="actions"
    variant="primary"
    text="Keep cable"
    (click)="cancelDelete()"
  ></nldd-button>
  <nldd-button
    slot="actions"
    variant="destructive"
    text="Delete cable"
    (click)="confirmDelete()"
  ></nldd-button>
</nldd-modal-dialog>
