version: v2
plugins:
  - local: protoc-gen-es
    out: src/generated
    opt:
      - target=ts
    include_imports: true
inputs:
  - directory: ../dcim-api/pkg/proto
  - directory: ../dcim-authn-api/pkg/proto
  # The staff fleet view (FUN-23). Only fleet.v1: the public overview belongs
  # to the console.
  - directory: ../platform-api/pkg/proto
    paths:
      - ../platform-api/pkg/proto/fleet
