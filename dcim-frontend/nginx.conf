# -----------------------------------------------------------------------------
# Caching
#
# The build's own output (main, polyfills, styles, chunks and everything under
# media/) carries a content hash in its name, so it can be cached for good.
# Everything else, index.html and assets/config/config.json first of all, is
# fetched by a stable path and has to be revalidated: a stale index.html points
# at chunks a redeploy has removed.
#
# Not `always`, so a 404 carries no Cache-Control: a chunk that 404s on an old
# pod mid-rollout must not be remembered as gone for a year.
# -----------------------------------------------------------------------------
map $uri $cache_control {
    ~^/(?:(?:main|polyfills|styles|chunk)-[^/]+\.(?:js|css)|media/.+)$  "public, max-age=31536000, immutable";
    default                                                              "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;
    add_header Cache-Control $cache_control;

    # A script or stylesheet that is not on disk is a real 404. A tab still
    # running the previous build asks for chunks a redeploy has removed, and
    # answering with index.html would hand it HTML where it expects JavaScript.
    location ~ \.(?:js|mjs|css|map)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
