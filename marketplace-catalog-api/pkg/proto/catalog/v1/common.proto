edition = "2023";

package catalog.v1;

import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option features.field_presence = IMPLICIT;
option go_package = "github.com/fundament-oss/fundament/marketplace-catalog-api/pkg/proto/gen/catalog/v1;catalogv1";

// Ordering applied by ListPlugins. UNSPECIFIED sorts as NAME.
enum PluginSort {
  PLUGIN_SORT_UNSPECIFIED = 0;
  PLUGIN_SORT_RECENTLY_ADDED = 1;
  PLUGIN_SORT_NAME = 2;
}
