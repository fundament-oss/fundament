edition = "2023";

package marketplace.v1;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option features.field_presence = IMPLICIT;
option go_package = "github.com/fundament-oss/fundament/marketplace-api/pkg/proto/gen/marketplace/v1;marketplacev1";

// Where a version sits in the push -> submit -> review -> publish pipeline.
// One vocabulary for the developer and the reviewer alike: they are looking at
// the same state, so it does not get two sets of names depending on which
// surface you ask. DRAFT is pushed but not yet submitted, so no submission
// exists for it in the review queue.
enum SubmissionStatus {
  SUBMISSION_STATUS_UNSPECIFIED = 0;
  SUBMISSION_STATUS_DRAFT = 1;
  SUBMISSION_STATUS_PENDING = 2;
  SUBMISSION_STATUS_CHANGES_REQUESTED = 3;
  SUBMISSION_STATUS_APPROVED = 4;
  SUBMISSION_STATUS_REJECTED = 5;
  // The developer withdrew the version before a decision was made.
  SUBMISSION_STATUS_WITHDRAWN = 6;
}

// Trust and support badges a listing carries (appstore.plugin_labels).
// Fundament assigns them, so every surface serves them read-only. A listing may
// hold several at once: CORE and RIJKSOVERHEID say where a plugin comes from,
// SUPPORT_9_TO_17 what support it ships with.
enum PluginLabel {
  PLUGIN_LABEL_UNSPECIFIED = 0;
  PLUGIN_LABEL_CORE = 1;
  PLUGIN_LABEL_RIJKSOVERHEID = 2;
  PLUGIN_LABEL_SUPPORT_9_TO_17 = 3;
}

// appstore.categories. A curated vocabulary: a developer picks from it rather
// than creating entries, and a listing references it by id.
message Category {
  string id = 10;
  string name = 20;
}

// A curated set of plugins the storefront offers as a starting point.
// plugin_ids carries only the listings the caller can see, so an anonymous
// visitor never learns of a RESTRICTED or unpublished one through a preset.
message Preset {
  string id = 10;
  string name = 20;
  string description = 30;
  repeated string plugin_ids = 40;
}

// A publishing organization, projected from tenant.organizations. Served by
// each API's own ListPublishers, because organization-api's GetOrganization is
// scoped to members and neither an anonymous visitor nor a Fundament reviewer
// qualifies.
message Publisher {
  string id = 10;
  // DNS-label organization name (tenant.organizations.name).
  string name = 20;
  // Human-readable organization name (tenant.organizations.alias).
  string display_name = 30;
}

// Human-readable projection of a version's RBAC rules, e.g.
// ("Certificates", "Read and write"). Derived from the pinned definition.
message PluginPermission {
  string resource = 10;
  string access = 20;
}

// A selling point the developer writes; rendered as a card on the public
// detail page.
message FeatureBlock {
  string title = 10;
  string body = 20;
  // Server-assigned, and stable across an UpdatePlugin that carries it back,
  // exactly like DocumentationLink.id. Numbered last rather than first because
  // renumbering title and body would change the wire format catalog.v1 clients
  // already speak.
  string id = 30 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {uuid: true}
  ];
}

// appstore.plugin_documentation_links. url_name is the link text; title labels
// the group it appears under.
message DocumentationLink {
  // Server-assigned, and stable across an UpdatePlugin that carries it back.
  // Empty means "a link that does not exist yet".
  string id = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {uuid: true}
  ];
  string title = 20;
  string url_name = 30;
  string url = 40;
}

// A plugin manifest (definition.yaml) as the console reads it: the parsed
// form of a stored version's manifest.
message PluginDefinition {
  PluginDefinitionMetadata metadata = 10;
  string image = 20;
  string image_pull_policy = 30;
  PluginPermissions permissions = 40;
  PluginMenu menu = 50;
  repeated string crds = 60;
  map<string, PluginComponentMapping> custom_components = 70;
  repeated PluginAllowedResource allowed_resources = 80;
  map<string, PluginUIHint> ui_hints = 90;
}
message PluginDefinitionMetadata {
  string name = 10;
  string display_name = 20;
  string version = 30;
  string description = 40;
  string author = 50;
  string license = 60;
  string icon = 70;
  PluginURLs urls = 80;
  repeated string tags = 90;
}
message PluginURLs {
  string homepage = 10;
  string repository = 20;
  string documentation = 30;
}
message PluginPermissions {
  repeated string capabilities = 10;
  repeated PluginPolicyRule rbac = 20;
}
message PluginPolicyRule {
  repeated string api_groups = 10;
  repeated string resources = 20;
  repeated string verbs = 30;
}
message PluginMenu {
  repeated PluginMenuEntry organization = 10;
  repeated PluginMenuEntry project = 20;
}
message PluginMenuEntry {
  string crd = 10;
  bool list = 20;
  bool detail = 30;
  string icon = 40;
  string label = 50;
  string singular_label = 60;
}
message PluginComponentMapping {
  string list = 10;
  string detail = 20;
  string create = 30;
  // Opened only in a console sheet, never routed.
  string edit = 40;
}
message PluginAllowedResource {
  string group = 10;
  string version = 20;
  string resource = 30;
  repeated string verbs = 40;
}
message PluginUIHint {
  repeated PluginFormGroup form_groups = 10;
  PluginStatusMapping status_mapping = 20;
}
message PluginFormGroup {
  string name = 10;
  repeated string fields = 20;
}
message PluginStatusMapping {
  string json_path = 10;
  map<string, PluginStatusValue> values = 20;
}
message PluginStatusValue {
  string badge = 10;
  string label = 20;
}
