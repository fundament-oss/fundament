root = "/src"
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/marketplace-registry-api ./marketplace-api/cmd/fun-marketplace-registry-api"
entrypoint = "tmp/marketplace-registry-api"
include_ext = ["go", "mod", "sum"]
include_dir = ["marketplace-api"]
exclude_dir = ["tmp"]
delay = 500

[log]
time = false
