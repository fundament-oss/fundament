server {
    # Listen on both IPv4 and IPv6
    listen 80;
    listen [::]:80;

    server_name _;

    # Nginx runs behind a TLS-terminating proxy and doesn't know the external
    # scheme. Use relative redirects (e.g. /plugins/) so the browser keeps its
    # HTTPS scheme instead of following an absolute http:// redirect.
    absolute_redirect off;

    # Document root and default index
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    #
    # CSP notes:
    #   - script-src 'self'            AOT-compiled Angular needs no 'unsafe-eval'
    #   - style-src 'unsafe-inline'    Angular inlines component styles at runtime
    #   - connect-src ${CONNECT_SRC}   injected at container startup via envsubst;
    #                                  set via externalUrls.authn + externalUrls.organization + externalUrls.kubeApiProxy in Helm values
    #   - frame-src ${CONNECT_SRC}     plugin custom UIs are served from the kube-api-proxy origin
    #                                  and embedded here as iframes; without frame-src this falls
    #                                  back to default-src 'self' and the browser blocks them
    #   - frame-ancestors 'none'       equivalent to X-Frame-Options DENY (superset)
    # -------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; frame-src 'self' ${CONNECT_SRC}; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Prevent the page from being embedded in a frame on any origin
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Send only the origin as referrer for cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable access to sensitive browser features not needed by the app
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Default caching policy: browsers may store responses but must revalidate
    # before reuse (cheap 304 via ETag). Without an explicit Cache-Control,
    # browsers apply heuristic freshness and keep serving a stale index.html
    # after a deploy, which references hashed bundles that no longer exist.
    add_header Cache-Control "no-cache" always;

    # Plugin UI assets: allow embedding in iframes from the same origin
    # nginx add_header in a location block replaces outer headers, so all desired
    # headers must be repeated here. frame-ancestors 'self' replaces 'none', and
    # X-Frame-Options is intentionally omitted (frame-ancestors supersedes it).
    # script-src includes 'unsafe-inline' because plugin pages use inline <script>
    # tags; this is acceptable because the iframe sandbox attribute already
    # provides the isolation boundary.
    location /plugin-ui/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; frame-src 'self' ${CONNECT_SRC}; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Plugin UI files are not content-hashed, so they must be revalidated
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Build output at the root (main-*.js, chunk-*.js, styles-*.css) is
    # content-hashed (outputHashing "all"), so it can be cached forever. This
    # deliberately matches root-level files only: /assets/ (config.json) and
    # /plugin-ui/ contain unhashed files and must keep the no-cache default.
    # Missing bundles return 404 instead of the SPA index.html fallback, so a
    # stale index.html can never cache an HTML response under a JS URL.
    location ~* ^/[^/]+\.(js|css)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; frame-src 'self' ${CONNECT_SRC}; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # No `always`: a 404 for a since-deleted bundle (e.g. a request racing
        # to an old pod during a rolling deploy) must not be cached for a year
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
