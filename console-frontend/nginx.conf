# -----------------------------------------------------------------------------
# Caching
#
# The build's own output (main, polyfills, styles, chunks and everything under
# media/) carries a content hash in its name, so it can be cached for good.
# Everything else, index.html first of all, is fetched by a stable path and has
# to be revalidated: a stale index.html points at chunks a redeploy has removed.
#
# The console-demo image also serves the marketplace demo's build under
# /marketplace/, which is named the same way.
#
# Not `always`, so a 404 carries no Cache-Control: a chunk that 404s on an old
# pod mid-rollout must not be remembered as gone for a year.
#
# The same file names are a real 404 when missing: see the location below.
# The pattern is also in dcim-frontend/nginx.conf and as HASHED_ASSET in
# marketplace-frontend/src/server.ts; keep them in step.
# -----------------------------------------------------------------------------
map $uri $cache_control {
    ~^/(?:marketplace/)?(?:(?:main|polyfills|styles|chunk)-[^/]+\.(?:js|css)|media/.+)$  "public, max-age=31536000, immutable";
    default                                                                               "no-cache";
}

server {
    # Listen on both IPv4 and IPv6
    listen 80;
    listen [::]:80;

    server_name _;

    # Nginx runs behind a TLS-terminating proxy and doesn't know the external
    # scheme. Use relative redirects (e.g. /plugins/) so the browser keeps its
    # HTTPS scheme instead of following an absolute http:// redirect.
    absolute_redirect off;

    # Document root and default index
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    #
    # CSP notes:
    #   - script-src 'self'            AOT-compiled Angular needs no 'unsafe-eval'
    #   - style-src 'unsafe-inline'    Angular inlines component styles at runtime
    #   - connect-src ${CONNECT_SRC}   injected at container startup via envsubst;
    #                                  set via externalUrls.authn + externalUrls.organization + externalUrls.kubeApiProxy in Helm values
    #   - frame-src ${FRAME_SRC}       plugin custom UIs are served from the dedicated plugin-proxy
    #                                  origin (FUN-17) and embedded here as iframes; without
    #                                  frame-src this falls back to default-src 'self' and the
    #                                  browser blocks them. Separate from CONNECT_SRC because the
    #                                  console only frames that origin, never fetches from it.
    #                                  Set via externalUrls.pluginProxy in Helm values.
    #   - frame-ancestors 'none'       equivalent to X-Frame-Options DENY (superset)
    # -------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; frame-src 'self' ${FRAME_SRC}; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Prevent the page from being embedded in a frame on any origin
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Send only the origin as referrer for cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable access to sensitive browser features not needed by the app
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    add_header Cache-Control $cache_control;

    # Plugin UI assets: allow embedding in iframes from the same origin
    # nginx add_header in a location block replaces outer headers, so all desired
    # headers must be repeated here. frame-ancestors 'self' replaces 'none', and
    # X-Frame-Options is intentionally omitted (frame-ancestors supersedes it).
    # script-src includes 'unsafe-inline' because plugin pages use inline <script>
    # tags; this is acceptable because the iframe sandbox attribute already
    # provides the isolation boundary.
    # ^~ keeps the script and stylesheet location below from taking these files.
    location ^~ /plugin-ui/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; frame-src 'self' ${FRAME_SRC}; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control $cache_control;
        try_files $uri $uri/ =404;
    }

    # The marketplace demo bundle, framed by the walkthrough's app pane. Only the
    # console-demo image has these files; in the real console the location simply
    # 404s. As with /plugin-ui/ above, an add_header here replaces the outer set,
    # so every header is repeated: frame-ancestors becomes 'self' and
    # X-Frame-Options is deliberately omitted, because its DENY blocks even a
    # same-origin frame and frame-ancestors supersedes it.
    #
    # The bundle uses hash routing, so /marketplace/#/plugins/x is one request for
    # index.html and no rewrite rule is needed. ^~ as for /plugin-ui/.
    location ^~ /marketplace/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CONNECT_SRC}; frame-src 'self' ${FRAME_SRC}; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control $cache_control;
        try_files $uri $uri/ =404;
    }

    # A file the build emits (the names the caching map above matches) that is
    # not on disk is a real 404. A tab still running the previous build asks for
    # chunks a redeploy has removed, and answering with index.html would hand it
    # HTML where it expects JavaScript. Matched by name, not by extension: a
    # route can end in `.js` too, such as a Kubernetes resource named `app.js`.
    location ~ ^/(?:(?:main|polyfills|styles|chunk)-[^/]+\.(?:js|css)|media/.+)$ {
        try_files $uri =404;
    }

    # The runtime configuration, mounted from a ConfigMap. Missing, it is a 404
    # rather than index.html, which would fail to parse as JSON.
    location = /assets/config/config.json {
        try_files $uri =404;
    }

    # SPA routing: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
