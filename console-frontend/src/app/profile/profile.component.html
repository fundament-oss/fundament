<!-- A sheet, not a page: your own account is something you check beside what you
     were doing. The shell renders it, so opening it leaves the page you were on
     exactly where it was, behind the sheet. -->
<nldd-sheet
  #profileSheet
  appSheetSync
  [show]="show"
  accessible-label="My profile"
  placement="right"
  (close)="onClose()"
>
  <nldd-page sticky-header>
    <nldd-top-title-bar
      slot="header"
      text="My profile"
      dismiss-text="Close"
      (dismiss)="onClose()"
    ></nldd-top-title-bar>

    <nldd-simple-section>
      <nldd-rich-text spacing="flat">
        <p>Your name and password come from your login provider and cannot be changed here.</p>
      </nldd-rich-text>

      <nldd-spacer size="12"></nldd-spacer>

      @if (isLoading()) {
        <nldd-activity-indicator
          show-text
          text="Loading user information..."
        ></nldd-activity-indicator>
      } @else if (error(); as message) {
        <nldd-inline-dialog
          variant="alert"
          text="Profile not loaded"
          [attr.supporting-text]="message"
        >
          <nldd-button
            slot="actions"
            type="button"
            (click)="onClose()"
            text="Close"
            variant="primary"
          ></nldd-button>
        </nldd-inline-dialog>
      } @else {
        <nldd-list variant="box" accessible-label="Account details">
          <nldd-list-item>
            <nldd-text-cell text="Name"></nldd-text-cell>
            <nldd-text-cell
              width="fit-content"
              horizontal-alignment="right"
              [attr.text]="userInfo()?.name || 'Unknown'"
            ></nldd-text-cell>
          </nldd-list-item>
          <nldd-list-item>
            <nldd-text-cell text="User ID"></nldd-text-cell>
            <nldd-text-cell
              width="fit-content"
              horizontal-alignment="right"
              [attr.text]="userInfo()?.id || 'Unknown'"
            ></nldd-text-cell>
          </nldd-list-item>
          <nldd-list-item>
            <nldd-text-cell text="Organizations"></nldd-text-cell>
            <nldd-text-cell
              width="fit-content"
              horizontal-alignment="right"
              [attr.text]="organizationNames() || 'None'"
            ></nldd-text-cell>
          </nldd-list-item>
        </nldd-list>
      }
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
