<nldd-sheet
  #sheet
  appSheetSync
  [show]="true"
  placement="right"
  width="640px"
  accessible-label="Edit plugins"
  (close)="onCancel()"
>
  <nldd-page sticky-header>
    <!-- Same text as the heading below and anchored to it: the bar takes over as
         soon as the heading scrolls away, so which cluster you are editing stays
         on screen the whole time. -->
    <nldd-top-title-bar
      slot="header"
      [attr.text]="pageTitle()"
      collapse-anchor="cluster-plugins-title"
      dismiss-text="Cancel"
      (dismiss)="onCancel()"
    ></nldd-top-title-bar>

    <nldd-simple-section>
      <nldd-title id="cluster-plugins-title" size="2">
        <h1>{{ pageTitle() }}</h1>
      </nldd-title>

      <nldd-spacer size="16"></nldd-spacer>

      @if (!isClusterRunning()) {
        <nldd-banner
          variant="warning"
          [attr.text]="
            'Plugin management is only available when the cluster is running. Current status: ' +
            getStatusLabel(clusterStatus()) +
            '.'
          "
        ></nldd-banner>
        <nldd-spacer size="16"></nldd-spacer>
      }

      @if (errorMessage()) {
        <nldd-banner variant="critical" [attr.text]="errorMessage()"></nldd-banner>
        <nldd-spacer size="16"></nldd-spacer>
      }

      <app-shared-plugins-form
        (formSubmit)="onFormSubmit($event)"
        [initialPluginIds]="currentPluginIds()"
      >
        <!-- No cancel button: the title bar's dismiss already covers leaving. -->
        <nldd-button
          type="button"
          (click)="pluginsForm.submit()"
          [text]="isSubmitting() ? 'Saving...' : 'Save changes'"
          [disabled]="isSubmitting() || !isClusterRunning()"
          width="full"
          variant="primary"
        ></nldd-button>
      </app-shared-plugins-form>
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
