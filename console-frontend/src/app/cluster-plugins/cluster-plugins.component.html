<nldd-sheet
  #sheet
  appSheetSync
  [show]="true"
  placement="right"
  accessible-label="Edit plugins"
  (close)="onCancel()"
>
  <nldd-page sticky-header>
    <!-- Bar and heading only where there is something to do. A state that says
         "come back later" has one thing to say and one way out, and its own
         Close button is that way out; a bar and a heading above it would make
         you read the cluster's name twice before reaching the one line that
         matters. Escape still closes the sheet either way. -->
    @if (!notRunning()) {
      <!-- Same text as the heading below and anchored to it: the bar takes over
           as soon as the heading scrolls away, so which cluster you are editing
           stays on screen the whole time. -->
      <nldd-top-title-bar
        slot="header"
        [attr.text]="pageTitle()"
        collapse-anchor="cluster-plugins-title"
        dismiss-text="Cancel"
        (dismiss)="onCancel()"
      ></nldd-top-title-bar>
    }
    <nldd-simple-section>
      @if (!notRunning()) {
        <nldd-title
          id="cluster-plugins-title"
          size="3"
        >
          <h1>{{ pageTitle() }}</h1>
        </nldd-title>
        <nldd-spacer size="16"></nldd-spacer>
      }
      @if (loadFailed()) {
        <!-- A dialog rather than a banner: a banner sits above a form you can
             still fill in, and there is no form here to fill in. -->
        <nldd-inline-dialog
          variant="alert"
          text="This cluster could not be loaded"
          supporting-text="Without it there is no telling which plugins are installed, so editing them is off the table for now."
        >
          <nldd-button
            slot="actions"
            type="button"
            text="Try again"
            (click)="load()"
          ></nldd-button>
        </nldd-inline-dialog>
      } @else if (notRunning()) {
        <!-- Held back until the status is in: drawn on the UNSPECIFIED it starts
             on, this would turn away someone whose cluster runs fine. And in
             place of the form, not above it, because there is nothing to fill in
             until the cluster runs. -->
        <nldd-inline-dialog
          variant="alert"
          text="Plugins can only be managed while the cluster is running"
          [attr.supporting-text]="
            'Current status: ' +
            getStatusLabel(clusterStatus()) +
            '. Come back once the cluster is running.'
          "
        >
          <nldd-button
            slot="actions"
            type="button"
            text="Close"
            (click)="onCancel()"
          ></nldd-button>
        </nldd-inline-dialog>
      } @else {
        @if (errorMessage()) {
          <nldd-banner
            variant="critical"
            [attr.text]="errorMessage()"
          ></nldd-banner>
          <nldd-spacer size="16"></nldd-spacer>
        }
        <app-shared-plugins-form
          (formSubmit)="onFormSubmit($event)"
          [initialPluginIds]="currentPluginIds()"
        >
          <!-- No cancel button: the title bar's dismiss already covers leaving. -->
          <nldd-button
            type="button"
            (click)="pluginsForm.submit()"
            text="Save changes"
            [loading]="isSubmitting()"
            [disabled]="isLoading()"
            width="full"
            variant="primary"
          ></nldd-button>
        </app-shared-plugins-form>
      }
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
