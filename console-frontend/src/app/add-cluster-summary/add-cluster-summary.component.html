<nldd-title id="wizard-step-title" size="3">
  <h1>Review your cluster configuration</h1>
</nldd-title>

<nldd-spacer size="24"></nldd-spacer>

<!-- No heading above this one: "Review your cluster configuration" already says
     what you are looking at, and Cluster name, Region and Kubernetes version
     label themselves. Node pools below does earn a heading, because it groups
     repeated cards that would otherwise run together. The list keeps its
     accessible name so assistive software still hears the grouping. -->
<nldd-list variant="box-tinted" accessible-label="Basics">
  <nldd-list-item>
    <nldd-text-cell text="Cluster name"></nldd-text-cell>
    <nldd-text-cell
      width="fit-content"
      horizontal-alignment="right"
      [attr.text]="state().clusterName || 'N/A'"
    ></nldd-text-cell>
  </nldd-list-item>
  <nldd-list-item>
    <nldd-text-cell text="Region"></nldd-text-cell>
    <nldd-text-cell
      width="fit-content"
      horizontal-alignment="right"
      [attr.text]="state().region?.toUpperCase() || 'N/A'"
    ></nldd-text-cell>
  </nldd-list-item>
  <nldd-list-item>
    <nldd-text-cell text="Kubernetes version"></nldd-text-cell>
    <nldd-text-cell
      width="fit-content"
      horizontal-alignment="right"
      [attr.text]="state().kubernetesVersion || 'N/A'"
    ></nldd-text-cell>
  </nldd-list-item>
</nldd-list>

<nldd-spacer size="24"></nldd-spacer>

<nldd-title size="5">
  <h3>Node pools</h3>
</nldd-title>

<nldd-spacer size="8"></nldd-spacer>

@if (state().nodePools && state().nodePools!.length > 0) {
  <nldd-collection layout="stack" gap="16px">
    @for (nodePool of state().nodePools; track nodePool.name) {
      <nldd-list variant="box-tinted" [attr.accessible-label]="'Node pool ' + nodePool.name">
        <nldd-list-item>
          <nldd-text-cell text="Node pool name"></nldd-text-cell>
          <nldd-text-cell
            width="fit-content"
            horizontal-alignment="right"
            [attr.text]="nodePool.name"
          ></nldd-text-cell>
        </nldd-list-item>
        <nldd-list-item>
          <nldd-text-cell text="Machine type"></nldd-text-cell>
          <nldd-text-cell
            width="fit-content"
            horizontal-alignment="right"
            [attr.text]="machineTypeLabel(nodePool.machineType)"
          ></nldd-text-cell>
        </nldd-list-item>
        <nldd-list-item>
          <nldd-text-cell text="Autoscale minimum"></nldd-text-cell>
          <nldd-text-cell
            width="fit-content"
            horizontal-alignment="right"
            [attr.text]="nodePool.autoscaleMin + (nodePool.autoscaleMin === 1 ? ' node' : ' nodes')"
          ></nldd-text-cell>
        </nldd-list-item>
        <nldd-list-item>
          <nldd-text-cell text="Autoscale maximum"></nldd-text-cell>
          <nldd-text-cell
            width="fit-content"
            horizontal-alignment="right"
            [attr.text]="nodePool.autoscaleMax + (nodePool.autoscaleMax === 1 ? ' node' : ' nodes')"
          ></nldd-text-cell>
        </nldd-list-item>
      </nldd-list>
    }
  </nldd-collection>
} @else {
  <nldd-inline-dialog icon="circle-dashed" icon-color="secondary" text="No node pools configured">
  </nldd-inline-dialog>
}

<div>
  @if (errorMessage()) {
    <nldd-spacer size="16"></nldd-spacer>
    <nldd-banner variant="critical" [attr.text]="errorMessage()"></nldd-banner>
  }

  <!-- No "previous step": the title bar's back button covers going a step
       back. -->
  <nldd-spacer size="24"></nldd-spacer>
  <nldd-button
    type="button"
    (click)="onCreateCluster()"
    text="Create cluster"
    [loading]="isCreating()"
    width="full"
    variant="primary"
  ></nldd-button>
</div>
