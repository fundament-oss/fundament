<nldd-title id="wizard-step-title" size="4">
  <h2>Configure your cluster node pools</h2>
</nldd-title>

<nldd-spacer size="16"></nldd-spacer>

<app-shared-node-pools-form
  [machineTypeOptions]="machineTypeOptions()"
  (formSubmit)="onFormSubmit($event)"
>
  <nldd-button
    type="button"
    (click)="nodePoolsForm.submit()"
    text="Continue to Summary"
    end-icon="chevron-right"
    width="full"
    variant="primary"
  ></nldd-button>
</app-shared-node-pools-form>
