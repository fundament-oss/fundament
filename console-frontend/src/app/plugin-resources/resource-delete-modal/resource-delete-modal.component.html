<!-- The name in the title, because that is what you are about to lose; the rest
     is supporting text, so the dialog says one thing and explains it once.
     Centered explicitly: left to itself the dialog left-aligns and puts its buttons
     in a row while the error shows, so they would move under the pointer on a retry. -->
<nldd-modal-dialog
  appDialogSync
  [show]="show()"
  [text]="'Delete ' + resourceName() + '?'"
  [supportingText]="
    'Deleting this ' + resourceKind().toLowerCase() + ' is permanent and cannot be undone.'
  "
  variant="alert"
  horizontal-alignment="center"
  (close)="dismiss.emit()"
>
  <!-- One wrapper on purpose: nldd-button-group hides any action that is the
       fourth child of this dialog or later, and it counts every child. -->
  @if (errorMessage()) {
    <nldd-container>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-box>
        <nldd-container padding="16">
          <nldd-inline-dialog
            icon="exclamation-triangle"
            icon-color="critical"
            [text]="errorMessage()!"
          ></nldd-inline-dialog>
        </nldd-container>
      </nldd-box>
    </nldd-container>
  }
  <!-- Keeping it first: the safe way out is the one you land on, and the
       destructive one sits under it where you have to go looking for it. -->
  <nldd-button
    slot="actions"
    type="button"
    (click)="dismiss.emit()"
    [attr.text]="'Keep ' + resourceKind().toLowerCase()"
    appearance="primary"
    [disabled]="deleting()"
  ></nldd-button>
  <nldd-button
    slot="actions"
    type="button"
    (click)="confirm.emit()"
    [attr.text]="'Delete ' + resourceKind().toLowerCase()"
    appearance="destructive"
    [disabled]="deleting()"
  ></nldd-button>
</nldd-modal-dialog>
