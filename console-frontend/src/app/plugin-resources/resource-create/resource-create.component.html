<!-- Same outer layout as the other pages, so a plugin's own create screen
     gets the page padding, column, title bar and title the native forms have.
     The back button leads to the list, like on a resource's own page. -->
<nldd-page
  sticky-header
  style="--context-back-button-display: flex"
>
  <nldd-top-title-bar
    slot="header"
    [attr.text]="title()"
    [attr.back-text]="kindLabel()"
    (back)="goToList($event)"
    collapse-anchor="resource-create-title"
  ></nldd-top-title-bar>
  <nldd-simple-section>
    <app-plugin-status-banner [installationName]="pluginName()" />
    <nldd-title
      id="resource-create-title"
      size="2"
    >
      <h1>{{ title() }}</h1>
    </nldd-title>
    <nldd-spacer size="16"></nldd-spacer>
    @if (errorMessage()) {
      <nldd-banner
        variant="critical"
        [attr.text]="errorMessage()"
      ></nldd-banner>
    } @else if (loading()) {
      <nldd-inline-dialog
        variant="loading"
        text="Loading..."
      ></nldd-inline-dialog>
    } @else if (namespacesUnavailable()) {
      <nldd-banner
        variant="critical"
        text="Failed to load the project's namespaces. Reload the page to try again."
      ></nldd-banner>
    } @else if (customUIUrl() && needsNamespace()) {
      <nldd-inline-dialog
        icon="brackets-ellipsis"
        icon-color="secondary"
        text="No namespaces in this project yet"
        supporting-text="This is created in a namespace. Add one to the project first, then come back here."
      >
        <nldd-button
          slot="actions"
          [attr.href]="pageNav.path(namespacesLink())"
          text="Go to namespaces"
          appearance="primary"
          (click)="pageNav.navigate($event, namespacesLink())"
        ></nldd-button>
      </nldd-inline-dialog>
    } @else if (customUIUrl()) {
      <app-plugin-iframe
        [src]="customUIUrl()!"
        [pluginName]="pluginName()"
        [pluginVersion]="installationVersion()"
        [installationId]="installationId()"
        [crdKind]="crdDef()!.kind"
        view="create"
        [clusterId]="clusterId()!"
        [projectId]="projectId()"
        [namespaces]="namespaces()"
        [namespaceDisplayNames]="namespaceDisplayNames()"
      />
    } @else {
      <!-- The plugin ships no create screen, so the console has nothing to show:
           one line saying so and the way back. -->
      <nldd-inline-dialog
        icon="plugin"
        icon-color="secondary"
        text="Creating this resource from the console is not available"
        supporting-text="This plugin does not ship a screen for it."
      >
        <nldd-button
          slot="actions"
          [routerLink]="listLink"
          text="Back to list"
          appearance="primary"
        ></nldd-button>
      </nldd-inline-dialog>
    }
  </nldd-simple-section>
</nldd-page>
