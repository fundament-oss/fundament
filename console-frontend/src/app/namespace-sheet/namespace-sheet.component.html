<nldd-sheet
  #namespaceSheet
  appSheetSync
  [show]="true"
  accessible-label="Namespace"
  placement="right"
  (close)="onClose()"
>
  <nldd-page sticky-header>
    <nldd-top-title-bar
      slot="header"
      [attr.text]="namespaceName()"
      collapse-anchor="namespace-title"
      dismiss-text="Close"
      (dismiss)="onClose()"
    ></nldd-top-title-bar>
    <nldd-simple-section>
      @if (state() === 'loading' && !retrying()) {
        <nldd-activity-indicator
          show-text
          text="Loading namespace..."
        ></nldd-activity-indicator>
      } @else if (state() === 'failed' || retrying()) {
        <!-- Not "not found": the call failed, which says nothing about whether
             the namespace exists. Stays up while the retry runs, so the button
             can show it. -->
        <nldd-inline-dialog
          variant="alert"
          text="Namespace not loaded"
          supporting-text="Something went wrong while loading this namespace."
        >
          <nldd-button
            slot="actions"
            type="button"
            (click)="retry()"
            [attr.loading]="retrying() ? '' : null"
            text="Try again"
            appearance="primary"
          ></nldd-button>
          <nldd-button
            slot="actions"
            type="button"
            (click)="onClose()"
            text="Close"
            appearance="secondary"
          ></nldd-button>
        </nldd-inline-dialog>
      } @else if (state() === 'missing') {
        <nldd-inline-dialog
          variant="alert"
          text="Namespace not found"
          supporting-text="It may have been deleted."
        >
          <nldd-button
            slot="actions"
            type="button"
            (click)="onClose()"
            text="Close"
            appearance="primary"
          ></nldd-button>
        </nldd-inline-dialog>
      } @else {
        <nldd-title
          id="namespace-title"
          size="3"
        >
          <h1>{{ namespaceName() }}</h1>
        </nldd-title>
        <nldd-spacer size="16"></nldd-spacer>
        <nldd-list
          appearance="box-tinted"
          accessible-label="Namespace details"
        >
          <!-- Names the project: the sheet can be opened from a link, with no
               list behind it to say where you are. -->
          <nldd-list-item>
            <nldd-text-cell text="Project"></nldd-text-cell>
            <nldd-spacer-cell size="12"></nldd-spacer-cell>
            <nldd-text-cell
              width="fit-content"
              horizontal-alignment="right"
              [attr.text]="projectName()"
            ></nldd-text-cell>
          </nldd-list-item>
          <nldd-list-item>
            <nldd-text-cell text="Created"></nldd-text-cell>
            <nldd-spacer-cell size="12"></nldd-spacer-cell>
            <nldd-text-cell
              width="fit-content"
              horizontal-alignment="right"
              [attr.text]="created()"
            ></nldd-text-cell>
          </nldd-list-item>
        </nldd-list>
        <nldd-spacer size="24"></nldd-spacer>
        <nldd-box background="critical">
          <nldd-container padding="16">
            <nldd-title size="5">
              <h2>Delete {{ namespaceName() }}</h2>
            </nldd-title>
            <nldd-spacer size="8"></nldd-spacer>
            <nldd-rich-text spacing="flat">
              <p>This removes the namespace and every resource running in it.</p>
            </nldd-rich-text>
            <nldd-spacer size="16"></nldd-spacer>
            <nldd-button
              type="button"
              (click)="showDeleteModal.set(true)"
              text="Delete namespace"
              start-icon="delete"
              appearance="destructive"
            ></nldd-button>
          </nldd-container>
        </nldd-box>
      }
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
<!-- Delete Namespace Modal -->
<nldd-modal-dialog
  #deleteNamespaceDialog
  appDialogSync
  [show]="showDeleteModal()"
  [attr.text]="'Delete namespace ' + namespaceName() + '?'"
  supporting-text="This removes the namespace and every resource running in it. This cannot be undone."
  accessible-label="Confirm namespace deletion"
  variant="alert"
  (close)="showDeleteModal.set(false)"
>
  <nldd-button
    slot="actions"
    type="button"
    (click)="showDeleteModal.set(false)"
    text="Keep namespace"
    appearance="primary"
  ></nldd-button>
  <nldd-button
    slot="actions"
    type="button"
    (click)="deleteNamespace()"
    text="Delete namespace"
    appearance="destructive"
  ></nldd-button>
</nldd-modal-dialog>
