<nldd-sheet
  #sheet
  appSheetSync
  [show]="true"
  placement="right"
  width="640px"
  accessible-label="Edit node pools"
  (close)="onCancel()"
>
  <nldd-page sticky-header>
    <nldd-top-title-bar
      slot="header"
      text="Node pools"
      dismiss-text="Cancel"
      (dismiss)="onCancel()"
    ></nldd-top-title-bar>

    <nldd-simple-section>
      @if (errorMessage()) {
        <nldd-banner variant="critical" [attr.text]="errorMessage()"></nldd-banner>
        <nldd-spacer size="16"></nldd-spacer>
      }

      @if (isLoading()) {
        <nldd-activity-indicator show-text text="Loading node pools..."></nldd-activity-indicator>
      } @else {
        <app-shared-node-pools-form
          [initialData]="initialNodePools()"
          [machineTypeOptions]="machineTypeOptions()"
          (formSubmit)="onFormSubmit($event)"
        >
          <!-- No cancel button: the title bar's dismiss already covers leaving. -->
          <nldd-button
            type="button"
            (click)="nodePoolsForm.submit()"
            [text]="isSubmitting() ? 'Saving...' : 'Save changes'"
            [disabled]="isSubmitting()"
            width="full"
            variant="primary"
          ></nldd-button>
        </app-shared-node-pools-form>
      }
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
