<nldd-page sticky-header>
  <nldd-top-title-bar
    slot="header"
    text="Clusters"
    [attr.back-text]="pageNav.backText()"
    collapse-anchor="clusters-title"
  ></nldd-top-title-bar>

  <nldd-simple-section>
    <nldd-title id="clusters-title" size="2">
      <h1>Clusters</h1>
    </nldd-title>
    <nldd-rich-text>
      <p>Discover and manage your Kubernetes clusters.</p>
    </nldd-rich-text>

    @if (errorMessage()) {
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-banner variant="critical" [attr.text]="errorMessage()"></nldd-banner>
    }

    @if (clusters().length > 0) {
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-toolbar label="Cluster actions">
        <nldd-toolbar-item slot="start">
          <nldd-button
            [attr.href]="pageNav.path('/clusters/add')"
            text="New cluster…"
            start-icon="plus-small"
            variant="primary"
            (click)="pageNav.navigate($event, '/clusters/add')"
          ></nldd-button>
          <nldd-menu-item
            slot="overflow"
            icon="plus-small"
            text="New cluster…"
            [attr.href]="pageNav.path('/clusters/add')"
            (select)="pageNav.navigate($event, '/clusters/add')"
          ></nldd-menu-item>
        </nldd-toolbar-item>
      </nldd-toolbar>
    }

    <nldd-spacer size="24"></nldd-spacer>

    @if (clusters().length > 0) {
      <nldd-collection layout="grid" item-width="280px">
        @for (cluster of clusters(); track cluster.id) {
          <!-- nldd-card leaves padding to nested containers, so the body gets one. -->
          <nldd-card background="tinted">
            <nldd-container padding="16">
              <nldd-title size="4">
                <h2>{{ cluster.name }}</h2>
                <nldd-badge
                  slot="end"
                  [attr.color]="getStatusBadgeColor(cluster.status)"
                  [attr.text]="getStatusLabel(cluster.status)"
                  [attr.pulse]="isTransitionalStatus(cluster.status) ? '' : null"
                ></nldd-badge>
              </nldd-title>

              <nldd-spacer size="16"></nldd-spacer>

              <nldd-list variant="simple">
                <nldd-list-item size="sm">
                  <nldd-text-cell text="Region"></nldd-text-cell>
                  <nldd-text-cell
                    width="fit-content"
                    horizontal-alignment="right"
                    [attr.text]="cluster.region.toUpperCase()"
                  ></nldd-text-cell>
                </nldd-list-item>
                <nldd-list-item size="sm">
                  <nldd-text-cell text="Node pools"></nldd-text-cell>
                  <nldd-text-cell
                    width="fit-content"
                    horizontal-alignment="right"
                    [attr.text]="cluster.nodePoolCount"
                  ></nldd-text-cell>
                </nldd-list-item>
              </nldd-list>
            </nldd-container>

            <!-- In the footer slot rather than the body: the card keeps that slot
                 at the bottom, so the buttons line up across a row of cards
                 however tall each one's title and list turn out. -->
            <nldd-container slot="footer" padding-inline="16" padding-bottom="16">
              <nldd-button
                [attr.href]="pageNav.path('/clusters/' + cluster.id)"
                text="View details"
                variant="primary"
                (click)="pageNav.navigate($event, '/clusters/' + cluster.id)"
              ></nldd-button>
            </nldd-container>
          </nldd-card>
        }
      </nldd-collection>
    } @else {
      <nldd-inline-dialog
        icon="ship-wheel"
        icon-color="secondary"
        text="No clusters yet"
        supporting-text="Add your first Kubernetes cluster to get started."
      >
        <nldd-button
          slot="actions"
          [attr.href]="pageNav.path('/clusters/add')"
          text="New cluster…"
          start-icon="plus-small"
          variant="primary"
          (click)="pageNav.navigate($event, '/clusters/add')"
        ></nldd-button>
      </nldd-inline-dialog>
    }
  </nldd-simple-section>

  <!-- The add-cluster wizard is a child route, so it renders as a sheet over
       this list instead of replacing it. -->
  <router-outlet />

  <!-- Empty on purpose: the footer band carries the Rijksoverheid lintje. -->
  <nldd-page-footer slot="footer"></nldd-page-footer>
</nldd-page>
