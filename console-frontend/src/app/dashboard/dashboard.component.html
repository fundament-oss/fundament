<nldd-page sticky-header>
  <nldd-top-title-bar
    slot="header"
    text="Clusters"
    [attr.back-text]="pageNav.backText()"
    collapse-anchor="clusters-title"
  ></nldd-top-title-bar>
  <nldd-simple-section>
    <nldd-title
      id="clusters-title"
      size="2"
    >
      <h1>Clusters</h1>
    </nldd-title>
    <nldd-rich-text>
      <p>Discover and manage your Kubernetes clusters.</p>
    </nldd-rich-text>
    @if (errorMessage()) {
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-banner
        variant="critical"
        [attr.text]="errorMessage()"
      ></nldd-banner>
    }
    <nldd-spacer size="12"></nldd-spacer>
    @if (clusters().length > 0) {
      <nldd-toolbar accessible-label="Cluster actions">
        <nldd-toolbar-item slot="start">
          <nldd-button
            [attr.href]="pageNav.path('/clusters/new')"
            text="New cluster…"
            start-icon="plus-small"
            appearance="primary"
            (click)="pageNav.navigate($event, '/clusters/new')"
          ></nldd-button>
          <nldd-menu-item
            slot="overflow"
            icon="plus-small"
            text="New cluster…"
            [attr.href]="pageNav.path('/clusters/new')"
            (select)="pageNav.navigate($event, '/clusters/new')"
          ></nldd-menu-item>
        </nldd-toolbar-item>
      </nldd-toolbar>
      <nldd-spacer size="16"></nldd-spacer>
      <!-- The same list as a cluster's Projects page: the organization's way
           into a cluster mirrors the cluster's way into a project. -->
      <nldd-list
        appearance="box-tinted"
        accessible-label="Clusters"
      >
        @for (cluster of clusters(); track cluster.id) {
          <!-- The whole row goes into the cluster: a real link, so it can be
               shared and opened in a new tab, and the chevron says so. -->
          <nldd-list-item
            [attr.href]="pageNav.path('/clusters/' + cluster.id)"
            (click)="pageNav.navigate($event, '/clusters/' + cluster.id)"
          >
            <nldd-icon-cell
              icon="kubernetes"
              size="20"
            ></nldd-icon-cell>
            <nldd-spacer-cell size="12"></nldd-spacer-cell>
            <nldd-text-cell
              width="full"
              [attr.text]="cluster.name"
              [attr.supporting-text]="summarize(cluster)"
            ></nldd-text-cell>
            <nldd-spacer-cell size="8"></nldd-spacer-cell>
            <nldd-cell width="fit-content">
              <nldd-badge
                [attr.color]="getStatusBadgeColor(cluster.status)"
                [attr.text]="getStatusLabel(cluster.status)"
                [attr.pulse]="isTransitionalStatus(cluster.status) ? '' : null"
              ></nldd-badge>
            </nldd-cell>
            <nldd-spacer-cell size="8"></nldd-spacer-cell>
            <nldd-icon-cell
              icon="chevron-right"
              size="20"
              color="secondary"
            ></nldd-icon-cell>
          </nldd-list-item>
        }
      </nldd-list>
    } @else {
      <nldd-inline-dialog
        icon="kubernetes"
        icon-color="secondary"
        text="No clusters yet"
        supporting-text="Add your first Kubernetes cluster to get started."
      >
        <nldd-button
          slot="actions"
          [attr.href]="pageNav.path('/clusters/new')"
          text="New cluster…"
          start-icon="plus-small"
          appearance="primary"
          (click)="pageNav.navigate($event, '/clusters/new')"
        ></nldd-button>
      </nldd-inline-dialog>
    }
  </nldd-simple-section>
</nldd-page>
<!-- The new-cluster form is a child route, so it renders as a sheet over this
     list instead of replacing it. Outside the page: a section only fills the
     page while it is the last child. -->
<router-outlet />
