<div class="space-y-6">
  @if (initialLoading()) {
    <div class="py-8 text-center">
      <p class="text-gray-600 dark:text-gray-300">Loading limits…</p>
    </div>
  } @else {
    <div class="card">
      <div class="card-header">
        <h2 class="text-xl font-semibold dark:text-white">Namespace resource defaults</h2>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
          Default resource requests and limits applied to containers in all namespaces of this
          project via a <span class="font-mono text-xs">LimitRange</span>. These values are used
          when a workload does not specify its own resource constraints.
        </p>
      </div>

      <div class="card-body-lg">
        <nldd-form (submit)="save($event)">
          <app-namespace-resource-defaults
            [defaults]="namespaceDefaults()"
            [(memoryLimited)]="memoryLimited"
            [(memoryRequestMi)]="defaultMemoryRequestMi"
            [(memoryLimitMi)]="defaultMemoryLimitMi"
            [(cpuLimited)]="cpuLimited"
            [(cpuRequestM)]="defaultCpuRequestM"
            [(cpuLimitM)]="defaultCpuLimitM"
          ></app-namespace-resource-defaults>

          <div class="mt-6 flex flex-wrap items-center gap-3">
            <nldd-button
              type="submit"
              [disabled]="saving()"
              [text]="saving() ? 'Saving…' : 'Save namespace defaults'"
              variant="primary"
            ></nldd-button>
            <nldd-button
              type="button"
              (click)="resetNamespaceLimits()"
              [disabled]="saving()"
              text="Reset to defaults"
              variant="secondary"
            ></nldd-button>
          </div>
        </nldd-form>
      </div>
    </div>
  }
</div>
