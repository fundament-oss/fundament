<nldd-page>
  <!-- Only the ribbon: this page carries no navigation, and the bar is what
       makes it a Rijksoverheid page rather than a bare form. -->
  <nldd-top-navigation-bar slot="header"></nldd-top-navigation-bar>

  <!-- Centered rather than top-aligned: the page holds one thing, and a form of
       two fields hanging under the header reads as an afterthought. -->
  <nldd-simple-section width="400px" height="100%">
    <nldd-container vertical-alignment="center">
      <!-- Everything in one box: the heading says what you are logging in to,
           so it belongs to the form rather than floating above it. -->
      <nldd-box>
        <!-- The inset grows with the box: 16 on a phone, 32 once there is room
             for it. The breakpoints resolve against this container's own width,
             not the page's. -->
        <nldd-container padding="16" md-padding="24" lg-padding="32">
          <nldd-title size="3">
            <h1>Log in to Fundament</h1>
          </nldd-title>

          <nldd-spacer size="12"></nldd-spacer>

          <nldd-rich-text spacing="flat">
            <p>The platform your team manages its Kubernetes clusters and projects with.</p>
          </nldd-rich-text>

          <nldd-spacer size="24"></nldd-spacer>

          @if (error(); as message) {
            <nldd-banner
              variant="critical"
              text="Signing in failed"
              [attr.supporting-text]="message"
            ></nldd-banner>

            <nldd-spacer size="16"></nldd-spacer>
          }

          <nldd-form
            [formGroup]="loginForm"
            (submit)="onSubmit($event)"
            (keydown.enter)="onSubmit($event)"
          >
            <nldd-form-field label="Email address">
              <nldd-text-field
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                appAutofocus
                [value]="email?.value ?? ''"
                (input)="loginForm.get('email')!.setValue($any($event.target).value)"
                [invalid]="!!(email?.invalid && email.touched)"
                error-message="login-email-error"
              ></nldd-text-field>
              <nldd-form-field-error-text id="login-email-error">
                {{ getEmailError() }}
              </nldd-form-field-error-text>
            </nldd-form-field>

            <nldd-form-field label="Password">
              <nldd-password-field
                id="password"
                autocomplete="current-password"
                [value]="password?.value ?? ''"
                (input)="loginForm.get('password')!.setValue($any($event.target).value)"
                (blur)="loginForm.get('password')!.markAsTouched()"
                show-button-text="Show"
                show-button-accessible-label="Show password"
                hide-button-text="Hide"
                hide-button-accessible-label="Hide password"
                [invalid]="!!(password?.invalid && password.dirty)"
                error-message="login-password-error"
              ></nldd-password-field>
              <nldd-form-field-error-text id="login-password-error">
                {{ getPasswordError() }}
              </nldd-form-field-error-text>
            </nldd-form-field>

            <nldd-form-actions>
              <!-- Never disabled: a disabled button says nothing about what is
                   missing, and the loading state already says it is busy. -->
              <nldd-button
                type="submit"
                text="Sign in"
                [attr.loading]="isLoading() ? '' : null"
                variant="primary"
                width="full"
              ></nldd-button>
            </nldd-form-actions>
          </nldd-form>
        </nldd-container>
      </nldd-box>
    </nldd-container>
  </nldd-simple-section>

  <!-- Empty on purpose: the footer band carries the Rijksoverheid lintje. -->
  <nldd-page-footer slot="footer"></nldd-page-footer>
</nldd-page>
