<!-- Same outer layout as the other project pages: the pane owns the back
     button, so the page does not force one. -->
<nldd-page sticky-header>
  <nldd-top-title-bar
    slot="header"
    text="Namespaces"
    [attr.back-text]="pageNav.backText()"
    (back)="pageNav.goTo('/projects/' + projectId())"
    collapse-anchor="namespaces-title"
  ></nldd-top-title-bar>
  <nldd-simple-section>
    <nldd-title
      id="namespaces-title"
      size="2"
    >
      <h1>Namespaces</h1>
    </nldd-title>
    <nldd-spacer size="12"></nldd-spacer>
    <nldd-toolbar label="Namespace actions">
      <nldd-toolbar-item slot="start">
        <nldd-button
          type="button"
          (click)="overlays.newNamespace.set(projectId())"
          text="New namespace…"
          start-icon="plus-small"
          variant="primary"
        ></nldd-button>
        <nldd-menu-item
          slot="overflow"
          icon="plus-small"
          text="New namespace…"
          (select)="overlays.newNamespace.set(projectId())"
        ></nldd-menu-item>
      </nldd-toolbar-item>
    </nldd-toolbar>
    <nldd-spacer size="16"></nldd-spacer>
    @if (isLoading()) {
      <nldd-activity-indicator
        show-text
        text="Loading namespaces..."
      ></nldd-activity-indicator>
    } @else if (namespaces().length === 0) {
      <nldd-inline-dialog
        icon="brackets-ellipsis"
        icon-color="secondary"
        text="No namespaces in this project yet"
        supporting-text="A namespace is where the project's workloads actually run."
      >
        <nldd-button
          slot="actions"
          type="button"
          (click)="overlays.newNamespace.set(projectId())"
          text="New namespace…"
          start-icon="plus-small"
          variant="primary"
        ></nldd-button>
      </nldd-inline-dialog>
    } @else {
      <nldd-list
        variant="box-tinted"
        accessible-label="Namespaces"
      >
        @for (namespace of namespaces(); track namespace.id) {
          <!-- The whole row goes to the namespace: a real link, so it can be
               shared and opened in a new tab, and the chevron says so. Deleting
               lives in the sheet, with everything else about it. -->
          <nldd-list-item
            [attr.href]="pageNav.path('/projects/' + projectId() + '/namespaces/' + namespace.name)"
            (click)="openNamespace($event, namespace.name)"
          >
            <nldd-text-cell
              width="full"
              [attr.text]="namespace.name"
              [attr.supporting-text]="'Created ' + formatDate(namespace.created)"
            ></nldd-text-cell>
            <!-- Too wide next to a name on a phone; the sheet has the detail
                 anyway. -->
            <nldd-spacer-cell
              size="12"
              hide-below="md"
            ></nldd-spacer-cell>
            <nldd-text-cell
              width="fit-content"
              horizontal-alignment="right"
              color="secondary"
              hide-below="md"
              [attr.text]="memberSummary(namespace.name)"
            ></nldd-text-cell>
            <nldd-spacer-cell size="8"></nldd-spacer-cell>
            <nldd-icon-cell
              icon="chevron-right"
              size="20"
              color="secondary"
            ></nldd-icon-cell>
          </nldd-list-item>
        }
      </nldd-list>
    }
  </nldd-simple-section>
</nldd-page>
<!-- Action Error Modal -->
<nldd-modal-dialog
  #actionErrorDialog
  appDialogSync
  [show]="!!errorMessage()"
  text="Something went wrong"
  [attr.supporting-text]="errorMessage()"
  accessible-label="Action failed"
  variant="alert"
  (close)="errorMessage.set(null)"
>
  <nldd-button
    slot="actions"
    type="button"
    (click)="errorMessage.set(null)"
    text="Close"
    variant="primary"
  ></nldd-button>
</nldd-modal-dialog>
<router-outlet />
