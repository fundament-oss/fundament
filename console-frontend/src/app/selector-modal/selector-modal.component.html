<nldd-sheet
  #dialog
  accessible-label="Organization or Project"
  placement="right"
  width="480px"
  (open)="onOpen()"
  (close)="onClose()"
>
  <nldd-page sticky-header>
    <nldd-top-title-bar
      slot="header"
      text="Organization or Project"
      dismiss-text="Cancel"
      (dismiss)="onClose()"
    ></nldd-top-title-bar>

    <nldd-container slot="header" padding-inline="16" padding-top="8">
      <nldd-search-field
        #searchField
        [value]="filterInputValue()"
        placeholder="Search"
        accessible-label="Search"
        name="filter"
        (input)="updateFilter($event)"
        (change)="updateFilter($event)"
      ></nldd-search-field>
    </nldd-container>

    <nldd-simple-section>
      <nldd-list
        type="tree"
        no-dividers
        accessible-label="Organizations and projects"
        empty-text="No results found"
      >
        @for (org of filteredOrganizations(); track org.id) {
          @if (org.projects.length === 0) {
            <!-- No children, so not a branch: no chevron, and the row is its own control. -->
            <nldd-list-item
              button
              [attr.selected]="isOrganizationSelected(org.id) ? '' : null"
              (click)="onSelectOrganization(org.id)"
            >
              <!-- Takes the place of the chevron the branch rows have, so every
                   organization's icon sits on the same line. -->
              <nldd-spacer-cell size="44"></nldd-spacer-cell>
              <nldd-icon-cell icon="apartment-building" size="20"></nldd-icon-cell>
              <nldd-spacer-cell size="8"></nldd-spacer-cell>
              <nldd-text-cell [attr.text]="org.alias"></nldd-text-cell>
              @if (isOrganizationSelected(org.id)) {
                <nldd-icon-cell icon="check-mark" size="20"></nldd-icon-cell>
              }
              <nldd-spacer-cell size="8"></nldd-spacer-cell>
            </nldd-list-item>
          } @else {
            <nldd-list-item
              [attr.expanded]="isExpanded(org.id) ? '' : null"
              [attr.selected]="isOrganizationSelected(org.id) ? '' : null"
            >
              <!-- Chevron expands, the label selects: two segmented actions, so the
                   row itself stays free of a control (a control in a control is invalid). -->
              <nldd-list-item-action
                button
                disclosure
                [attr.accessible-label]="'Show projects in ' + org.alias"
                (click)="toggleExpanded(org.id)"
              >
                <nldd-icon-cell icon="chevron-right" size="20"></nldd-icon-cell>
              </nldd-list-item-action>
              <nldd-list-item-action button width="full" (click)="onSelectOrganization(org.id)">
                <nldd-icon-cell icon="apartment-building" size="20"></nldd-icon-cell>
                <nldd-spacer-cell size="8"></nldd-spacer-cell>
                <nldd-text-cell [attr.text]="org.alias"></nldd-text-cell>
                @if (isOrganizationSelected(org.id)) {
                  <nldd-icon-cell icon="check-mark" size="20"></nldd-icon-cell>
                }
                <nldd-spacer-cell size="8"></nldd-spacer-cell>
              </nldd-list-item-action>

              @for (project of org.projects; track project.id) {
                <nldd-list-item
                  slot="children"
                  button
                  [attr.selected]="isProjectSelected(project.id) ? '' : null"
                  (click)="onSelectProject(project.id)"
                >
                  <!-- One level in (16), then the width the parent's chevron takes (44). -->
                  <nldd-spacer-cell size="16"></nldd-spacer-cell>
                  <nldd-spacer-cell size="44"></nldd-spacer-cell>
                  <nldd-icon-cell icon="folder" size="20"></nldd-icon-cell>
                  <nldd-spacer-cell size="8"></nldd-spacer-cell>
                  <nldd-text-cell [attr.text]="project.alias"></nldd-text-cell>
                  @if (isProjectSelected(project.id)) {
                    <nldd-icon-cell icon="check-mark" size="20"></nldd-icon-cell>
                  }
                  <nldd-spacer-cell size="8"></nldd-spacer-cell>
                </nldd-list-item>
              }
            </nldd-list-item>
          }
        }
      </nldd-list>
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
