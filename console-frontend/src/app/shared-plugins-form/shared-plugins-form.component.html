<nldd-form (submit)="onSubmit($event)">
  @if (isLoading()) {
    <nldd-activity-indicator
      show-text
      text="Loading plugins and presets..."
    ></nldd-activity-indicator>
  } @else if (errorMessage()) {
    <!-- A dialog rather than a banner: a banner announces something about the
         form below it, and a form that never loaded has nothing below it. -->
    <nldd-inline-dialog
      variant="alert"
      text="Plugins could not be loaded"
      supporting-text="The list of plugins and presets comes from the server, and the server did not answer."
    >
      <nldd-button
        slot="actions"
        type="button"
        text="Try again"
        (click)="load()"
      ></nldd-button>
    </nldd-inline-dialog>
  } @else {
    <nldd-form-field label="Plugins">
      <!-- The preset lives inside this field, above the list: it is a control
           for that list, not a question of its own. -->
      <nldd-toggle-button-group
        type="radio"
        name="preset"
        accessible-label="Plugin preset"
        (change)="onPresetRadioChange($event)"
      >
        @for (preset of presets; track preset.id) {
          <nldd-toggle-button
            [value]="preset.id"
            [attr.text]="preset.name"
            [selected]="selectedPreset === preset.id"
          ></nldd-toggle-button>
        }
        <nldd-toggle-button
          value="custom"
          text="Custom selection"
          [selected]="selectedPreset === 'custom'"
        ></nldd-toggle-button>
      </nldd-toggle-button-group>
      <nldd-spacer size="12"></nldd-spacer>
      @if (plugins.length === 0) {
        <nldd-inline-dialog
          icon="plugin"
          icon-color="secondary"
          text="No plugins found"
        ></nldd-inline-dialog>
      } @else {
        <!-- The row itself is the control (role="checkbox"), so the whole line
             toggles the plugin instead of only the box. That makes the
             description part of the hit area, which is where the reason to
             toggle actually is.
             A checkbox and not a switch: nothing happens until Save changes, and
             a switch promises an effect the moment you flip it.
             The box is decoration: `inert` keeps it out of the tab order and out
             of the accessibility tree, which the row already covers. A second
             focusable control would double the tab stops and announce the state
             twice. -->
        <nldd-list
          variant="box-tinted"
          accessible-label="Plugins"
        >
          @for (plugin of plugins; track plugin.id) {
            <nldd-list-item
              checkbox
              [checked]="plugin.selected"
              (change)="onPluginToggle(plugin, $any($event).detail.checked)"
            >
              <nldd-cell inert>
                <nldd-checkbox [checked]="plugin.selected"></nldd-checkbox>
              </nldd-cell>
              <nldd-spacer-cell size="12"></nldd-spacer-cell>
              <!-- The same logo the catalogue and the cluster page show, so a
                   plugin stays recognizable by sight while you pick it. Decorative:
                   the name is right beside it. -->
              <nldd-cell>
                <app-plugin-icon
                  [name]="pluginIconName(plugin.name)"
                  class="block h-6 w-6"
                />
              </nldd-cell>
              <nldd-spacer-cell size="12"></nldd-spacer-cell>
              <nldd-text-cell
                [attr.text]="plugin.displayName"
                [attr.supporting-text]="plugin.descriptionShort"
              ></nldd-text-cell>
            </nldd-list-item>
          }
        </nldd-list>
      }
    </nldd-form-field>
    <nldd-form-actions>
      <ng-content></ng-content>
    </nldd-form-actions>
  }
</nldd-form>
