<nldd-step-indicator
  class="mb-6 block"
  accessible-label="Cluster creation progress"
  [current]="currentStepNumber()"
>
  @for (step of steps; track step.route; let i = $index) {
    <nldd-step-indicator-item
      [text]="step.name"
      [status]="stepStatus(i)"
      [button]="canNavigate(i)"
      (click)="goToStep(i)"
    ></nldd-step-indicator-item>
  }
</nldd-step-indicator>

<div class="card">
  <router-outlet (activate)="onActivate()"></router-outlet>
</div>
