<nldd-sheet
  #createNamespaceSheet
  appSheetSync
  [show]="show()"
  [attr.accessible-label]="'New namespace for ' + projectName()"
  placement="right"
  (close)="onClose()"
>
  <nldd-page sticky-header>
    <nldd-top-title-bar
      slot="header"
      [attr.text]="'New namespace for ' + projectName()"
      collapse-anchor="new-namespace-title"
      dismiss-text="Cancel"
      (dismiss)="onClose()"
    ></nldd-top-title-bar>
    <nldd-simple-section>
      <nldd-title
        id="new-namespace-title"
        size="3"
      >
        <h1>New namespace for {{ projectName() }}</h1>
      </nldd-title>
      <nldd-spacer size="16"></nldd-spacer>
      @if (createErrorMessage()) {
        <nldd-banner
          variant="critical"
          [attr.text]="createErrorMessage()"
        ></nldd-banner>
        <nldd-spacer size="16"></nldd-spacer>
      }
      <nldd-form
        [formGroup]="namespaceForm"
        (submit)="createNamespace($event)"
        (keydown.enter)="createNamespace($event)"
      >
        <!-- The rules as a list, each checking itself while you type. The
             pattern behind them is one regular expression saying three things
             at once, and the message that came with it said all three in one
             sentence; here each one goes quiet on its own. No placeholder: it
             disappears the moment you start typing, exactly when you would want
             to check the rule again. -->
        <nldd-form-field label="Namespace name">
          <nldd-text-field
            appAutofocus
            id="namespaceName"
            autocomplete="off"
            [value]="namespaceForm.get('name')?.value ?? ''"
            [invalid]="isNameInvalid()"
            (input)="onNameInput($event)"
          ></nldd-text-field>
          <nldd-validation-list>
            <!-- No hint on this one: the name is the only field, so that it is
                 needed goes without saying until it is missing. It only ever
                 shows in the critical state, so it reads as what is wrong
                 rather than as a requirement. -->
            <nldd-validation-item
              id="namespace-name-required"
              required
            >
              A namespace name is required
            </nldd-validation-item>
            <!-- Which characters first, then where they may sit: the one below
                 is a refinement of this one, and reading them the other way
                 round asks you to hold a rule you have not been given yet. -->
            <nldd-validation-item
              id="namespace-name-characters"
              hint
              match="^[-a-z0-9]*$"
            >
              Only lowercase letters, numbers and hyphens
            </nldd-validation-item>
            <!-- Case is deliberately not checked here, even though the value
                 has to be lowercase: the line above owns that rule, and a
                 pattern refusing "Abc" would paint this line red about a name
                 that does start with a letter. The optional group is what lets
                 a one-character name through, since "a" is the first and the
                 last character at once. -->
            <nldd-validation-item
              id="namespace-name-edges"
              hint
              match="^[a-zA-Z](.*[a-zA-Z0-9])?$"
            >
              Starts with a letter and ends with a letter or number
            </nldd-validation-item>
            <nldd-validation-item
              id="namespace-name-length"
              hint
              [attr.maxlength]="maxNameLength()"
            >
              {{ maxNameLengthText() }}
            </nldd-validation-item>
          </nldd-validation-list>
        </nldd-form-field>
        <nldd-form-actions>
          <nldd-button
            type="button"
            (click)="createNamespace()"
            text="Create namespace"
            [attr.loading]="isCreatingNamespace() ? '' : null"
            appearance="primary"
            width="full"
          ></nldd-button>
        </nldd-form-actions>
      </nldd-form>
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
