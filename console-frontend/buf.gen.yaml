version: v2
plugins:
  - local: protoc-gen-es
    out: src/generated
    opt:
      - target=ts
    include_imports: true
inputs:
  - directory: ../authn-api/pkg/proto
  - directory: ../organization-api/pkg/proto
  - directory: ../marketplace-api/pkg/proto
  - directory: ../marketplace-admin-api/pkg/proto
  - directory: ../marketplace-catalog-api/pkg/proto
  - directory: ../marketplace-registry-api/pkg/proto
  # Only the public overview: fleet.v1 is the staff API and has no place in
  # the console bundle.
  - directory: ../platform-api/pkg/proto
    paths:
      - ../platform-api/pkg/proto/platform
