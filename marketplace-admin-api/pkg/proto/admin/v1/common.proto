edition = "2023";

package admin.v1;

import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";
import "marketplace/v1/common.proto";

option features.(pb.go).api_level = API_OPAQUE;
option features.field_presence = IMPLICIT;
option go_package = "github.com/fundament-oss/fundament/marketplace-admin-api/pkg/proto/gen/admin/v1;adminv1";

// Fixed set offered in the reject dialog. Backoffice reporting only: the
// developer never sees this value, they receive PluginVersion.review_feedback.
enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_INCOMPLETE_METADATA = 1;
  REJECTION_REASON_DUPLICATE = 2;
  REJECTION_REASON_SECURITY_CONCERNS = 3;
  REJECTION_REASON_NAMING_GUIDELINES = 4;
  REJECTION_REASON_OUT_OF_SCOPE = 5;
  REJECTION_REASON_OTHER = 6;
}

// A plugin version awaiting or having gone through review. Identity, decision
// and the version's logos: everything else is resolved through this service's
// read RPCs. The logos are inlined so a review list can show them, which adds
// up to about 44 KB per row.
// There is no listing snapshot — a reviewer sees the listing as it stands, so
// an edit made after submitting is visible to the reviewer.
message Submission {
  string id = 10;
  string plugin_id = 20;
  string plugin_version_id = 30;
  // Publishing organization (tenant.organizations), resolved through this
  // service's ListPublishers — organization-api's GetOrganization is scoped to
  // members and a reviewer is not one.
  string organization_id = 40;
  // The developer who submitted (tenant.users). No lookup serves this yet —
  // see FUN-20's deferred list.
  string submitter_user_id = 50;
  marketplace.v1.SubmissionStatus status = 60;
  google.protobuf.Timestamp submitted = 70;

  // Set once a decision is made.
  google.protobuf.Timestamp reviewed = 80;
  // The deciding Fundament staff member (dcim.users), resolved through this
  // service's ListReviewers. Not the same namespace as submitter_user_id,
  // which is a tenant.users id.
  string reviewer_user_id = 90;
  RejectionReason rejection_reason = 100;
  string feedback = 110;
  // Logo of the submitted version, a data: URI; empty when it declares none.
  string logo = 120;
  string logo_dark = 130;
}

// The listing a submission points at, as it stands now. Deliberately narrower
// than the developer's authoring shape: a reviewer judges the listing copy and
// its classification, and does not need the authoring-only fields.
message Plugin {
  string id = 10;
  // Stable identifier (appstore.plugins.name), unique per publisher.
  string name = 20;
  string display_name = 30;
  string description_short = 40;
  string description = 50;
  // Publishing organization, resolved through ListPublishers.
  string organization_id = 60;
  // Listing artwork, not a container image.
  string image = 70;
  repeated string category_ids = 80;
  repeated string tags = 90;
  google.protobuf.Timestamp created = 100;
  google.protobuf.Timestamp updated = 110;
  // Trust and support badges, Fundament-assigned.
  repeated marketplace.v1.PluginLabel labels = 120;
}

// The version under review. Carries the review payload — what the plugin will
// be allowed to do once installed — because those are properties of the
// version, derived from its pinned definition manifest.
message PluginVersion {
  string id = 10;
  string plugin_id = 20;
  string version = 30;
  // Container image the plugin runs, read out of the manifest.
  string image = 40;
  string definition_hash = 50;
  string release_notes = 60;
  marketplace.v1.SubmissionStatus status = 70;
  // Platform capabilities the version declares, e.g. "internet_access".
  repeated string capabilities = 80;
  repeated marketplace.v1.PluginPermission permissions = 90;
  google.protobuf.Timestamp created = 100;
  google.protobuf.Timestamp submitted = 110;
  google.protobuf.Timestamp published = 120;
  // Set when the stored manifest failed to parse, in which case capabilities
  // and permissions are absent because they could not be derived — not
  // because the version declares none. A reviewer must not read the empty
  // sections as "asks for nothing"; a version whose review payload cannot be
  // displayed is a version that cannot be approved responsibly.
  string manifest_error = 130;
  // Menu icon data: URIs, sorted by digest.
  repeated string menu_icons = 140;
  // The definition.yaml as stored, not a re-serialization: definition_hash is
  // the sha256 of exactly these bytes. Carried so the reviewer can read, and
  // diff, what the version declares.
  bytes manifest = 150;
}

// A Fundament staff member who decided a submission (dcim.users). Name only:
// the backoffice shows who decided, and has no use for contact details.
message Reviewer {
  string id = 10;
  string name = 20;
}

enum ImageAnalysisStatus {
  // No analysis exists for the version (yet).
  IMAGE_ANALYSIS_STATUS_UNSPECIFIED = 0;
  IMAGE_ANALYSIS_STATUS_PENDING = 1;
  IMAGE_ANALYSIS_STATUS_RUNNING = 2;
  // An attempt failed and another is scheduled; status_info says why.
  IMAGE_ANALYSIS_STATUS_RETRYING = 3;
  IMAGE_ANALYSIS_STATUS_COMPLETED = 4;
  // Retrying will not help; status_info says why. A new submission round
  // queues the analysis again.
  IMAGE_ANALYSIS_STATUS_FAILED = 5;
}

// How an entry differs from the base version.
enum Change {
  // Not compared: there is no base, or one of the two analyses is not done.
  CHANGE_UNSPECIFIED = 0;
  CHANGE_UNCHANGED = 1;
  CHANGE_ADDED = 2;
  CHANGE_REMOVED = 3;
  // A package at another version, or a file with other contents, mode or
  // link target.
  CHANGE_CHANGED = 4;
}

// One version's image analysis, without its lists.
message ImageAnalysis {
  string plugin_version_id = 10;
  ImageAnalysisStatus status = 20;
  string status_info = 30;
  google.protobuf.Timestamp analyzed = 40;
  // The platform manifest that was analyzed.
  string image_digest = 50;
  string platform = 60;
  // Every platform the image index offers; empty for a single-platform image.
  repeated string platforms = 70;
  // The file list stopped at its cap, so a file diff may report files as
  // added or removed that only fell past the cap.
  bool files_truncated = 80;
}

message ChangeSummary {
  int32 unchanged = 10;
  int32 added = 20;
  int32 removed = 30;
  int32 changed = 40;
}

message ImagePackage {
  string name = 10;
  // Empty for a REMOVED package, which carries base_version instead.
  string version = 20;
  // The ecosystem, from the purl: deb, apk, golang, npm, ...
  string type = 30;
  string purl = 40;
  repeated string licenses = 50;
  Change change = 60;
  // Set for CHANGED and REMOVED.
  string base_version = 70;
}

message ImageFile {
  string path = 10;
  int64 size = 20;
  // Permission bits, e.g. 0755.
  uint32 mode = 30;
  // Symlink or hard link target; empty for a regular file.
  string link = 40;
  Change change = 50;
}
