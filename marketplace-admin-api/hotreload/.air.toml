root = "/src"
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/marketplace-admin-api ./marketplace-admin-api/cmd/fun-marketplace-admin-api"
entrypoint = "tmp/marketplace-admin-api"
include_ext = ["go", "mod", "sum"]
include_dir = ["marketplace-admin-api", "marketplace-api", "common"]
exclude_dir = ["tmp"]
delay = 500

[log]
time = false
