root = "/src"
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/fun-authn-api ./authn-api/cmd/fun-authn-api"
entrypoint = "tmp/fun-authn-api"
include_ext = ["go", "mod", "sum"]
include_dir = ["authn-api", "plugin-proxy", "common"]
exclude_dir = ["tmp"]
delay = 500
# Services exit when the database schema is not yet migrated; this brings them back.
rerun = true
rerun_delay = 2000

[log]
time = false

[misc]
clean_on_exit = true
