version: v2
plugins:
  - local: protoc-gen-es
    out: src/generated
    opt:
      - target=ts
    include_imports: true
inputs:
  # The developer portal names the organizations it publishes for; only the
  # organization service, not the rest of organization-api's surface. First,
  # because organization-api pins an older protovalidate: generated imports are
  # written per input, so the marketplace inputs below leave the newer
  # buf/validate in place.
  - directory: ../organization-api/pkg/proto
    paths:
      - ../organization-api/pkg/proto/v1/organization.proto
  - directory: ../authn-api/pkg/proto
  - directory: ../marketplace-api/pkg/proto
  - directory: ../marketplace-admin-api/pkg/proto
  - directory: ../marketplace-catalog-api/pkg/proto
  - directory: ../marketplace-registry-api/pkg/proto
