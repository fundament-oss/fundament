# Workspace, not a module: catalog/v1, registry/v1 and admin/v1 live with the
# services that serve them, and all import marketplace/v1, which belongs to
# none of them. buf resolves a local import only within a workspace, and the
# module directories are siblings, so it has to sit at the root.
version: v2
modules:
  - path: marketplace-api/pkg/proto
  - path: marketplace-admin-api/pkg/proto
  - path: marketplace-catalog-api/pkg/proto
  - path: marketplace-registry-api/pkg/proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  # install.v1 deliberately reuses catalog.v1's request and response messages:
  # it is the same read surface under a tenant-aware role (FUN-22), and one
  # message set keeps the Go handler and the console client shared.
  ignore_only:
    RPC_REQUEST_RESPONSE_UNIQUE:
      - marketplace-catalog-api/pkg/proto/install/v1/install.proto
      - marketplace-catalog-api/pkg/proto/catalog/v1/catalog.proto
breaking:
  use:
    - FILE
