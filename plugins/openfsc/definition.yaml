apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: openfsc
  displayName: OpenFSC
  version: v4.0.0
  description: Federated Service Connectivity (FSC) for teams. Installs the standalone openfsc-operator; each team declares an FSCInstallation in its namespace to run an OpenFSC peer there — joining an existing FSC group, or acting as its own group Directory.
  author: Fundament
  license: AGPL-3.0
  icon: cloud
  urls:
    homepage: https://fsc-standaard.nl
    repository: https://gitlab.com/rinis-oss/fsc/open-fsc
    documentation: https://logius-standaarden.github.io/fsc-core/
  tags:
    - fsc
    - federation
    - common-ground
spec:
  permissions:
    capabilities:
      # Pull container images (and the cert-manager/CloudNativePG charts) from
      # public registries during install.
      - internet_access
    # plugin-controller turns this block into the plugin's ClusterRole: the plugin
    # can only do what is listed here.
    rbac:
      - apiGroups: ["openfsc.fundament.io"]
        resources: ["fscinstallations"]
        verbs: ["get", "list", "watch"]
      # Helm-install the openfsc-operator chart (Deployment + RBAC +
      # ServiceAccount, plus Helm's own release-state Secrets).
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: [""]
        resources: ["services", "serviceaccounts", "secrets", "configmaps"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

      # --- Install-time permissions ---
      # The plugin runs `helm upgrade --install --create-namespace --wait` for cert-manager
      # v1.17.2, CloudNativePG 0.24.0 and the vendored openfsc-operator chart. These rules
      # cover Helm's release storage and what those charts create: CRDs, webhooks,
      # controller Deployments, the cert-manager startup Job, ServiceAccounts, Services,
      # ConfigMaps and RBAC.
      - apiGroups: [""]
        resources: ["namespaces"] # helm --create-namespace
        verbs: ["get", "list", "watch", "create"]
      - apiGroups: [""]
        resources: ["pods"] # helm --wait readiness polling
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["replicasets"] # helm --wait polls the Deployments' ReplicaSets
        verbs: ["get", "list", "watch"]
      - apiGroups: ["batch"]
        resources: ["jobs"] # cert-manager startupapicheck Job
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["admissionregistration.k8s.io"]
        resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["clusterroles", "roles"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["clusterrolebindings", "rolebindings"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  crds:
    - fscinstallations.openfsc.fundament.io

  menu:
    project:
      - crd: fscinstallations.openfsc.fundament.io
        list: true
        detail: true
        icon: cloud

  customComponents:
    FSCInstallation:
      list: fscinstallations-list.html
      detail: fscinstallations-detail.html
      create: fscinstallations-create.html

  allowedResources:
    - group: openfsc.fundament.io
      version: v1
      resource: fscinstallations
      verbs: [list, get, create]

  uiHints:
    fscinstallations.openfsc.fundament.io:
      statusMapping:
        jsonPath: ".status.phase"
        values:
          "Active":
            badge: success
            label: Active
          "Pending":
            badge: warning
            label: Pending
          "Error":
            badge: danger
            label: Error
