<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create SecurityPolicy</title>
  </head>
  <body class="light">
    <div class="plugin-card">
      <nldd-title size="3"><h1>Create SecurityPolicy</h1></nldd-title>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-text id="intro">Loading…</nldd-text>
      <nldd-spacer size="12"></nldd-spacer>

      <nldd-form>
        <form id="form" hidden>
          <nldd-banner id="error" variant="critical" hidden></nldd-banner>

          <nldd-form-field label="Name">
            <nldd-text-field
              id="name"
              name="name"
              required
              maxlength="63"
              pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?"
              placeholder="cors"
              unmet="name-error"
            ></nldd-text-field>
            <nldd-form-field-help-text
              >Lowercase letters, digits and dashes.</nldd-form-field-help-text
            >
            <nldd-validation-list>
              <nldd-validation-item id="name-error"
                >Enter a valid name.</nldd-validation-item
              >
            </nldd-validation-list>
          </nldd-form-field>

          <div id="namespace-field"></div>

          <nldd-form-section text="Attach to (targetRef)">
            <nldd-form-field label="Kind">
              <nldd-dropdown>
                <select
                  id="target-kind"
                  name="target-kind"
                  aria-label="Target kind"
                >
                  <option value="Gateway">Gateway</option>
                  <option value="HTTPRoute">HTTPRoute</option>
                  <option value="GRPCRoute">GRPCRoute</option>
                </select>
              </nldd-dropdown>
            </nldd-form-field>
            <nldd-form-field label="Name">
              <nldd-text-field
                id="target-name"
                name="target-name"
                required
                placeholder="demo"
                unmet="target-name-error"
              ></nldd-text-field>
              <nldd-validation-list>
                <nldd-validation-item id="target-name-error"
                  >This field is required.</nldd-validation-item
                >
              </nldd-validation-list>
            </nldd-form-field>
          </nldd-form-section>

          <nldd-form-section text="CORS (optional)">
            <nldd-form-field label="Allowed origins">
              <nldd-text-field
                id="cors-origins"
                name="cors-origins"
                placeholder="https://app.example.com, https://*.example.com"
              ></nldd-text-field>
              <nldd-form-field-help-text
                >Comma-separated origins. Leave blank to skip
                CORS.</nldd-form-field-help-text
              >
            </nldd-form-field>
            <nldd-form-field label="Allowed methods">
              <nldd-text-field
                id="cors-methods"
                name="cors-methods"
                placeholder="GET, POST, PUT, DELETE"
              ></nldd-text-field>
              <nldd-form-field-help-text
                >Comma-separated HTTP methods.</nldd-form-field-help-text
              >
            </nldd-form-field>
          </nldd-form-section>

          <nldd-form-actions>
            <nldd-button-group orientation="horizontal">
              <nldd-button
                id="submit"
                type="button"
                variant="primary"
                text="Create SecurityPolicy"
              ></nldd-button>
              <nldd-button
                id="back"
                type="button"
                variant="secondary"
                text="Back"
              ></nldd-button>
            </nldd-button-group>
          </nldd-form-actions>
        </form>
      </nldd-form>
    </div>

    <script type="module" src="/src/securitypolicies-create.ts"></script>
  </body>
</html>
