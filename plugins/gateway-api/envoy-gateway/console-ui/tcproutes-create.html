<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create TCPRoute</title>
  </head>
  <body class="light">
    <div class="plugin-card">
      <nldd-title size="3"><h1>Create TCPRoute</h1></nldd-title>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-text id="intro">Loading…</nldd-text>
      <nldd-spacer size="12"></nldd-spacer>

      <nldd-form>
        <form id="form" hidden>
          <nldd-banner id="error" variant="critical" hidden></nldd-banner>

          <nldd-form-field label="Name">
            <nldd-text-field
              id="name"
              name="name"
              required
              maxlength="63"
              pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?"
              placeholder="tcp"
              unmet="name-error"
            ></nldd-text-field>
            <nldd-form-field-help-text
              >Lowercase letters, digits and dashes.</nldd-form-field-help-text
            >
            <nldd-validation-list>
              <nldd-validation-item id="name-error"
                >Enter a valid name.</nldd-validation-item
              >
            </nldd-validation-list>
          </nldd-form-field>

          <div id="namespace-field"></div>

          <nldd-form-section text="Gateway">
            <nldd-form-field label="Gateway name">
              <nldd-text-field
                id="parent-name"
                name="parent-name"
                required
                placeholder="demo"
                unmet="parent-name-error"
              ></nldd-text-field>
              <nldd-form-field-help-text
                >The Gateway this route attaches to
                (parentRef).</nldd-form-field-help-text
              >
              <nldd-validation-list>
                <nldd-validation-item id="parent-name-error"
                  >This field is required.</nldd-validation-item
                >
              </nldd-validation-list>
            </nldd-form-field>
            <nldd-form-field label="Listener (recommended)">
              <nldd-text-field
                id="parent-section"
                name="parent-section"
                placeholder="postgres"
              ></nldd-text-field>
              <nldd-form-field-help-text
                >TCP listener name (sectionName) to attach
                to.</nldd-form-field-help-text
              >
            </nldd-form-field>
          </nldd-form-section>

          <nldd-form-section text="Backend">
            <div class="plugin-row">
              <nldd-form-field label="Service" style="flex: 1 1 16rem">
                <nldd-text-field
                  id="backend-name"
                  name="backend-name"
                  required
                  placeholder="db"
                  unmet="backend-name-error"
                ></nldd-text-field>
                <nldd-validation-list>
                  <nldd-validation-item id="backend-name-error"
                    >This field is required.</nldd-validation-item
                  >
                </nldd-validation-list>
              </nldd-form-field>
              <nldd-form-field label="Port" style="flex: 0 0 8rem">
                <nldd-text-field
                  id="backend-port"
                  name="backend-port"
                  required
                  type="number"
                  min="1"
                  max="65535"
                  value="5432"
                  unmet="backend-port-error"
                ></nldd-text-field>
                <nldd-validation-list>
                  <nldd-validation-item id="backend-port-error"
                    >Enter a valid port.</nldd-validation-item
                  >
                </nldd-validation-list>
              </nldd-form-field>
            </div>
          </nldd-form-section>

          <nldd-form-actions>
            <nldd-button-group orientation="horizontal">
              <nldd-button
                id="submit"
                type="button"
                variant="primary"
                text="Create TCPRoute"
              ></nldd-button>
              <nldd-button
                id="back"
                type="button"
                variant="secondary"
                text="Back"
              ></nldd-button>
            </nldd-button-group>
          </nldd-form-actions>
        </form>
      </nldd-form>
    </div>

    <script type="module" src="/src/tcproutes-create.ts"></script>
  </body>
</html>
