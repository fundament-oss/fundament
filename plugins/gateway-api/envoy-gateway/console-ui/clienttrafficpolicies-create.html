<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create ClientTrafficPolicy</title>
  </head>
  <body class="light">
    <div class="plugin-card">
      <nldd-title size="3"><h1>Create ClientTrafficPolicy</h1></nldd-title>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-text id="intro">Loading…</nldd-text>
      <nldd-spacer size="12"></nldd-spacer>

      <nldd-form>
        <form id="form" hidden>
          <nldd-banner id="error" variant="critical" hidden></nldd-banner>

          <nldd-form-field label="Name">
            <nldd-text-field
              id="name"
              name="name"
              required
              maxlength="63"
              pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?"
              placeholder="client-tls"
              unmet="name-error"
            ></nldd-text-field>
            <nldd-form-field-help-text
              >Lowercase letters, digits and dashes.</nldd-form-field-help-text
            >
            <nldd-validation-list>
              <nldd-validation-item id="name-error"
                >Enter a valid name.</nldd-validation-item
              >
            </nldd-validation-list>
          </nldd-form-field>

          <div id="namespace-field"></div>

          <nldd-form-section text="Attach to Gateway (targetRef)">
            <!-- ClientTrafficPolicy only targets a Gateway. -->
            <input id="target-kind" type="hidden" value="Gateway" />
            <nldd-form-field label="Gateway name">
              <nldd-text-field
                id="target-name"
                name="target-name"
                required
                placeholder="demo"
                unmet="target-name-error"
              ></nldd-text-field>
              <nldd-validation-list>
                <nldd-validation-item id="target-name-error"
                  >This field is required.</nldd-validation-item
                >
              </nldd-validation-list>
            </nldd-form-field>
          </nldd-form-section>

          <nldd-form-field label="Minimum TLS version (optional)">
            <nldd-dropdown>
              <select
                id="tls-min-version"
                name="tls-min-version"
                aria-label="Minimum TLS version"
              >
                <option value="">Default</option>
                <option value="1.2">1.2</option>
                <option value="1.3">1.3</option>
              </select>
            </nldd-dropdown>
            <nldd-form-field-help-text
              >Lowest TLS version the Gateway accepts from
              clients.</nldd-form-field-help-text
            >
          </nldd-form-field>

          <nldd-form-actions>
            <nldd-button-group orientation="horizontal">
              <nldd-button
                id="submit"
                type="button"
                variant="primary"
                text="Create ClientTrafficPolicy"
              ></nldd-button>
              <nldd-button
                id="back"
                type="button"
                variant="secondary"
                text="Back"
              ></nldd-button>
            </nldd-button-group>
          </nldd-form-actions>
        </form>
      </nldd-form>
    </div>

    <script type="module" src="/src/clienttrafficpolicies-create.ts"></script>
  </body>
</html>
