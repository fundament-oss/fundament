apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: external-dns
  displayName: External DNS
  version: v1.16.1
  description: Automatic DNS record management for Kubernetes resources using ExternalDNS.
  author: Fundament
  license: Apache-2.0
  icon: rectangle-stack
  urls:
    homepage: https://kubernetes-sigs.github.io/external-dns/
    repository: https://github.com/kubernetes-sigs/external-dns
    documentation: https://kubernetes-sigs.github.io/external-dns/latest/
  tags:
    - dns
    - networking
spec:
  permissions:
    capabilities:
      - internet_access
    rbac:
      - apiGroups:
          - externaldns.k8s.io
        resources:
          - dnsendpoints
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      - apiGroups:
          - externaldns.k8s.io
        resources:
          - dnsendpoints/status
        verbs:
          - get
          - list
          - watch
      # --- Install-time permissions ---
      # The plugin runs `helm upgrade --install external-dns --create-namespace --wait`.
      # These rules cover Helm's release storage and what chart 1.16.1 creates: the
      # DNSEndpoint CRD, the controller Deployment, its ServiceAccount, Service and RBAC.
      - apiGroups: [""]
        resources: ["secrets", "serviceaccounts", "services"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: [""]
        resources: ["namespaces"] # helm --create-namespace
        verbs: ["get", "list", "watch", "create"]
      - apiGroups: [""]
        resources: ["pods"] # helm --wait readiness polling
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["apps"]
        resources: ["replicasets"] # helm --wait polls the Deployment's ReplicaSets
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"] # DNSEndpoint CRD from the chart
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["clusterroles"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["clusterrolebindings"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  menu:
    project:
      - crd: dnsendpoints.externaldns.k8s.io
        list: true
        detail: true
        icon: rectangle-stack
  uiHints:
    dnsendpoints.externaldns.k8s.io:
      statusMapping:
        jsonPath: ".status.observedGeneration"
        values:
          "0":
            badge: warning
            label: Pending
        default:
          badge: success
          label: Active
