apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: zot
  displayName: zot
  version: v0.1.0
  description: An OCI-native container image registry. Installs zot in the cluster, reachable from workloads at zot.zot.svc:5000.
  author: Fundament
  license: Apache-2.0
  # The zot icon from the CNCF artwork repository (Apache-2.0), cropped to the
  # mark. Its cyan reads on light and dark backgrounds, so there is no iconDark.
  icon: logo.svg
  urls:
    homepage: https://zotregistry.dev
    repository: https://github.com/project-zot/zot
    documentation: https://zotregistry.dev/docs/
  tags:
    - registry
    - oci
    - containers
  # No category fits a registry, so the marketplace lists zot under Other.
spec:
  permissions:
    capabilities:
      # Pull the zot chart and image from public registries.
      - internet_access
    # plugin-controller turns this block into the plugin's ClusterRole: the plugin
    # can only do what is listed here.
    rbac:
      # --- Console ---
      # The plugin keeps its own cluster-scoped CRD for the console sidebar
      # (crds/), with one Registry object that holds zot's status. Create
      # cannot be limited to a name, so the other writes are.
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["get", "list", "watch", "create"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        resourceNames: ["registries.zot.fundament.io"]
        verbs: ["update", "patch", "delete"]
      - apiGroups: ["zot.fundament.io"]
        resources: ["registries", "registries/status"]
        verbs: ["get", "list", "watch", "create", "update", "patch"]

      # --- Install-time permissions ---
      # The plugin runs `helm upgrade --install --create-namespace --wait` for
      # zot chart 0.1.135 (release zot in namespace zot), and `helm uninstall`
      # on uninstall. With the chart's default values plus service.type=ClusterIP
      # the chart creates a ServiceAccount, a Service and a Deployment, and no
      # RBAC. The plugin reads the Deployment for its status.
      # The console CRD and Registry rules are at the top.
      - apiGroups: [""]
        resources: ["namespaces"] # helm --create-namespace
        verbs: ["get", "list", "watch", "create"]
      - apiGroups: [""]
        resources: ["secrets", "serviceaccounts", "services"] # secrets: Helm release storage
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: [""]
        resources: ["pods"] # helm --wait readiness polling
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["apps"]
        resources: ["replicasets"] # helm --wait polls the Deployment's ReplicaSets
        verbs: ["get", "list", "watch"]
  crds:
    - registries.zot.fundament.io

  # The console lists only CRDs in the sidebar, and only cluster-scoped ones at
  # the organization level. zot has none, so the plugin keeps its own: one
  # Registry, `zot`, with the status of the zot Deployment. The generated list
  # and detail pages show it.
  menu:
    organization:
      - crd: registries.zot.fundament.io
        list: true
        detail: true
        icon: menu.svg
        label: Registry

  allowedResources:
    - group: zot.fundament.io
      version: v1alpha1
      resource: registries
      verbs: [list, get]

  uiHints:
    registries.zot.fundament.io:
      statusMapping:
        jsonPath: ".status.phase"
        values:
          running:
            badge: success
            label: Running
          degraded:
            badge: danger
            label: Degraded
          failed:
            badge: danger
            label: Failed
        # installing, and a status the plugin has not written yet.
        default:
          badge: warning
          label: Installing
