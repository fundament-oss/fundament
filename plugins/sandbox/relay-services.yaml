# Services in the sandbox for the two relay containers of `just plugins sandbox-catalog`.
# No selector: the recipe writes an EndpointSlice per Service with the relay's address on
# the sandbox's docker network, so pluginController.catalogApiUrl and authnApiUrl
# (plugins/sandbox/values.yaml) keep one fixed name while that address changes.
apiVersion: v1
kind: Service
metadata:
  name: fundament-catalog-relay
  namespace: fundament
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fundament-authn-relay
  namespace: fundament
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
