# Plugin Sandbox - minimal values for plugin development
# Only enables the plugin controller; all other components stay disabled.

db:
  enabled: false

authnApi:
  enabled: false

organizationApi:
  enabled: false

consoleFrontend:
  enabled: false

docsFrontend:
  enabled: false

clusterWorker:
  enabled: false

authzWorker:
  enabled: false

openfga:
  enabled: false

dex:
  enabled: false

ingress:
  enabled: false

pluginController:
  enabled: true
  logLevel: debug
  # Lets plugin-controller skip the definitionHash check. Never enable in production.
  allowUnpinnedHash: true
  # The sandbox cluster is network-isolated from marketplace-catalog-api (which
  # lives in the management cluster). `just plugins sandbox-catalog` bridges the
  # two via a relay container published on the host; the controller reaches it
  # through host.k3d.internal. Run that recipe once after cluster setup. See FUN-19.
  catalogApiUrl: http://host.k3d.internal:38080
  # authn-api, bridged the same way on the next port (FUN-22): the controller
  # exchanges its projected token there. The sandbox verifier in authn-api
  # (authnApi.sandboxKubeconfigSecret in values-local.yaml) reviews it against
  # this cluster.
  authnApiUrl: http://host.k3d.internal:38081
  # The seeded acme-corp cluster: the only id the sandbox verifier answers for.
  clusterId: 019b4000-2000-7000-8000-000000000001
  organizationId: 019b4000-0000-7000-8000-000000000001
