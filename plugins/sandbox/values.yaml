# Plugin Sandbox - minimal values for plugin development
# Only enables the plugin controller; all other components stay disabled.

db:
  enabled: false

authnApi:
  enabled: false

organizationApi:
  enabled: false

consoleFrontend:
  enabled: false

docsFrontend:
  enabled: false

clusterWorker:
  enabled: false

authzWorker:
  enabled: false

openfga:
  enabled: false

dex:
  enabled: false

ingress:
  enabled: false

pluginController:
  enabled: true
  logLevel: debug
  # Allow a PluginInstallation that pins no definitionHash; the sandbox trusts its own registry.
  # TODO: this cannot actually be used. The CRD marks definitionRef immutable (self == oldSelf)
  # and the controller round-trips an absent definitionHash as "", so its first update is
  # rejected and the installation never reconciles. Either make the rule tolerate an absent
  # hash, or drop this flag.
  allowUnpinnedHash: true
  # The sandbox cluster is network-isolated from organization-api (which lives in
  # the management cluster). `just plugins sandbox-orgapi` bridges the two via a
  # relay container published on the host; the controller reaches it through
  # host.k3d.internal. Run that recipe once after cluster setup. See FUN-19.
  organizationApiUrl: http://host.k3d.internal:38080
