# Sample StoragePool for sandbox verification. Full walkthrough:
# docs/developer/fundament/k3d-block-devices.md
#
# k3d nodes have no raw disks, so provide loop-backed ones:
#
#   just storage-disks doctor      # check the kernel Docker runs on
#   just storage-disks attach      # creates /dev/loop0p1 .. /dev/loop2p1
#
# The PluginInstallation's local-development config keys are declared in
# definition.yaml's configSchema, and the full example is in the runbook's Phase 4.
#
# Finally, put real Disk names below — they are node name + a hash of the device's
# stable identity, so they differ per cluster:
#
#   kubectl get disks
apiVersion: storage.fundament.io/v1alpha1
kind: StoragePool
metadata:
  name: test-pool
spec:
  # Replace with actual Disk CR names from `kubectl get disks`:
  disks:
    - placeholder-node-loop0p1
  replication: auto
