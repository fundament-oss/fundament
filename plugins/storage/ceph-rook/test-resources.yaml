# Sample DiskPool for sandbox verification. Full walkthrough:
# docs/developer/fundament/k3d-block-devices.md
#
# k3d nodes have no raw disks, so provide loop-backed ones:
#
#   just storage-disks doctor      # check the kernel Docker runs on
#   just storage-disks attach      # creates /dev/loop0p1 .. /dev/loop2p1
#
# The PluginInstallation's local-development config keys are declared in
# definition.yaml's configSchema, and the full example is in the runbook's Phase 4.
#
# Finally, put real Disk names below — they are node name + a hash of the device's
# stable identity, so they differ per cluster:
#
#   kubectl get disks
apiVersion: ceph.fundament.io/v1alpha1
kind: DiskPool
metadata:
  name: test-pool
spec:
  # Replace with actual Disk CR names from `kubectl get disks`:
  disks:
    - name: placeholder-node-loop0p1
---
apiVersion: ceph.fundament.io/v1alpha1
kind: BlockStorage
metadata:
  name: test-block
spec: {}
---
apiVersion: ceph.fundament.io/v1alpha1
kind: FileStorage
metadata:
  name: test-file
spec:
  metadataServers: 1
---
apiVersion: ceph.fundament.io/v1alpha1
kind: ObjectStorage
metadata:
  name: test-object
spec:
  # replicas omitted: automatic, derived from the contributing nodes.
  gatewayInstances: 1
---
# Claim a bucket on test-object's StorageClass once it is Ready. Rook writes
# the S3 endpoint to ConfigMap test-bucket and the credentials to Secret
# test-bucket, both in this namespace.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: test-bucket
spec:
  generateBucketName: test-bucket
  storageClassName: cephobj-test-object
