---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: filestorages.ceph.fundament.io
spec:
  group: ceph.fundament.io
  names:
    kind: FileStorage
    listKind: FileStorageList
    plural: filestorages
    singular: filestorage
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.storageClassName
      name: StorageClass
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FileStorage provides shared volumes (ReadWriteMany), which many pods on many
          nodes can mount at once, over the shared Ceph cluster. It derives a
          StorageClass, named in status.storageClassName, for PersistentVolumeClaims
          to reference.

          The name-length limit exists because Rook labels the metadata-server
          deployment rook_file_system=cephfs-<name> and label values cap at 63
          characters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: |-
              FileStorageSpec defines a shared-filesystem (ReadWriteMany) StorageClass on
              the shared Ceph cluster, using the disks that DiskPools contribute.
            properties:
              metadataServers:
                default: 1
                description: |-
                  MetadataServers is the number of active filesystem metadata servers. Each
                  active server gets its own standby for failover.
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              replicas:
                description: |-
                  Replicas is how many copies Ceph keeps of each piece of data, for both
                  the filesystem's metadata and its contents. Absent derives it from the
                  number of nodes contributing disks (capped at 3).
                format: int32
                maximum: 3
                minimum: 1
                type: integer
            type: object
          status:
            description: |-
              ConsumerStatus is the observed state of a storage consumer and the
              StorageClass it derives.
            properties:
              conditions:
                description: Conditions carries the Ready condition, keyed by condition
                  type.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: |-
                  FailureDomain is where Ceph places the replicas of each piece of data:
                  "host" spreads them across nodes, "osd" only across disks.
                type: string
              message:
                description: |-
                  Message explains the current phase, naming the operator action needed
                  when the object is Degraded.
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Provisioning until the derived storage reports Ready, and
                  Degraded when reconciliation needs operator action.
                type: string
              replicas:
                description: |-
                  Replicas is the replica count in effect: spec.replicas clamped to the
                  contributing node count, or the derived count when spec.replicas is absent.
                type: integer
              storageClassName:
                description: |-
                  StorageClassName is the name of the derived StorageClass, which claims
                  (PersistentVolumeClaims, or ObjectBucketClaims for an object store)
                  reference.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'name must be at most 56 characters: Rook derives a cephfs-<name>
            label capped at 63'
          rule: size(self.metadata.name) <= 56
    served: true
    storage: true
    subresources:
      status: {}
