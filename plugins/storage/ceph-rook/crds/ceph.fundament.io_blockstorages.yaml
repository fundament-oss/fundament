---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: blockstorages.ceph.fundament.io
spec:
  group: ceph.fundament.io
  names:
    kind: BlockStorage
    listKind: BlockStorageList
    plural: blockstorages
    singular: blockstorage
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.storageClassName
      name: StorageClass
      type: string
    - jsonPath: .spec.default
      name: Default
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BlockStorage provides block volumes (ReadWriteOnce) over the shared Ceph
          cluster: it derives a StorageClass, named in status.storageClassName, for
          PersistentVolumeClaims to reference.

          The name-length limit exists because the derived objects are named
          ceph-<name> and object names cap at 253 characters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BlockStorageSpec defines a block-volume (ReadWriteOnce) StorageClass on the
              shared Ceph cluster, using the disks that DiskPools contribute.
            properties:
              default:
                description: |-
                  Default marks the derived StorageClass as the cluster default
                  (storageclass.kubernetes.io/is-default-class). If more than one
                  BlockStorage sets it, none is marked default and each is Degraded.
                type: boolean
              replication:
                default: auto
                description: |-
                  Replication is how many copies Ceph keeps of each piece of data: an
                  explicit count, or "auto" to derive it from the number of nodes
                  contributing disks (capped at 3).
                enum:
                - auto
                - "1"
                - "2"
                - "3"
                type: string
            type: object
          status:
            description: |-
              ConsumerStatus is the observed state of a BlockStorage or FileStorage and
              the StorageClass it derives.
            properties:
              conditions:
                description: Conditions carries the Ready condition, keyed by condition
                  type.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: |-
                  FailureDomain is where Ceph places the replicas of each piece of data:
                  "host" spreads them across nodes, "osd" only across disks.
                type: string
              message:
                description: |-
                  Message explains the current phase, naming the operator action needed
                  when the object is Degraded.
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Provisioning until the derived storage reports Ready, and
                  Degraded when reconciliation needs operator action.
                type: string
              replicas:
                description: Replicas is the replica count that spec.replication resolved
                  to.
                type: integer
              storageClassName:
                description: |-
                  StorageClassName is the name of the derived StorageClass, for
                  PersistentVolumeClaims to reference.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'name must be at most 248 characters: the derived ceph-<name> object
            name caps at 253'
          rule: size(self.metadata.name) <= 248
    served: true
    storage: true
    subresources:
      status: {}
