---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: storagepools.storage.fundament.io
spec:
  group: storage.fundament.io
  names:
    kind: StoragePool
    listKind: StoragePoolList
    plural: storagepools
    singular: storagepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.storageClassName
      name: StorageClass
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StoragePoolSpec is the operator's desired block storage.
            properties:
              disks:
                description: |-
                  Disks are the names of Disk objects to consume as OSDs. listType=set so the
                  API server rejects a repeat, which would be double-counted in status.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              replication:
                default: auto
                description: Replication selects replica count; "auto" derives it
                  from node count.
                enum:
                - auto
                - "1"
                - "2"
                - "3"
                type: string
            type: object
          status:
            description: |-
              StoragePoolStatus is the observed state.

              Every field describes this pool's contribution to one shared Ceph cluster, not
              storage that belongs to it: all pools feed a single OSD set, and the derived
              CephBlockPool has no CRUSH rule confining it to spec.disks.
            properties:
              conditions:
                description: |-
                  Conditions carries ConditionReady. listType=map on type so the API server
                  merges by condition type rather than by position.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                type: string
              message:
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation this status was computed
                  from. Below metadata.generation means the controller has not caught up with
                  the current spec, and every field above describes an older one.
                format: int64
                type: integer
              phase:
                type: string
              rawCapacityBytes:
                description: |-
                  RawCapacityBytes is the summed size of the disks this pool contributes,
                  before replication. Not the pool's capacity: volumes draw on the whole
                  cluster's OSDs, so dividing by Replicas means nothing. Use `ceph df`.
                format: int64
                type: integer
              replicas:
                description: |-
                  Sized against the nodes contributing disks to the whole cluster, since that
                  is what bounds where Ceph can place a replica.
                type: integer
              selectedDiskCount:
                description: |-
                  SelectedDiskCount is how many of spec.disks resolved to a usable Disk, not
                  how many OSDs are running: Rook creates those asynchronously, and removing a
                  disk from spec never removes its OSD (that needs a Ceph purge).
                type: integer
              storageClassName:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
