---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: disks.ceph.fundament.io
spec:
  group: ceph.fundament.io
  names:
    kind: Disk
    listKind: DiskList
    plural: disks
    singular: disk
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.path
      name: Path
      type: string
    - jsonPath: .status.size
      name: Size
      type: string
    - jsonPath: .status.available
      name: Available
      type: boolean
    - jsonPath: .status.filesystem
      name: Filesystem
      type: string
    - jsonPath: .status.claimedBy
      name: Claimed By
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Disk is a block device discovered on a cluster node. Disk discovery creates
          and updates Disks; select them in a DiskPool to use them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DiskSpec has no fields; disk discovery fills in status.
            type: object
          status:
            description: DiskStatus is the discovered state of a block device on a
              cluster node.
            properties:
              available:
                description: |-
                  Available reports whether the last probe found the device empty and
                  usable. ClaimedBy shows whether a DiskPool has claimed it.
                type: boolean
              claimedBy:
                description: ClaimedBy names the DiskPool this disk belongs to, empty
                  when unclaimed.
                type: string
              filesystem:
                description: |-
                  Filesystem is what the last probe found on the device, e.g. "ext4" or
                  "ceph_bluestore". Empty means the probe found none; the probe can be
                  stale.
                type: string
              model:
                description: Model is the device model the node reports.
                type: string
              nodeName:
                description: NodeName is the name of the cluster node the device is
                  attached to.
                type: string
              path:
                description: |-
                  Path is the kernel device name, e.g. /dev/sdb. The kernel may reassign it
                  on reboot; StablePath identifies the device.
                type: string
              rotational:
                description: Rotational is true for spinning disks.
                type: boolean
              serial:
                description: Serial is the device serial number the node reports.
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                description: Size is the device's capacity.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              stablePath:
                description: |-
                  StablePath is the device's /dev/disk/by-id link, empty when the node
                  reports none (loop devices, some virtual disks). It survives reboots, so
                  when set it is the name recorded in the Ceph cluster.
                type: string
              type:
                description: Type classifies the device as hdd, ssd or nvme.
                enum:
                - hdd
                - ssd
                - nvme
                type: string
              wwn:
                description: |-
                  WWN is the device's World Wide Name, a fallback identity for devices
                  without a by-id link.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
