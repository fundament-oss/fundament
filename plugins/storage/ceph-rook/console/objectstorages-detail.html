<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Object Storage Detail</title>
  </head>
  <body class="light">
    <!-- No title and no way back: the Console's page around this frame has
         both, with the name and status. -->
    <div class="plugin-card">
      <!-- No Delete: the only guard against deleting an ObjectStorage with
           buckets still bound to its StorageClass ran here, in the browser,
           while the API accepted the same delete from kubectl or any other
           client. A guard in one client reads as a platform guarantee it is
           not. The button comes back once the check is server-side. -->
      <div id="actions" hidden>
        <nldd-button id="edit-btn" type="button" appearance="secondary" start-icon="edit"
                     text="Edit…"></nldd-button>
        <nldd-spacer size="16"></nldd-spacer>
      </div>
      <div id="content"></div>
      <div id="extra"></div>
    </div>
    <script type="module" src="./objectstorages-detail.js"></script>
  </body>
</html>
