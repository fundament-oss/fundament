<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File Storage</title>
  </head>
  <body class="light">
    <div class="plugin-card">
      <h1 class="plugin-heading">File Storage</h1>
      <div class="plugin-actions">
        <button type="button" class="plugin-button" id="create-btn">
          Create file storage
        </button>
      </div>
      <table class="plugin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phase</th>
            <th>Storage Class</th>
            <th>Replicas</th>
            <th>MDS</th>
            <th>Failure Domain</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="7" class="plugin-text">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script type="module" src="./filestorages-list.js"></script>
  </body>
</html>
