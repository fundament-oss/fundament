<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Storage Pool Detail</title>
  </head>
  <body class="light">
    <div class="plugin-card">
      <h1 class="plugin-heading" id="heading">Storage Pool</h1>
      <div id="content"><p class="plugin-text">Loading…</p></div>
      <!-- No Delete: the only guard against deleting a pool with volumes still
           bound to its StorageClass ran here, in the browser, while the API
           accepted the same delete from kubectl or any other client. A guard in
           one client reads as a platform guarantee it is not. The button comes
           back once the check is server-side. -->
      <div id="actions" class="plugin-actions" hidden>
        <button type="button" class="plugin-button" id="edit-btn">Edit</button>
      </div>
    </div>
    <script type="module" src="./storagepools-detail.js"></script>
  </body>
</html>
