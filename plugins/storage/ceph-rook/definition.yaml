apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: ceph-rook
  displayName: Ceph Storage (Rook)
  version: v0.1.0
  description: Block storage for in-cluster workloads, backed by Ceph and Rook.
  author: Fundament
  license: Apache-2.0
  icon: server-stack
  urls:
    homepage: https://rook.io
    repository: https://github.com/rook/rook
    documentation: https://rook.io/docs
  tags:
    - storage
    - block
    - ceph
spec:
  permissions:
    capabilities:
      - internet_access
    rbac:
      # --- Fundament storage resources this plugin reconciles ---
      - apiGroups:
          - storage.fundament.io
        resources:
          - disks
          - disks/status
          - storagepools
          - storagepools/status
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- Rook/Ceph CRDs this plugin manages ---
      - apiGroups:
          - ceph.rook.io
        resources:
          - cephclusters
          - cephblockpools
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- StorageClasses: the StoragePool controller manages these via
      # CreateOrUpdate (needs create+update) and watches them through the
      # controller's Owns(&StorageClass{}) informer (needs list+watch).
      # No delete (cascade is done by the k8s garbage collector). ---
      - apiGroups:
          - storage.k8s.io
        resources:
          - storageclasses
        verbs:
          - get
          - list
          - watch
          - create
          - update
      # --- Node and ConfigMap inspection for disk discovery ---
      - apiGroups:
          - ""
        resources:
          - nodes
          - configmaps
        verbs:
          - get
          - list
          - watch
      # --- CRD management: apply own storage.fundament.io CRDs at install time ---
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
      # --- Rook operator install (cluster-admin-equivalent) ---
      # The plugin's ServiceAccount runs `helm install` of the full Rook-Ceph
      # operator, which creates privileged, host-networked device-discovery
      # DaemonSets, the Ceph CSI driver, and its own cluster-wide RBAC
      # (ClusterRoles/Bindings with escalate+bind) across namespaces. There is
      # no meaningfully narrower stable rule set for that, and the platform has
      # no cluster-admin escalation field (spec.clusterRoles no longer exists).
      # The plugin-controller materialises the rule below into a ClusterRole
      # bound to this plugin's SA, intersected with the installing admin's own
      # permissions (FUN-17). This wildcard is the honest representation of what
      # a node-level storage operator requires. The specific rules above are
      # retained to document the plugin binary's own direct API usage.
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["*"]
  menu:
    organization:
      - crd: storagepools.storage.fundament.io
        list: true
        detail: true
        icon: circle-stack
      - crd: disks.storage.fundament.io
        list: true
        icon: server-stack
  crds:
    - disks.storage.fundament.io
    - storagepools.storage.fundament.io
  customComponents:
    StoragePool:
      list: storagepools-list.html
      detail: storagepools-detail.html
      create: storagepools-create.html
    Disk:
      list: disks-list.html
  uiHints:
    storagepools.storage.fundament.io:
      statusMapping:
        jsonPath: ".status.phase"
        values:
          Ready:
            badge: success
            label: Ready
          Provisioning:
            badge: warning
            label: Provisioning
          Degraded:
            badge: danger
            label: Degraded
  allowedResources:
    - group: storage.fundament.io
      version: v1alpha1
      resource: disks
      verbs: [list, get]
    - group: storage.fundament.io
      version: v1alpha1
      resource: storagepools
      verbs: [list, get, create, update, delete]
    - group: ceph.rook.io
      version: v1
      resource: cephclusters
      verbs: [get]
# NOTE: cluster-admin-equivalent RBAC
# The Rook operator install requires broad cluster permissions — see the
# wildcard rule under spec.permissions.rbac above. The plugin-controller
# materialises that into a ClusterRole bound to this plugin's ServiceAccount
# (intersected with the installing admin's permissions, FUN-17). The
# PluginInstallation CR needs no extra RBAC fields; the current CRD has no
# spec.clusterRoles.
