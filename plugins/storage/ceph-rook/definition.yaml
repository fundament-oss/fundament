apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: ceph-rook
  displayName: Ceph Storage (Rook)
  version: v0.1.0
  description: Block storage for in-cluster workloads, backed by Ceph and Rook.
  author: Fundament
  license: Apache-2.0
  icon: server-stack
  urls:
    homepage: https://rook.io
    repository: https://github.com/rook/rook
    documentation: https://rook.io/docs
  tags:
    - storage
    - block
    - ceph
spec:
  permissions:
    capabilities:
      - internet_access
    rbac:
      # --- Fundament storage resources this plugin reconciles ---
      - apiGroups:
          - storage.fundament.io
        resources:
          - disks
          - disks/status
          - storagepools
          - storagepools/status
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- Rook/Ceph CRDs this plugin manages ---
      - apiGroups:
          - ceph.rook.io
        resources:
          - cephclusters
          - cephblockpools
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- StorageClasses: the StoragePool controller manages these via
      # CreateOrUpdate (needs create+update) and watches them through the
      # controller's Owns(&StorageClass{}) informer (needs list+watch).
      # No delete (cascade is done by the k8s garbage collector). ---
      - apiGroups:
          - storage.k8s.io
        resources:
          - storageclasses
        verbs:
          - get
          - list
          - watch
          - create
          - update
      # --- Node and ConfigMap inspection for disk discovery ---
      - apiGroups:
          - ""
        resources:
          - nodes
          - configmaps
        verbs:
          - get
          - list
          - watch
      # --- CRD management: apply own storage.fundament.io CRDs at install time ---
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
  menu:
    organization:
      - crd: storagepools.storage.fundament.io
        list: true
        detail: true
        icon: circle-stack
      - crd: disks.storage.fundament.io
        list: true
        icon: server-stack
  crds:
    - disks.storage.fundament.io
    - storagepools.storage.fundament.io
  customComponents:
    StoragePool:
      list: storagepools-list.html
      detail: storagepools-detail.html
    Disk:
      list: disks-list.html
  uiHints:
    storagepools.storage.fundament.io:
      statusMapping:
        jsonPath: ".status.phase"
        values:
          Ready:
            badge: success
            label: Ready
          Provisioning:
            badge: warning
            label: Provisioning
          Degraded:
            badge: danger
            label: Degraded
  allowedResources:
    - group: storage.fundament.io
      version: v1alpha1
      resource: disks
      verbs: [list, get]
    - group: storage.fundament.io
      version: v1alpha1
      resource: storagepools
      verbs: [list, get, create, update, delete]
    - group: ceph.rook.io
      version: v1
      resource: cephclusters
      verbs: [get]
# NOTE: PluginInstallation requirement
# The Rook operator requires cluster-admin level permissions to manage
# storage resources across the entire cluster (nodes, PersistentVolumes,
# StorageClasses, etc.). The PluginInstallation CR MUST set:
#
#   spec.clusterRoles:
#     - cluster-admin
#
# The spec.permissions.rbac rules above cover only what this plugin binary
# itself needs; the broad Rook operator RBAC is satisfied by cluster-admin.
