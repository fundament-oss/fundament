apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: ceph-rook
  displayName: Ceph Storage (Rook)
  version: v0.3.0
  description: Block, shared file and S3-compatible object storage for in-cluster workloads, backed by Ceph and Rook.
  author: Fundament
  license: Apache-2.0
  icon: external-hard-drives
  urls:
    homepage: https://rook.io
    repository: https://github.com/rook/rook
    documentation: https://rook.io/docs
  tags:
    - storage
    - block
    - file
    - object
    - s3
    - ceph
spec:
  permissions:
    capabilities:
      - internet_access
    rbac:
      # --- Fundament storage resources this plugin reconciles ---
      # The finalizers subresources are needed because the plugin sets owner
      # references with blockOwnerDeletion=true, and the API server requires
      # update rights on the owner's finalizers before accepting those.
      - apiGroups:
          - ceph.fundament.io
        resources:
          - disks
          - disks/status
          - diskpools
          - diskpools/status
          - diskpools/finalizers
          - blockstorages
          - blockstorages/status
          - blockstorages/finalizers
          - filestorages
          - filestorages/status
          - filestorages/finalizers
          - objectstorages
          - objectstorages/status
          - objectstorages/finalizers
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- Rook/Ceph CRDs this plugin manages ---
      - apiGroups:
          - ceph.rook.io
        resources:
          - cephclusters
          - cephblockpools
          - cephfilesystems
          - cephobjectstores
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- StorageClasses: created/updated by the BlockStorage/FileStorage
      # controllers and watched as owned objects. No delete verb: removal
      # happens through owner references and the garbage collector. ---
      - apiGroups:
          - storage.k8s.io
        resources:
          - storageclasses
        verbs:
          - get
          - list
          - watch
          - create
          - update
      # --- ConfigMap inspection for disk discovery ---
      # Rook's discover daemon writes one local-device-<node> ConfigMap per node.
      # No nodes rule: the node name comes off that ConfigMap, so the plugin never
      # reads the Node API.
      - apiGroups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
      # --- CRD management: apply own ceph.fundament.io CRDs at install time ---
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
      # --- Rook operator install (cluster-admin-equivalent) ---
      # The plugin helm-installs the Rook operator, which creates privileged
      # host-networked DaemonSets, the Ceph CSI driver, and its own cluster-wide
      # RBAC with escalate+bind. No narrower stable rule set exists, and there
      # is no cluster-admin escalation field to request instead.
      #
      # This rule makes the plugin cluster-admin on the tenant cluster:
      # plugin-controller copies these rules verbatim into a ClusterRole bound
      # to the plugin's ServiceAccount (mutatePluginScopeClusterRole). FUN-17's
      # SubjectAccessReview applies to kube-api-proxy's console path; the plugin
      # pod calls the API server directly with its in-cluster config. The rules
      # above list the plugin binary's own API usage.
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["*"]
  menu:
    project:
      - crd: diskpools.ceph.fundament.io
        list: true
        detail: true
        icon: file-box
      - crd: blockstorages.ceph.fundament.io
        list: true
        detail: true
        icon: rectangle-stack
      - crd: filestorages.ceph.fundament.io
        list: true
        detail: true
        icon: folder-open
      - crd: objectstorages.ceph.fundament.io
        list: true
        detail: true
        icon: boxes-3
      - crd: disks.ceph.fundament.io
        list: true
        detail: true
        icon: ssd-hard-drive
  crds:
    - disks.ceph.fundament.io
    - diskpools.ceph.fundament.io
    - blockstorages.ceph.fundament.io
    - filestorages.ceph.fundament.io
    - objectstorages.ceph.fundament.io
  customComponents:
    DiskPool:
      list: diskpools-list.html
      detail: diskpools-detail.html
    Disk:
      list: disks-list.html
      detail: disks-detail.html
    BlockStorage:
      list: blockstorages-list.html
      detail: blockstorages-detail.html
    FileStorage:
      list: filestorages-list.html
      detail: filestorages-detail.html
    ObjectStorage:
      list: objectstorages-list.html
      detail: objectstorages-detail.html
  uiHints:
    diskpools.ceph.fundament.io:
      statusMapping:
        jsonPath: ".status.phase"
        values:
          Ready:
            badge: success
            label: Ready
          Degraded:
            badge: danger
            label: Degraded
    # The consumer kinds share one status vocabulary, so they alias one badge
    # table; definition_test.go proves the alias resolves into every kind.
    blockstorages.ceph.fundament.io:
      statusMapping: &consumer-status-mapping
        jsonPath: ".status.phase"
        values:
          Ready:
            badge: success
            label: Ready
          Provisioning:
            badge: warning
            label: Provisioning
          Degraded:
            badge: danger
            label: Degraded
    filestorages.ceph.fundament.io:
      statusMapping: *consumer-status-mapping
    objectstorages.ceph.fundament.io:
      statusMapping: *consumer-status-mapping
  # Exactly the verbs the console pages issue, no more. Nothing enforces this
  # list at request time yet, so it is a declaration of intent.
  #
  # No delete verb: the console offers no delete, because a guard for it would
  # have to be server-side to mean anything. No update verb: the edit forms
  # merge-patch instead.
  allowedResources:
    - group: ceph.fundament.io
      version: v1alpha1
      resource: disks
      verbs: [list, get]
    - group: ceph.fundament.io
      version: v1alpha1
      resource: diskpools
      verbs: [list, get, create, patch]
    - group: ceph.fundament.io
      version: v1alpha1
      resource: blockstorages
      verbs: [list, get, create, patch]
    - group: ceph.fundament.io
      version: v1alpha1
      resource: filestorages
      verbs: [list, get, create, patch]
    - group: ceph.fundament.io
      version: v1alpha1
      resource: objectstorages
      verbs: [list, get, create, patch]
    # The Buckets section on the ObjectStorage detail page. Claims list
    # cluster-wide (they live wherever workloads do). No delete, same stance
    # as the kinds above; no secrets: the claim's Secret name is derivable
    # and its values must never reach the iframe, so only the ConfigMap's
    # connection info is readable.
    - group: objectbucket.io
      version: v1alpha1
      resource: objectbucketclaims
      verbs: [list, get, create]
    # Cluster-scoped bucket inventory, for the create form's collision check.
    - group: objectbucket.io
      version: v1alpha1
      resource: objectbuckets
      verbs: [list]
    - group: ""
      version: v1
      resource: configmaps
      verbs: [get]
    - group: ceph.rook.io
      version: v1
      resource: cephclusters
      verbs: [get]
  configSchema:
    - name: MON_COUNT
      displayName: Monitor count
      type: int
      default: "3"
      description: Ceph monitors to run. A single-node cluster needs 1 (with ALLOW_MULTIPLE_PER_NODE), or mons never reach quorum.
    - name: MGR_COUNT
      displayName: Manager count
      type: int
      default: "2"
      description: Ceph managers to run. Use 1 on a single-node cluster.
    - name: ALLOW_MULTIPLE_PER_NODE
      displayName: Allow multiple daemons per node
      type: bool
      default: "false"
      description: Allow multiple mons/mgrs on one node. Required on a single-node cluster.
    - name: DEV_LOOP_DEVICES
      displayName: Loop devices only (development)
      type: bool
      default: "false"
      advanced: true
      description: "Local development only: discover ONLY /dev/loopNpN partitions and ignore the host's real disks. A safety control, not a convenience."
    - name: ALLOW_UNSUPPORTED_CEPH
      displayName: Allow unsupported Ceph releases
      type: bool
      default: "false"
      advanced: true
      description: Waive Rook's supported-release check. Only for a Ceph release outside Rook's support table (the default image does not need it).
    - name: CEPH_IMAGE
      displayName: Ceph image
      type: string
      default: "quay.io/ceph/ceph:v19.2.3"
      advanced: true
      description: Ceph container image. v19+ is required on arm64 (v18 segfaults on Apple Silicon).
    - name: ROOK_NAMESPACE
      displayName: Rook operator namespace
      type: string
      default: "rook-ceph"
      advanced: true
      description: Namespace the Rook operator runs in. Part of the CSI driver name; do not change on a cluster with existing storage.
    - name: CLUSTER_NAMESPACE
      displayName: Ceph cluster namespace
      type: string
      default: "rook-ceph"
      advanced: true
      description: Namespace for the CephCluster and its CSI secrets; the CSI clusterID.
    - name: CEPHFS_MOUNTER
      displayName: CephFS mount client
      type: enum
      # "" mirrors config.go's accept-set: an explicitly empty value means the
      # CSI default, same as omitting the key.
      values: ["", "kernel", "fuse"]
      advanced: true
      description: "How the CephFS CSI driver mounts volumes. Unset uses the CSI default (kernel client). Use fuse on nodes without the ceph kernel module (local Docker VMs). RBD is unaffected."
