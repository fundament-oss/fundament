apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: ceph-rook
  displayName: Ceph Storage (Rook)
  version: v0.2.0
  description: Block storage for in-cluster workloads, backed by Ceph and Rook.
  author: Fundament
  license: Apache-2.0
  icon: server-stack
  urls:
    homepage: https://rook.io
    repository: https://github.com/rook/rook
    documentation: https://rook.io/docs
  tags:
    - storage
    - block
    - ceph
spec:
  permissions:
    capabilities:
      - internet_access
    rbac:
      # --- Fundament storage resources this plugin reconciles ---
      # storagepools/finalizers: the API server requires update on the owner's
      # finalizers before accepting an owner ref with blockOwnerDeletion=true.
      - apiGroups:
          - storage.fundament.io
        resources:
          - disks
          - disks/status
          - storagepools
          - storagepools/status
          - storagepools/finalizers
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- Rook/Ceph CRDs this plugin manages ---
      - apiGroups:
          - ceph.rook.io
        resources:
          - cephclusters
          - cephblockpools
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- StorageClasses: created/updated by the StoragePool controller and
      # watched via Owns(). No delete; cascade is the k8s garbage collector. ---
      - apiGroups:
          - storage.k8s.io
        resources:
          - storageclasses
        verbs:
          - get
          - list
          - watch
          - create
          - update
      # --- ConfigMap inspection for disk discovery ---
      # Rook's discover daemon writes one local-device-<node> ConfigMap per node.
      # No nodes rule: the node name comes off that ConfigMap, so the plugin never
      # reads the Node API.
      - apiGroups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
      # --- CRD management: apply own storage.fundament.io CRDs at install time ---
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
      # --- Rook operator install (cluster-admin-equivalent) ---
      # This SA helm-installs the Rook operator, which creates privileged
      # host-networked DaemonSets, the Ceph CSI driver, and its own cluster-wide
      # RBAC with escalate+bind. No narrower stable rule set exists, and there is
      # no cluster-admin escalation field.
      #
      # Read this rule literally: it makes the plugin cluster-admin on the tenant
      # cluster. Nothing narrows it. plugin-controller copies these rules verbatim
      # into a ClusterRole bound to the plugin SA (mutatePluginScopeClusterRole),
      # and FUN-17's SubjectAccessReview is a per-request check in kube-api-proxy
      # on the console iframe path — the plugin pod uses its in-cluster config and
      # never goes through it. The specific rules above document the plugin
      # binary's own direct API usage; they grant nothing this rule does not.
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["*"]
  menu:
    project:
      - crd: storagepools.storage.fundament.io
        list: true
        detail: true
        icon: circle-stack
      - crd: disks.storage.fundament.io
        list: true
        detail: true
        icon: server-stack
  crds:
    - disks.storage.fundament.io
    - storagepools.storage.fundament.io
  customComponents:
    StoragePool:
      list: storagepools-list.html
      detail: storagepools-detail.html
      create: storagepools-create.html
    Disk:
      list: disks-list.html
      detail: disks-detail.html
  uiHints:
    storagepools.storage.fundament.io:
      statusMapping:
        jsonPath: ".status.phase"
        values:
          Ready:
            badge: success
            label: Ready
          Provisioning:
            badge: warning
            label: Provisioning
          Degraded:
            badge: danger
            label: Degraded
  # Exactly the verbs the console pages issue, no more: nothing enforces this
  # list at request time yet, so it is a declaration of intent, and a declaration
  # that overstates is worse than none.
  #
  # No delete: the console offers no delete, because the guard for it would have
  # to be server-side to mean anything. No update: the edit form merge-patches.
  allowedResources:
    - group: storage.fundament.io
      version: v1alpha1
      resource: disks
      verbs: [list, get]
    - group: storage.fundament.io
      version: v1alpha1
      resource: storagepools
      verbs: [list, get, create, patch]
    - group: ceph.rook.io
      version: v1
      resource: cephclusters
      verbs: [get]
  configSchema:
    - name: MON_COUNT
      displayName: Monitor count
      type: int
      default: "3"
      description: Ceph monitors to run. A single-node cluster needs 1 (with ALLOW_MULTIPLE_PER_NODE), or mons never reach quorum.
    - name: MGR_COUNT
      displayName: Manager count
      type: int
      default: "2"
      description: Ceph managers to run. Use 1 on a single-node cluster.
    - name: ALLOW_MULTIPLE_PER_NODE
      displayName: Allow multiple daemons per node
      type: bool
      default: "false"
      description: Allow multiple mons/mgrs on one node. Required on a single-node cluster.
    - name: DEV_LOOP_DEVICES
      displayName: Loop devices only (development)
      type: bool
      default: "false"
      advanced: true
      description: "Local development only: discover ONLY /dev/loopNpN partitions and ignore the host's real disks. A safety control, not a convenience."
    - name: ALLOW_UNSUPPORTED_CEPH
      displayName: Allow unsupported Ceph releases
      type: bool
      default: "false"
      advanced: true
      description: Waive Rook's supported-release check. Only for a Ceph release outside Rook's support table (the default image does not need it).
    - name: CEPH_IMAGE
      displayName: Ceph image
      type: string
      default: "quay.io/ceph/ceph:v19.2.3"
      advanced: true
      description: Ceph container image. v19+ is required on arm64 (v18 segfaults on Apple Silicon).
    - name: ROOK_NAMESPACE
      displayName: Rook operator namespace
      type: string
      default: "rook-ceph"
      advanced: true
      description: Namespace the Rook operator runs in. Part of the CSI driver name; do not change on a cluster with existing storage.
    - name: CLUSTER_NAMESPACE
      displayName: Ceph cluster namespace
      type: string
      default: "rook-ceph"
      advanced: true
      description: Namespace for the CephCluster and its CSI secrets; the CSI clusterID.
