apiVersion: v1
kind: ServiceAccount
metadata:
  name: gardener-extension-tenant-metrics
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gardener-extension-tenant-metrics
rules:
  - apiGroups: ["extensions.gardener.cloud"]
    resources: ["extensions"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["extensions.gardener.cloud"]
    resources: ["extensions/status"]
    verbs: ["get", "patch", "update"]
  # Owner references with blockOwnerDeletion need this where the
  # OwnerReferencesPermissionEnforcement admission plugin is on.
  - apiGroups: ["extensions.gardener.cloud"]
    resources: ["extensions/finalizers"]
    verbs: ["update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["scrapeconfigs"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gardener-extension-tenant-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gardener-extension-tenant-metrics
subjects:
  - kind: ServiceAccount
    name: gardener-extension-tenant-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gardener-extension-tenant-metrics
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gardener-extension-tenant-metrics
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gardener-extension-tenant-metrics
subjects:
  - kind: ServiceAccount
    name: gardener-extension-tenant-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gardener-extension-tenant-metrics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gardener-extension-tenant-metrics
  template:
    metadata:
      labels:
        app: gardener-extension-tenant-metrics
        networking.gardener.cloud/to-runtime-apiserver: allowed
        networking.gardener.cloud/to-dns: allowed
    spec:
      serviceAccountName: gardener-extension-tenant-metrics
      containers:
        - name: controller
          image: {{ required "image is required" .Values.image | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
