apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: demo
  displayName: "Demo"
  version: v0.1.0
  description: "A demo plugin."
  author: "Demo Author"
  license: "MIT"
  icon: puzzle-piece
  urls:
    homepage: https://example.com
    repository: https://example.com/demo-plugin
    documentation: https://example.com/docs
  tags:
    - example
# There is deliberately no spec.image here. Publishing builds the image, resolves
# the pushed manifest digest and injects it, so the stored definition always pins
# immutable code. Never add a mutable tag by hand: it will be rejected.
spec:
  permissions:
    capabilities:
      # The plugin pulls its chart from a public Helm repository at install time.
      - internet_access
    rbac:
      # --- Runtime resources the plugin reconciles / surfaces in the UI ---
      # TODO: replace with the API groups your chart's CRDs actually use.
      - apiGroups:
          - example.com
        resources:
          - widgets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      # --- Install-time permissions ---
      # The plugin runs `helm upgrade --install ... --create-namespace --wait`
      # with Helm's default "secret" storage driver. These three rules are what
      # Helm itself cannot do without, whatever the chart contains. Rules are
      # cluster-wide (PolicyRule carries no namespace).
      - apiGroups:
          - ""
        resources:
          - namespaces # helm --create-namespace
        verbs:
          - get
          - list
          - create
      - apiGroups:
          - ""
        resources:
          - secrets # Helm release storage
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      - apiGroups:
          - ""
        resources:
          - pods # helm --wait readiness polling
        verbs:
          - get
          - list
          - watch
      # --- What your chart creates ---
      # TODO: Helm can only create what this ClusterRole allows, so add a rule
      # per kind of object in your chart -- and only those. The blocks below are
      # the common ones, commented out on purpose: uncomment what your chart
      # really uses rather than starting from a role that can do everything.
      #
      # - apiGroups:
      #     - ""
      #   resources:
      #     - serviceaccounts
      #     - services
      #     - configmaps
      #   verbs: [get, list, watch, create, update, patch, delete]
      # - apiGroups:
      #     - apps
      #   resources:
      #     - deployments
      #   verbs: [get, list, watch, create, update, patch, delete]
      # - apiGroups:
      #     - apps
      #   resources:
      #     - replicasets # helm --wait polls the Deployment rollout via ReplicaSets
      #   verbs: [get, list, watch]
      # - apiGroups:
      #     - apiextensions.k8s.io
      #   resources:
      #     - customresourcedefinitions
      #   verbs: [get, list, watch, create, update, patch, delete]
      # - apiGroups:
      #     - rbac.authorization.k8s.io
      #   resources:
      #     - clusterroles
      #     - roles
      #   # bind: create (Cluster)RoleBindings that reference these.
      #   # escalate: write the chart's rules without holding every one of them.
      #   verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
      # - apiGroups:
      #     - rbac.authorization.k8s.io
      #   resources:
      #     - clusterrolebindings
      #     - rolebindings
      #   verbs: [get, list, watch, create, update, patch, delete]
