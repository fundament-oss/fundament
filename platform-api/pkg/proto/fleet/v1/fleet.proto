edition = "2023";

package fleet.v1;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";

option features.(pb.go).api_level = API_OPAQUE;
option features.field_presence = IMPLICIT;
option go_package = "github.com/fundament-oss/fundament/platform-api/pkg/proto/gen/fleet/v1;fleetv1";

// FleetService is the staff view of every organization's clusters (FUN-23).
// It accepts only the DCIM staff token and runs on the admin host. It reads the
// database and nothing else: node, pod and namespace numbers come from the
// snapshots cluster-worker stores, and drift from the Gardener inventory it
// records. Deleted organizations, clusters, node pools, projects and
// namespaces are left out everywhere except in drift findings.
service FleetService {
  // Platform-wide totals for the overview tiles.
  rpc GetFleetSummary(GetFleetSummaryRequest) returns (GetFleetSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Every live organization with its aggregates.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One live organization with its aggregates.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Live clusters, optionally of one organization and narrowed by a filter.
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One live cluster with its node pools, projects and namespaces.
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Disagreements between the database, the snapshots and Gardener.
  rpc ListDriftFindings(ListDriftFindingsRequest) returns (ListDriftFindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ClusterStatus follows the console's reading of tenant.clusters.shoot_status.
enum ClusterStatus {
  CLUSTER_STATUS_UNSPECIFIED = 0;
  CLUSTER_STATUS_PROVISIONING = 10;
  CLUSTER_STATUS_RUNNING = 20;
  // Running while an update fundament pushed rolls out.
  CLUSTER_STATUS_UPDATING = 30;
  CLUSTER_STATUS_ERROR = 40;
  CLUSTER_STATUS_DELETING = 50;
  CLUSTER_STATUS_STOPPED = 60;
}

// ClusterHealth is Gardener's health verdict, known only for ready clusters.
enum ClusterHealth {
  CLUSTER_HEALTH_UNSPECIFIED = 0;
  CLUSTER_HEALTH_HEALTHY = 10;
  CLUSTER_HEALTH_UNHEALTHY = 20;
}

enum ClusterFilter {
  CLUSTER_FILTER_UNSPECIFIED = 0;
  CLUSTER_FILTER_ALL = 10;
  // Unhealthy, or in error.
  CLUSTER_FILTER_UNHEALTHY = 20;
  // Ready, with no snapshot or one older than stale_after.
  CLUSTER_FILTER_STALE = 30;
}

enum DriftKind {
  DRIFT_KIND_UNSPECIFIED = 0;
  // Gardener has a shoot whose cluster id matches no cluster at all.
  DRIFT_KIND_SHOOT_WITHOUT_CLUSTER = 10;
  // Gardener still has the shoot of a deleted cluster. Usually short-lived:
  // the reconcile loop deletes orphaned shoots.
  DRIFT_KIND_SHOOT_OF_DELETED_CLUSTER = 20;
  // A synced cluster has no shoot. Only reported while the Gardener inventory
  // is fresh, so a stopped worker does not make every cluster look missing.
  DRIFT_KIND_CLUSTER_WITHOUT_SHOOT = 30;
  // A ready cluster has no snapshot, or one older than stale_after.
  DRIFT_KIND_SNAPSHOT_STALE = 40;
  // The database and the shoot disagree on the Kubernetes version while the
  // cluster is not updating.
  DRIFT_KIND_KUBERNETES_VERSION_MISMATCH = 50;
}

message FleetSummary {
  int32 organizations = 10;
  int32 clusters = 20;
  int32 clusters_unhealthy = 30;
  int32 clusters_updating = 40;
  int32 nodes = 50;
  int32 nodes_ready = 60;
  int32 pods = 70;
  int32 pod_allocatable = 80;
  int64 cpu_allocatable_m = 90;
  int64 memory_allocatable_mi = 100;
  int32 drift_findings = 110;
  int32 stale_snapshots = 120;
  // The last time cluster-worker saw a shoot in Gardener; absent when it has
  // recorded none.
  google.protobuf.Timestamp gardener_inventory_refreshed = 130 [features.field_presence = EXPLICIT];
  // How old a snapshot may get before it counts as stale.
  int32 stale_after_seconds = 140;
}

message OrganizationSummary {
  string id = 10;
  string name = 20;
  string alias = 30;
  google.protobuf.Timestamp created = 40;
  int32 clusters = 60;
  int32 clusters_unhealthy = 70;
  int32 nodes = 80;
  int32 nodes_ready = 90;
  int32 pods = 100;
  int32 namespaces = 110;
}

// ClusterSnapshot is the latest observation cluster-worker stored. observed is
// absent when every collection so far has failed.
message ClusterSnapshot {
  google.protobuf.Timestamp observed = 10 [features.field_presence = EXPLICIT];
  int32 nodes = 20;
  int32 nodes_ready = 30;
  int32 pods = 40;
  int32 pod_allocatable = 50;
  int64 cpu_allocatable_m = 60;
  int64 memory_allocatable_mi = 70;
  // The last collection error; cleared by the next successful collection.
  string last_error = 80 [features.field_presence = EXPLICIT];
  google.protobuf.Timestamp last_error_at = 90 [features.field_presence = EXPLICIT];
}

message ClusterSummary {
  string id = 10;
  string organization_id = 20;
  string organization_name = 30;
  string name = 40;
  string region = 50;
  string kubernetes_version = 60;
  ClusterStatus status = 70;
  ClusterHealth health = 80;
  string status_message = 90;
  google.protobuf.Timestamp created = 100;
  int32 node_pools = 110;
  // Sums of the live node pools' autoscaler bounds.
  int32 nodes_min = 120;
  int32 nodes_max = 130;
  // Absent until cluster-worker first tried to collect this cluster.
  ClusterSnapshot snapshot = 140;
  // Ready with no snapshot, or one older than stale_after.
  bool stale = 150;
}

message NodePool {
  string id = 10;
  string name = 20;
  string machine_type = 30;
  int32 autoscale_min = 40;
  int32 autoscale_max = 50;
  int32 nodes = 60;
  int32 nodes_ready = 70;
  google.protobuf.Timestamp observed = 80 [features.field_presence = EXPLICIT];
}

message Namespace {
  string id = 10;
  string name = 20;
  int32 pods = 30;
  google.protobuf.Timestamp observed = 40 [features.field_presence = EXPLICIT];
}

message Project {
  string id = 10;
  string name = 20;
  string alias = 30;
  repeated Namespace namespaces = 40;
}

// GardenerShoot is what cluster-worker last saw of the cluster's shoot.
message GardenerShoot {
  string name = 10;
  string namespace = 20;
  string kubernetes_version = 30;
  string region = 40;
  google.protobuf.Timestamp created = 50;
  google.protobuf.Timestamp last_seen = 60;
}

message DriftFinding {
  DriftKind kind = 10;
  // Absent when the cluster id matches no cluster.
  string organization_id = 20 [features.field_presence = EXPLICIT];
  string organization_name = 30 [features.field_presence = EXPLICIT];
  string cluster_id = 40;
  string cluster_name = 50 [features.field_presence = EXPLICIT];
  string shoot_name = 60 [features.field_presence = EXPLICIT];
  string shoot_namespace = 70 [features.field_presence = EXPLICIT];
  // When the disagreement started, as far as the database can tell.
  google.protobuf.Timestamp since = 80 [features.field_presence = EXPLICIT];
  string detail = 90;
}

message GetFleetSummaryRequest {}

message GetFleetSummaryResponse {
  FleetSummary summary = 10;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated OrganizationSummary organizations = 10;
}

message GetOrganizationRequest {
  string organization_id = 10 [(buf.validate.field).string.uuid = true];
}

message GetOrganizationResponse {
  OrganizationSummary organization = 10;
}

message ListClustersRequest {
  string organization_id = 10 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string.uuid = true
  ];
  ClusterFilter filter = 20 [(buf.validate.field).enum.defined_only = true];
}

message ListClustersResponse {
  repeated ClusterSummary clusters = 10;
}

message GetClusterRequest {
  string cluster_id = 10 [(buf.validate.field).string.uuid = true];
}

message GetClusterResponse {
  ClusterSummary cluster = 10;
  // Absent when cluster-worker has not seen a shoot for this cluster.
  GardenerShoot shoot = 30;
  repeated NodePool node_pools = 40;
  repeated Project projects = 50;
}

message ListDriftFindingsRequest {}

message ListDriftFindingsResponse {
  repeated DriftFinding findings = 10;
}
