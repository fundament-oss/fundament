root = "/src"
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/platform-public-api ./platform-api/cmd/fun-platform-public-api"
entrypoint = "tmp/platform-public-api"
include_ext = ["go", "mod", "sum"]
include_dir = ["platform-api", "common"]
exclude_dir = ["tmp"]
delay = 500
# Services exit when the database schema is not yet migrated; this brings them back.
rerun = true
rerun_delay = 2000

[log]
time = false
