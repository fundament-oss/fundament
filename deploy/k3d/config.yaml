apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: fundament
servers: 1
agents: 0
# Fixed, pre-created network (see `just _ensure-k3d-network`): keeps k3d off
# 172.18.0.0/16, which Gardener's local kind cluster reserves.
network: k3d-fundament
# Every published port, the Kubernetes API and the registry included, is bound to loopback
# so the local stack, with its seeded logins and unauthenticated registry, is not exposed
# to other machines on the network. To reach one from a VM or second device, bind it to
# 0.0.0.0 instead; port bindings apply when the cluster is created.
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
ports:
  # HTTPS edge: the Envoy Gateway listener (deploy/k3d/gateway/), whose
  # LoadBalancer Service klipper-lb binds to port 443 on the node.
  - port: 127.0.0.1:8443:443
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:54328:54328
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=feature-gates=WatchList=true
        nodeFilters:
          - server:*
      # Audit logging for local log-analysis testing, not a production audit trail.
      - arg: --kube-apiserver-arg=audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-path=/var/log/k8s-audit/audit.log
        nodeFilters:
          - server:*
      # Kept small: a local cluster has no reason to hold audit history.
      # maxbackup 0 would mean "retain every rotation", so 1 is the floor.
      - arg: --kube-apiserver-arg=audit-log-maxsize=10
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-maxbackup=1
        nodeFilters:
          - server:*
registries:
  create:
    name: "registry.localhost"
    host: "127.0.0.1"
    hostPort: "5111"
  config: |
    mirrors:
      "localhost:5111":
        endpoint:
          - http://registry.localhost:5000
volumes:
  - volume: ${PWD}/deploy/k3d/audit-policy.yaml:/etc/rancher/k3s/audit-policy.yaml
  - volume: ${PWD}/deploy/k3d/resources/cloudnative-pg.yaml:/var/lib/rancher/k3s/server/manifests/cloudnative-pg.yaml
  - volume: ${PWD}/deploy/k3d/resources/cert-manager.yaml:/var/lib/rancher/k3s/server/manifests/cert-manager.yaml
  - volume: ${PWD}/deploy/k3d/resources/envoy-gateway.yaml:/var/lib/rancher/k3s/server/manifests/envoy-gateway.yaml
  - volume: ${PWD}/deploy/k3d/resources/reloader.yaml:/var/lib/rancher/k3s/server/manifests/reloader.yaml
  - volume: ${PWD}/charts/fundament/crds/plugininstallations.plugins.fundament.io.yaml:/var/lib/rancher/k3s/server/manifests/plugininstallations.plugins.fundament.io.yaml
