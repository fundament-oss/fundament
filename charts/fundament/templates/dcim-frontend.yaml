{{- if $.Values.dcimFrontend.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcim-frontend-config
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dcim-frontend" "component" "frontend") | nindent 4 }}
data:
  config.json: |
    {
      "apiUrl": "{{ $.Values.externalUrls.dcimApi }}",
      "authnApiUrl": "{{ $.Values.externalUrls.dcimAuthn }}",
      "platformApiUrl": "{{ $.Values.externalUrls.platformAdminApi }}",
      "pocUrl": "{{ include "fundament.pocUrl" (dict "root" $ "site" "dcim") }}",
      "cookieDomain": "{{ $.Values.externalUrls.cookieDomain }}"
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcim-frontend
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dcim-frontend" "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ $.Values.dcimFrontend.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "dcim-frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "dcim-frontend" "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: dcim-frontend
          image: {{ $.Values.images.dcimFrontend }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: CONNECT_SRC
              value: "{{ $.Values.externalUrls.dcimApi }} {{ $.Values.externalUrls.dcimAuthn }} {{ $.Values.externalUrls.platformAdminApi }}"
          ports:
            - name: http
              containerPort: 80
          # / is index.html under nginx and under the hot-reload dev server alike.
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http" "path" "/") | nindent 10 }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http" "path" "/") | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/assets/config
              readOnly: true
            - name: config
              mountPath: /app/public/assets/config
              readOnly: true
          {{- include "fundament.resources" (dict "resources" $.Values.dcimFrontend.resources "indent" 10) }}
      volumes:
        - name: config
          configMap:
            name: dcim-frontend-config

---
apiVersion: v1
kind: Service
metadata:
  name: dcim-frontend
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dcim-frontend" "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "dcim-frontend") | nindent 4 }}

{{- end }}
