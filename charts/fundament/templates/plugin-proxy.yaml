{{- if $.Values.pluginProxy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-proxy
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "plugin-proxy" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
    {{- if $.Values.pluginProxy.sandboxKubeconfigSecret }}
    # `auto` only tracks what a pod actually references, and the sandbox kubeconfig is
    # mounted optional: true — created out of band after this pod is already running, so
    # the pod never referenced it and a later create goes unnoticed. Name it explicitly.
    secret.reloader.stakater.com/reload: {{ $.Values.pluginProxy.sandboxKubeconfigSecret | quote }}
    {{- end }}
spec:
  replicas: {{ $.Values.pluginProxy.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "plugin-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "plugin-proxy" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: plugin-proxy
          image: {{ $.Values.images.pluginProxy }}
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: INTERNAL_LISTEN_ADDR
              value: ":8081"
            - name: PLUGIN_PROXY_MODE
              value: {{ $.Values.pluginProxy.mode | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.pluginProxy.logLevel }}
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            {{- if $.Values.externalUrls.pluginProxy }}
            - name: PLUGIN_PROXY_ORIGIN
              value: {{ $.Values.externalUrls.pluginProxy }}
            {{- end }}
            {{- if $.Values.externalUrls.kubeApiProxy }}
            - name: KUBE_API_PROXY_ORIGIN
              value: {{ $.Values.externalUrls.kubeApiProxy }}
            {{- end }}
            {{- if $.Values.externalUrls.console }}
            - name: CONSOLE_ORIGIN
              value: {{ $.Values.externalUrls.console }}
            {{- end }}
            {{- if $.Values.pluginProxy.gardenerKubeconfigSecret }}
            - name: GARDENER_KUBECONFIG
              value: /etc/gardener/kubeconfig
            {{- end }}
            {{- if $.Values.pluginProxy.sandboxKubeconfigSecret }}
            - name: PLUGIN_SANDBOX_KUBECONFIG
              value: /etc/plugin-sandbox/kubeconfig
            {{- end }}
            - name: OPENFGA_API_URL
              value: http://openfga:{{ $.Values.openfga.apiPort | default 8080 }}
            - name: OPENFGA_STORE_NAME
              value: {{ include "fundament.openfga.storeName" $ }}
          {{- if or $.Values.pluginProxy.gardenerKubeconfigSecret $.Values.pluginProxy.sandboxKubeconfigSecret }}
          volumeMounts:
            {{- if $.Values.pluginProxy.gardenerKubeconfigSecret }}
            - name: gardener-kubeconfig
              mountPath: /etc/gardener
              readOnly: true
            {{- end }}
            {{- if $.Values.pluginProxy.sandboxKubeconfigSecret }}
            - name: plugin-sandbox-kubeconfig
              mountPath: /etc/plugin-sandbox
              readOnly: true
            {{- end }}
          {{- end }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "internal") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "internal") | nindent 10 }}
      {{- if or $.Values.pluginProxy.gardenerKubeconfigSecret $.Values.pluginProxy.sandboxKubeconfigSecret }}
      volumes:
        {{- if $.Values.pluginProxy.gardenerKubeconfigSecret }}
        - name: gardener-kubeconfig
          secret:
            secretName: {{ $.Values.pluginProxy.gardenerKubeconfigSecret }}
        {{- end }}
        {{- if $.Values.pluginProxy.sandboxKubeconfigSecret }}
        - name: plugin-sandbox-kubeconfig
          secret:
            secretName: {{ $.Values.pluginProxy.sandboxKubeconfigSecret }}
            optional: true
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-proxy
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "plugin-proxy" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 8081
      targetPort: internal
      name: internal
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "plugin-proxy") | nindent 4 }}

{{- if $.Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plugin-proxy
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "plugin-proxy" "component" "backend") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "false"
    {{- if $.Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.clusterIssuer }}
  tls:
    - hosts:
        - plugin-proxy.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      secretName: plugin-proxy-tls
  {{- end }}
  rules:
    - host: plugin-proxy.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plugin-proxy
                port:
                  name: http
{{- end }}
{{- end }}
