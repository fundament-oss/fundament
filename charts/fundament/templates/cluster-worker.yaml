{{- if $.Values.clusterWorker.enabled }}
{{- /*
One image, two Deployments (WORKER_MODE). cluster-worker provisions: outbox,
status and reconcile. cluster-worker-inventory collects the staff fleet view's
snapshots (FUN-23), only where that view is deployed: collection mints an
admin kubeconfig per ready shoot every interval, for data nobody else reads.
It runs one replica, with no leader election, so every shoot is read once per
interval; Recreate keeps a rollout from running two.
*/}}
{{- $modes := list "provisioning" }}
{{- if $.Values.platformAdminApi.enabled }}
{{- $modes = append $modes "inventory" }}
{{- end }}
{{- range $mode := $modes }}
{{- $provisioning := eq $mode "provisioning" }}
{{- $name := ternary "cluster-worker" "cluster-worker-inventory" $provisioning }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" $name "component" "worker") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
    {{- if and $provisioning $.Values.clusterWorker.sandboxKubeconfigSecret }}
    # Mounted optional: true and created after the platform is up, so `auto`
    # never sees it referenced. Name it, so creating it restarts the pod.
    secret.reloader.stakater.com/reload: {{ $.Values.clusterWorker.sandboxKubeconfigSecret | quote }}
    {{- end }}
spec:
  {{- if $provisioning }}
  replicas: {{ $.Values.clusterWorker.replicas }}
  {{- else }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" $name "component" "worker") | nindent 8 }}
    spec:
      containers:
        - name: cluster-worker
          image: {{ $.Values.images.clusterWorker }}
          ports:
            - name: health
              containerPort: 8097
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-cluster-worker
                  key: uri
            - name: WORKER_MODE
              value: {{ $mode }}
            - name: GARDENER_MODE
              value: {{ $.Values.clusterWorker.gardenerMode }}
            - name: LOG_LEVEL
              value: {{ $.Values.clusterWorker.logLevel }}
            {{- if $provisioning }}
            {{- if $.Values.clusterWorker.sandboxKubeconfigSecret }}
            - name: GARDENER_SANDBOX_KUBECONFIG
              value: /etc/plugin-sandbox/kubeconfig
            {{- end }}
            - name: CLUSTER_MAX_RECONCILE_DELETIONS
              value: {{ $.Values.clusterWorker.maxReconcileDeletions | quote }}
            {{- else }}
            # Fleet inventory (FUN-23): node, pod and namespace counts per
            # ready shoot, read by the staff fleet view.
            - name: INVENTORY_INTERVAL
              value: {{ $.Values.clusterWorker.inventory.interval | quote }}
            - name: INVENTORY_WORKERS
              value: {{ $.Values.clusterWorker.inventory.workers | quote }}
            - name: INVENTORY_TIMEOUT
              value: {{ $.Values.clusterWorker.inventory.timeout | quote }}
            {{- end }}
            {{- if and $provisioning $.Values.pluginController.provisionShoots }}
            # Shoot-side plugin machinery (PluginInstallation CRD + plugin-controller),
            # provisioned onto every ready shoot by the pluginmachinery handler.
            # Off unless pluginController.provisionShoots: the image must be
            # pullable from shoot nodes, which local dev registries are not.
            - name: PLUGIN_CONTROLLER_IMAGE
              value: {{ $.Values.images.pluginController }}
            - name: PLUGIN_MARKETPLACE_CATALOG_API_URL
              value: {{ required "externalUrls.marketplaceCatalogApi must be set when pluginController.provisionShoots is set" $.Values.externalUrls.marketplaceCatalogApi }}
            # Where the shoot-side controller exchanges its projected ServiceAccount
            # token for a WorkloadToken (FUN-22).
            - name: PLUGIN_AUTHN_API_URL
              value: {{ required "externalUrls.authn must be set when pluginController.provisionShoots is set" $.Values.externalUrls.authn }}
            - name: PLUGIN_LOG_LEVEL
              value: {{ $.Values.pluginController.logLevel }}
            # Always rendered, so the manifest states the shoot fleet's
            # definition-hash posture instead of implying it by omission.
            # Local dev only; see pluginController.allowUnpinnedHash.
            - name: PLUGIN_ALLOW_UNPINNED_HASH
              value: {{ $.Values.pluginController.allowUnpinnedHash | default false | quote }}
            {{- end }}
            {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
            - name: GARDENER_KUBECONFIG
              value: /etc/gardener/kubeconfig
            - name: GARDENER_PROVIDER_TYPE
              value: {{ $.Values.clusterWorker.gardenerProviderType | default "local" }}
            - name: GARDENER_CLOUD_PROFILE
              value: {{ $.Values.clusterWorker.gardenerCloudProfile | default "local" }}
            {{- with $.Values.clusterWorker.gardenerRegion }}
            - name: GARDENER_REGION
              value: {{ . | quote }}
            {{- end }}
            - name: GARDENER_CREDENTIALS_BINDING_NAME
              value: {{ $.Values.clusterWorker.gardenerCredentialsBindingName | default "" }}
            {{- with $.Values.clusterWorker.gardenerCredentialsRef }}
            - name: GARDENER_CREDENTIALS_REF
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerCredentialsRefKind }}
            - name: GARDENER_CREDENTIALS_REF_KIND
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerCredentialsRefAPIVersion }}
            - name: GARDENER_CREDENTIALS_REF_API_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerMachineImageName }}
            - name: GARDENER_MACHINE_IMAGE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerMachineImageVersion }}
            - name: GARDENER_MACHINE_IMAGE_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerDefaultMachineType }}
            - name: GARDENER_DEFAULT_MACHINE_TYPE
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerNodesCIDR }}
            - name: GARDENER_NODES_CIDR
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerPodsCIDR }}
            - name: GARDENER_PODS_CIDR
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerServicesCIDR }}
            - name: GARDENER_SERVICES_CIDR
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerInfrastructureConfig }}
            - name: GARDENER_INFRASTRUCTURE_CONFIG
              value: {{ . | toJson | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerControlPlaneConfig }}
            - name: GARDENER_CONTROL_PLANE_CONFIG
              value: {{ . | toJson | quote }}
            {{- end }}
            {{- with $.Values.clusterWorker.gardenerShootAnnotations }}
            - name: GARDENER_SHOOT_ANNOTATIONS
              value: {{ . | toJson | quote }}
            {{- end }}
            - name: GARDENER_IMMEDIATE_CLUSTER_DELETION
              value: {{ $.Values.clusterWorker.gardenerImmediateClusterDeletion | default false | quote }}
            {{- end }}
          {{- $sandbox := and $provisioning $.Values.clusterWorker.sandboxKubeconfigSecret }}
          {{- if or $.Values.clusterWorker.gardenerKubeconfigSecret $sandbox }}
          volumeMounts:
            {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
            - name: gardener-kubeconfig
              mountPath: /etc/gardener
              readOnly: true
            {{- end }}
            {{- if $sandbox }}
            - name: plugin-sandbox-kubeconfig
              mountPath: /etc/plugin-sandbox
              readOnly: true
            {{- end }}
          {{- end }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "health") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "health") | nindent 10 }}
      {{- if or $.Values.clusterWorker.gardenerKubeconfigSecret $sandbox }}
      volumes:
        {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
        - name: gardener-kubeconfig
          secret:
            secretName: {{ $.Values.clusterWorker.gardenerKubeconfigSecret }}
        {{- end }}
        {{- if $sandbox }}
        - name: plugin-sandbox-kubeconfig
          secret:
            secretName: {{ $.Values.clusterWorker.sandboxKubeconfigSecret }}
            optional: true
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
