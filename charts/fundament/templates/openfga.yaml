{{- if $.Values.openfga.enabled }}

{{- if not $.Values.db.enabled }}
{{- fail "OpenFGA requires the database to be enabled. Set db.enabled=true or disable OpenFGA with openfga.enabled=false" }}
{{- end }}

{{- /* Generate or reuse a stable password for the OpenFGA database user */ -}}
{{- $openfgaSecretName := "db-fun-openfga" }}
{{- $openfgaExisting := lookup "v1" "Secret" $.Release.Namespace $openfgaSecretName }}
{{- $openfgaPassword := "" }}
{{- if $openfgaExisting }}
{{- $openfgaPassword = index $openfgaExisting.data "password" | b64dec }}
{{- else }}
{{- $openfgaPassword = randAlphaNum 32 }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $openfgaSecretName }}
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "openfga" "component" "backend") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: fun_openfga
  password: {{ $openfgaPassword | quote }}
  uri: postgresql://fun_openfga:{{ $openfgaPassword }}@{{ include "fundament.db.host" . }}:5432/openfga

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openfga-db
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "openfga" "component" "backend") | nindent 4 }}
spec:
  name: openfga
  owner: fun_openfga
  cluster:
    name: {{ include "fundament.db.name" . }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openfga-model
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "openfga" "component" "backend") | nindent 4 }}
data:
  model.fga: |
{{- .Files.Get "openfga/model.fga" | nindent 4 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "openfga" "component" "backend") | nindent 4 }}
    # Which store this release provisioned, so it is discoverable without
    # querying the API: kubectl -n <ns> get deploy openfga -L fundament.io/store
    fundament.io/store: {{ include "fundament.openfga.storeName" $ }}
spec:
  {{- if $.Values.db.reset }}
  # A resettable datastore has exactly one writer: the wipe decides whether to
  # run by reading a marker, so two pods starting together could both wipe.
  # Recreate keeps an old pod from serving while a new one drops the schema
  # under it.
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ $.Values.openfga.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "openfga") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "openfga" "component" "backend") | nindent 8 }}
    spec:
      # Named explicitly because this release deletes the ServiceAccount this pod
      # used to run as. Omitting the field instead leaves the deprecated
      # spec.serviceAccount set on the live object, which the API server keeps in
      # sync with serviceAccountName — so the pod template goes on naming a
      # ServiceAccount that no longer exists and the Deployment silently stops
      # being able to create pods, while Helm still reports the upgrade complete.
      serviceAccountName: default
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18
          command:
            - sh
            - -c
            - |
              echo "Waiting for OpenFGA database and role to be ready..."
              until psql "$OPENFGA_DATASTORE_URI" -c "SELECT 1" > /dev/null 2>&1; do
                echo "Database not ready, waiting..."
                sleep 3
              done
              echo "Database is ready!"
          env:
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $openfgaSecretName }}
                  key: uri
        {{- if $.Values.db.reset }}
        # Wipe before migrate: the server must never serve a schema it did not
        # create. The marker lives outside the public schema so it survives the
        # drop, which is what distinguishes a new release from a crash restart.
        # A restart that re-wipes takes the store out from under an outbox that
        # has already marked its rows synced, and nothing replays them.
        #
        # Runs as the datastore's own role: a schema recreated by postgres is
        # owned by postgres, and openfga then fails to migrate with SQLSTATE
        # 3F000, "no schema has been selected to create in".
        - name: wipe-datastore
          image: ghcr.io/cloudnative-pg/postgresql:18
          command:
            - sh
            - -c
            - |
              set -eu
              GEN="$OPENFGA_GENERATION"

              psql "$OPENFGA_DATASTORE_URI" -q <<'SQL'
              CREATE SCHEMA IF NOT EXISTS fundament_reset;
              CREATE TABLE IF NOT EXISTS fundament_reset.state (
                id boolean PRIMARY KEY DEFAULT true CHECK (id),
                generation text NOT NULL
              );
              SQL

              # An unreadable marker must abort, never fall through to a wipe: the
              # rows it would destroy are already marked synced in authz.outbox
              # and nothing replays them.
              LAST=$(psql "$OPENFGA_DATASTORE_URI" -tAc "SELECT generation FROM fundament_reset.state")
              if [ "$LAST" = "$GEN" ]; then
                echo "Not wiping: datastore generation '$LAST' already matches this release '$GEN'."
                exit 0
              fi

              echo "Wiping the OpenFGA datastore for generation '$GEN' (was '${LAST:-none}')..."
              # One transaction, so a kill between the drop and the marker cannot
              # leave a wiped datastore claiming the previous generation.
              psql "$OPENFGA_DATASTORE_URI" -v ON_ERROR_STOP=1 -v gen="$GEN" -1 <<'SQL'
              DROP SCHEMA public CASCADE;
              CREATE SCHEMA public;
              INSERT INTO fundament_reset.state (generation) VALUES (:'gen')
                ON CONFLICT (id) DO UPDATE SET generation = EXCLUDED.generation;
              SQL
          env:
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: OPENFGA_GENERATION
              value: {{ include "fundament.openfga.generation" $ | quote }}
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $openfgaSecretName }}
                  key: uri
        {{- end }}

        # Sole migrator, and it runs before the server starts: openfga is never
        # live on a schema its binary did not migrate.
        - name: migrate
          image: {{ $.Values.openfga.image }}
          args:
            - migrate
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $openfgaSecretName }}
                  key: uri
      containers:
        - name: openfga
          image: {{ $.Values.openfga.image }}
          args:
            - run
          ports:
            - name: http
              containerPort: {{ $.Values.openfga.apiPort }}
            - name: grpc
              containerPort: 8081
            {{- if $.Values.openfga.playground.enabled }}
            - name: playground
              containerPort: 3000
            {{- end }}
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $openfgaSecretName }}
                  key: uri
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: {{ $.Values.openfga.playground.enabled | quote }}
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:{{ $.Values.openfga.apiPort }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
        # Sole creator of the store. Publishes the generation the datastore now
        # belongs to, which is what authz-worker gates its drain on.
        #
        # A rolling update puts two generations behind the status Service. A
        # waiter accepts only its own release's generation, so only the new pod
        # can satisfy it.
        - name: provision
          image: {{ $.Values.images.openfgaSetup }}
          args: ["provision"]
          env:
            - name: OPENFGA_API_URL
              value: http://localhost:{{ $.Values.openfga.apiPort }}
            - name: OPENFGA_STORE_NAME
              value: {{ include "fundament.openfga.storeName" $ }}
            - name: OPENFGA_GENERATION
              value: {{ include "fundament.openfga.generation" $ | quote }}
            - name: OPENFGA_MODEL_PATH
              value: /model/model.fga
            - name: OPENFGA_STATUS_ADDR
              value: ":{{ $.Values.openfga.statusPort }}"
          ports:
            - name: status
              containerPort: {{ $.Values.openfga.statusPort }}
          volumeMounts:
            - name: model
              mountPath: /model
      volumes:
        - name: model
          configMap:
            name: openfga-model

---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "openfga" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.openfga.apiPort }}
      targetPort: http
      name: http
    - port: 8081
      targetPort: grpc
      name: grpc
    - port: {{ $.Values.openfga.statusPort }}
      targetPort: status
      name: status
    {{- if $.Values.openfga.playground.enabled }}
    - port: 3000
      targetPort: playground
      name: playground
    {{- end }}
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "openfga") | nindent 4 }}

{{- end }}
