{{- if $.Values.dcimApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcim-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dcim-api" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $.Values.dcimApi.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "dcim-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "dcim-api" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: dcim-api
          image: {{ $.Values.images.dcimApi }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-dcim-api
                  key: uri
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            - name: LOG_LEVEL
              value: {{ .Values.dcimApi.logLevel }}
            {{- if $.Values.externalUrls.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ $.Values.externalUrls.corsAllowedOrigins }}
            {{- end }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http") | nindent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: dcim-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dcim-api" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
      {{- with $.Values.grpcAppProtocol }}
      appProtocol: {{ . }}
      {{- end }}
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "dcim-api") | nindent 4 }}

{{- end }}
