{{- if $.Values.db.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Per-release name: a Job's pod template is immutable.
  name: {{ include "fundament.dbMigrationsJobName" $ }}
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # TCP only: the server is listening, not that the database or
              # role exists. trek and the reset below check those.
              host={{ include "fundament.db.host" . }}
              echo "waiting for tcp ${host}:5432 to accept connections"
              i=0
              until nc -z -w 5 "$host" 5432; do
                i=$((i + 1))
                [ $((i % 15)) -eq 0 ] && echo "still waiting for tcp ${host}:5432 after $((i * 2))s"
                sleep 2
              done
              echo "tcp ${host}:5432 is accepting connections"
      containers:
        - name: migrations
          image: {{ $.Values.images.dbMigrations }}
          # Run the schema migrations, then seed the appstore plugin catalog
          # (reference data) in EVERY environment, independently of
          # TREK_INSERT_TEST_DATA. The seed is a set of idempotent upserts, so it
          # runs unconditionally on every Job: a fresh DB gets the catalog and an
          # existing one is reconciled to the file. It runs in one transaction
          # with ON_ERROR_STOP, and any psql failure aborts the Job (set -e)
          # instead of being swallowed. The trek image is Alpine-based and ships
          # psql.
          command:
            - sh
            - -c
            - |
              set -e
{{- if and (include "fundament.development.reset" $) $.Values.openfga.enabled }}
              # Tuples derive from authz.outbox, so both reset together and the tuples
              # go first: a drain in between marks rows synced whose tuples then vanish.
              # Truncating keeps the store id, so consumers never observe the reset.
              # Same container as the reseed, so a failure cannot leave one without the other.
              echo "waiting until database openfga accepts connections as fun_openfga"
              i=0
              until psql "$OPENFGA_DATASTORE_URI" -c "SELECT 1" > /dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge 150 ]; then
                  echo "database openfga did not accept connections within 300s" >&2
                  exit 1
                fi
                [ $((i % 15)) -eq 0 ] && echo "still waiting for database openfga after $((i * 2))s"
                sleep 2
              done
              echo "database openfga accepts connections"
              # Absent until openfga migrates, which runs unordered against this Job.
              if psql "$OPENFGA_DATASTORE_URI" -tAc "SELECT to_regclass('public.tuple')" | grep -q tuple; then
                psql "$OPENFGA_DATASTORE_URI" -v ON_ERROR_STOP=1 -c "TRUNCATE tuple, changelog"
                echo "OpenFGA tuples cleared."
              else
                echo "No OpenFGA schema yet, nothing to clear."
              fi
{{- end }}
              trek apply
              echo "Seeding system organization..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0100-system-org.sql
              echo "Seeding appstore plugin catalog..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0101-appstore-catalog.sql
          env:
            - name: TREK_POSTGRES_HOST
              value: {{ include "fundament.db.host" . }}
            - name: TREK_POSTGRES_PORT
              value: "5432"
            - name: TREK_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: TREK_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: TREK_POSTGRES_DATABASE
              value: fundament
            - name: TREK_POSTGRES_SSLMODE
              value: disable
            - name: TREK_RESET_DATABASE
              value: {{ if include "fundament.development.reset" $ }}"true"{{ else }}"false"{{ end }}
            # trek inserts fixtures only on a from-scratch apply, so this
            # requires the reset.
            - name: TREK_INSERT_TEST_DATA
              value: {{ if and (include "fundament.development.reset" $) $.Values.development.insertTestData }}"true"{{ else }}"false"{{ end }}
            # psql connection for the catalog seed step (same superuser as trek).
            - name: PGHOST
              value: {{ include "fundament.db.host" . }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: PGDATABASE
              value: fundament
            - name: PGSSLMODE
              value: disable
{{- if and (include "fundament.development.reset" $) $.Values.openfga.enabled }}
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: db-fun-openfga
                  key: uri
{{- end }}
{{- end }}
