{{- if $.Values.db.enabled }}

---
apiVersion: batch/v1
kind: Job
metadata:
  # Per-release name: a Job's pod template is immutable.
  name: db-migrations-{{ .Release.Revision }}
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Waiting for the fundament database..."
              until pg_isready -h {{ include "fundament.db.host" . }} -p 5432 > /dev/null 2>&1; do sleep 2; done
      containers:
        - name: fundament-migrate
          image: {{ $.Values.images.dbMigrations }}
          # Seed the appstore plugin catalog (reference data) in EVERY environment,
          # independently of TREK_INSERT_TEST_DATA. The seed is a set of idempotent
          # upserts: a fresh DB gets the catalog and an existing one is reconciled
          # to the file. One transaction with ON_ERROR_STOP, and any psql failure
          # aborts the Job instead of being swallowed.
          command:
            - sh
            - -c
            - |
              set -e
              trek apply
              echo "Seeding system organization..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0100-system-org.sql
              echo "Seeding appstore plugin catalog..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0101-appstore-catalog.sql
          env:
            - name: TREK_POSTGRES_HOST
              value: {{ include "fundament.db.host" . }}
            - name: TREK_POSTGRES_PORT
              value: "5432"
            - name: TREK_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: TREK_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: TREK_POSTGRES_DATABASE
              value: fundament
            - name: TREK_POSTGRES_SSLMODE
              value: disable
            # Resets on every run, while the OpenFGA wipe only runs once per
            # generation. They stay consistent because the generation tracks the
            # image and the image carries the testdata, so a re-run reseeds the
            # same rows and the writes are idempotent.
            - name: TREK_RESET_DATABASE
              value: {{ $.Values.db.reset | quote }}
            - name: TREK_INSERT_TEST_DATA
              value: {{ $.Values.db.insertTestData | quote }}
            # psql connection for the catalog seed step (same superuser as trek).
            - name: PGHOST
              value: {{ include "fundament.db.host" . }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: PGDATABASE
              value: fundament
            - name: PGSSLMODE
              value: disable
{{- end }}
