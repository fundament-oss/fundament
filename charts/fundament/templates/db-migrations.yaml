{{- if $.Values.db.enabled }}
---
apiVersion: batch/v1
kind: Job
# Brings the database up to the current schema on every deploy: migrations, then
# the appstore catalog seed. Where db.reset is set it first drops both the app
# and OpenFGA databases and reloads db/testdata, which only trek's reset path
# applies.
metadata:
  # Per-release name: a Job's pod template is immutable, and openfga's
  # wait-for-reset needs to identify this upgrade's run.
  name: {{ include "fundament.dbMigrationsJobName" $ }}
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 4 }}
spec:
  backoffLimit: 3
  # This Job must outlive the deploy: openfga's wait-for-reset blocks on it by
  # name, and an openfga pod recreated after it is gone waits forever. Helm
  # prunes the previous revision's Job on each upgrade.
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database to be ready..."
              until nc -z -w 5 {{ include "fundament.db.host" . }} 5432; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
      containers:
        - name: migrations
          image: {{ $.Values.images.dbMigrations }}
          # Run the schema migrations, then seed the appstore plugin catalog
          # (reference data) in EVERY environment, independently of
          # TREK_INSERT_TEST_DATA. The seed is a set of idempotent upserts, so it
          # runs unconditionally on every Job: a fresh DB gets the catalog and an
          # existing one is reconciled to the file. It runs in one transaction
          # with ON_ERROR_STOP, and any psql failure aborts the Job (set -e)
          # instead of being swallowed. The trek image is Alpine-based and ships
          # psql.
          command:
            - sh
            - -c
            - |
              set -e
              {{- if and $.Values.db.reset $.Values.openfga.enabled }}
              # Reset the OpenFGA datastore here, coupled with the DB reset, so
              # the two always happen together as one triggered event. OpenFGA no
              # longer resets itself on pod start, so an unrelated openfga rollout
              # can't wipe the store out from under an already-synced outbox.
              #
              # Must run before trek apply: reseeding fires authz.outbox notifies,
              # and OpenFGA accepts writes to a dropped store, so rows drained into
              # it would be marked processed and lost.
              # CNPG creates the openfga database asynchronously, so on a cold start
              # it can still be absent here — the init container's port check says
              # nothing about which databases exist. Wait for the database itself,
              # via -d postgres — fundament may not exist yet.
              echo "Waiting for the openfga database..."
              i=0
              until psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'openfga'" | grep -q 1; do
                i=$((i + 1))
                if [ "$i" -ge 150 ]; then
                  echo "openfga database did not appear after 5 minutes" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "Resetting OpenFGA datastore (coupled with the DB reset)..."
              psql "$OPENFGA_DATASTORE_URI" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
              echo "OpenFGA datastore reset complete."
              {{- end }}
              trek apply
              echo "Seeding system organization..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0100-system-org.sql
              echo "Seeding appstore plugin catalog..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0101-appstore-catalog.sql
          env:
            - name: TREK_POSTGRES_HOST
              value: {{ include "fundament.db.host" . }}
            - name: TREK_POSTGRES_PORT
              value: "5432"
            - name: TREK_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: TREK_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: TREK_POSTGRES_DATABASE
              value: fundament
            - name: TREK_POSTGRES_SSLMODE
              value: disable
            - name: TREK_RESET_DATABASE
              value: {{ $.Values.db.reset | quote }}
            - name: TREK_INSERT_TEST_DATA
              value: {{ $.Values.db.insertTestData | quote }}
            # psql connection for the catalog seed step (same superuser as trek).
            - name: PGHOST
              value: {{ include "fundament.db.host" . }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: PGDATABASE
              value: fundament
            - name: PGSSLMODE
              value: disable
            {{- if and $.Values.db.reset $.Values.openfga.enabled }}
            # OpenFGA datastore connection (separate DB on the same cluster), used
            # only for the coupled reset step above.
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: db-fun-openfga
                  key: uri
            {{- end }}
{{- end }}
