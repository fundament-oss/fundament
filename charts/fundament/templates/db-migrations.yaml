{{- if $.Values.db.enabled }}
---
# With db.reset, trek apply drops the app database and reloads db/testdata; the
# OpenFGA reset below is coupled to it.
apiVersion: batch/v1
kind: Job
metadata:
  # Per-release name: a Job's pod template is immutable, and openfga's
  # wait-for-reset needs to identify this upgrade's run.
  name: {{ include "fundament.dbMigrationsJobName" $ }}
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 4 }}
spec:
  backoffLimit: 3
  # openfga's wait-for-reset blocks on this Job by name — a pod recreated after
  # collection waits forever — and the review cluster's admission policy requires
  # a TTL on an ownerless Job.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "db-migrations" "component" "database") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database to be ready..."
              until nc -z -w 5 {{ include "fundament.db.host" . }} 5432; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
      containers:
        - name: migrations
          image: {{ $.Values.images.dbMigrations }}
          # The catalog seed runs in every environment, independent of
          # TREK_INSERT_TEST_DATA; the upserts are idempotent.
          command:
            - sh
            - -c
            - |
              set -e
              trek apply
              echo "Seeding system organization..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0100-system-org.sql
              echo "Seeding appstore plugin catalog..."
              psql --single-transaction -v ON_ERROR_STOP=1 -f /data/seed/0101-appstore-catalog.sql
              {{- if and $.Values.db.reset $.Values.openfga.enabled }}
              # The OpenFGA reset lives here, coupled with the DB reset, so an
              # unrelated openfga rollout can't wipe the store out from under an
              # already-synced outbox. CNPG creates the openfga database
              # asynchronously and the init container only checks the port, so wait
              # for the database itself rather than assuming it exists.
              echo "Waiting for the openfga database..."
              i=0
              until psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'openfga'" | grep -q 1; do
                i=$((i + 1))
                if [ "$i" -ge 150 ]; then
                  echo "openfga database did not appear after 5 minutes" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "Resetting OpenFGA datastore (coupled with the DB reset)..."
              psql "$OPENFGA_DATASTORE_URI" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
              echo "OpenFGA datastore reset complete."
              # The drop destroyed every tuple, so every row has to be replayed
              # whatever it is marked: authz-worker may already have drained some into
              # the store just dropped, and writes there report success because OpenFGA
              # does not check that its store exists. Cost scales with the seed.
              echo "Re-queueing the authz outbox for the new store..."
              psql -c "UPDATE authz.outbox SET processed = NULL, status = 'pending', retries = 0, retry_after = NULL, failed = NULL, status_info = NULL;"
              {{- end }}
          env:
            - name: TREK_POSTGRES_HOST
              value: {{ include "fundament.db.host" . }}
            - name: TREK_POSTGRES_PORT
              value: "5432"
            - name: TREK_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: TREK_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: TREK_POSTGRES_DATABASE
              value: fundament
            - name: TREK_POSTGRES_SSLMODE
              value: disable
            - name: TREK_RESET_DATABASE
              value: {{ $.Values.db.reset | quote }}
            - name: TREK_INSERT_TEST_DATA
              value: {{ $.Values.db.insertTestData | quote }}
            # psql env for the seed and reset steps.
            - name: PGHOST
              value: {{ include "fundament.db.host" . }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fundament.db.superuserSecretName" . }}
                  key: password
            - name: PGDATABASE
              value: fundament
            - name: PGSSLMODE
              value: disable
            {{- if and $.Values.db.reset $.Values.openfga.enabled }}
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: db-fun-openfga
                  key: uri
            {{- end }}
{{- end }}
