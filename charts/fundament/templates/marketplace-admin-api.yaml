{{- if $.Values.marketplaceAdminApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-admin-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-admin-api" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $.Values.marketplaceAdminApi.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "marketplace-admin-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "marketplace-admin-api" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: marketplace-admin-api
          image: {{ $.Values.images.marketplaceAdminApi }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-marketplace-admin-api
                  key: uri
            # The backoffice is authenticated: it validates the reviewer's
            # DCIM token (staff IDP; FUN-17, FUN-20).
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            - name: LOG_LEVEL
              value: {{ .Values.marketplaceAdminApi.logLevel }}
            {{- if $.Values.deploymentVersion }}
            # Served on /version so CI can tell which release is answering.
            - name: DEPLOYMENT_VERSION
              value: {{ $.Values.deploymentVersion | quote }}
            {{- end }}
            # Defaults to the review backoffice frontend: this surface takes
            # credentials, and an empty list would mean a wildcard origin,
            # which browsers reject.
            - name: CORS_ALLOWED_ORIGINS
              value: {{ $.Values.externalUrls.corsAllowedOrigins | default $.Values.externalUrls.marketplaceAdmin }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http") | nindent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-admin-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-admin-api" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
      {{- with $.Values.grpcAppProtocol }}
      appProtocol: {{ . }}
      {{- end }}
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "marketplace-admin-api") | nindent 4 }}

{{- end }}
