{{- if and $.Values.authzWorker.enabled }}
{{- if gt (int $.Values.authzWorker.replicas) 1 }}
{{- fail "authzWorker.replicas must be 1: two workers apply one subject's outbox rows out of order and can leave a stale grant in OpenFGA" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-worker
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "authz-worker" "component" "worker") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # A rollout stops the old worker before it starts the new one. Not Recreate:
  # an existing Deployment keeps the rollingUpdate the API server defaulted, and
  # server-side apply refuses Recreate next to it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "authz-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "authz-worker" "component" "worker") | nindent 8 }}
    spec:
      containers:
        - name: authz-worker
          image: {{ $.Values.images.authzWorker }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: health
              containerPort: 8097
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-authz-worker
                  key: uri
            - name: LOG_LEVEL
              value: {{ $.Values.authzWorker.logLevel }}
            - name: POLL_INTERVAL
              value: {{ $.Values.authzWorker.pollInterval | quote }}
            - name: BATCH_SIZE
              value: {{ $.Values.authzWorker.batchSize | quote }}
            - name: MAX_RETRIES
              value: {{ $.Values.authzWorker.maxRetries | quote }}
            - name: OPENFGA_API_URL
              value: http://openfga:{{ $.Values.openfga.apiPort | default 8080 }}
            - name: OPENFGA_STORE_NAME
              value: {{ include "fundament.openfga.storeName" $ }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "health") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "health") | nindent 10 }}
          {{- include "fundament.resources" (dict "resources" $.Values.authzWorker.resources "indent" 10) }}
{{- end }}
