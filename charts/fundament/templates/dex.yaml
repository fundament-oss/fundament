{{- define "fundament.dex.config" -}}
issuer: {{ $.Values.dex.issuer }}
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  responseTypes: ["code"]
  skipApprovalScreen: true
  passwordConnector: local
{{- if $.Values.dex.staticClients }}
staticClients:
  {{- toYaml $.Values.dex.staticClients | nindent 2 }}
{{- end }}
enablePasswordDB: true
{{- if $.Values.dex.staticPasswords }}
staticPasswords:
  {{- toYaml $.Values.dex.staticPasswords | nindent 2 }}
{{- end }}
{{- end }}

{{- if $.Values.dex.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dex" "component" "backend") | nindent 4 }}
data:
  config.yaml: |
    {{- include "fundament.dex.config" $ | nindent 4 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dex" "component" "backend") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "dex") | nindent 6 }}
  template:
    metadata:
      annotations:
        # The whole config, not only the issuer: Dex reads it once at start, so
        # a new static user or client must roll the pod.
        checksum/config: {{ include "fundament.dex.config" $ | sha256sum }}
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "dex" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.1
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command:
            - /usr/local/bin/dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: http
              containerPort: 5556
          # TCP: Dex's /healthz sits under the issuer's path, which differs per
          # environment.
          {{- include "fundament.tcpProbes" (dict "port" "http") | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
          {{- include "fundament.resources" (dict "resources" $.Values.dex.resources "indent" 10) }}
      volumes:
        - name: config
          configMap:
            name: dex

---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "dex" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5556
      targetPort: http
      name: http
    - port: 8080
      targetPort: http
      name: http-alt
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "dex") | nindent 4 }}

{{- end }}
