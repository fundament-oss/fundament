{{- if $.Values.marketplaceFrontend.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-frontend-config
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-frontend" "component" "frontend") | nindent 4 }}
data:
  # The three marketplace APIs are three deployables (FUN-20), so each gets its
  # own base URL rather than a shared one with a path prefix. An empty URL means
  # that service is not deployed in this environment; the app still serves, but
  # the views that call it fail.
  config.json: |
    {
      "catalogApiUrl": "{{ $.Values.externalUrls.marketplaceCatalogApi }}",
      "registryApiUrl": "{{ $.Values.externalUrls.marketplaceRegistryApi }}",
      "adminApiUrl": "{{ $.Values.externalUrls.marketplaceAdminApi }}",
      "consoleUrl": "{{ $.Values.externalUrls.console }}"
    }

{{- /*
  Hostnames the server-rendered app will answer for. Angular's SSR engine
  rejects a request whose Host (or forwarded host) is not on this list, which is
  what keeps a spoofed host header from steering server-side rendering.
*/}}
{{- $allowedHosts := list }}
{{- if $.Values.ingress.enabled }}
{{- $allowedHosts = append $allowedHosts (printf "marketplace.%s%s" (include "fundament.ingress.infix" .) $.Values.ingress.domain) }}
{{- end }}
{{- range $.Values.marketplaceFrontend.httproute.hostnames }}
{{- $allowedHosts = append $allowedHosts . }}
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-frontend
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-frontend" "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ $.Values.marketplaceFrontend.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "marketplace-frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "marketplace-frontend" "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: marketplace-frontend
          image: {{ $.Values.images.marketplaceFrontend }}
          env:
            # Substituted into the CSP connect-src directive by the server
            # (see marketplace-frontend/src/server.ts). These are the origins the
            # browser calls; a server render uses the internal URLs below. Unset
            # URLs collapse to extra whitespace, leaving connect-src 'self'.
            - name: CONNECT_SRC
              value: "{{ $.Values.externalUrls.marketplaceCatalogApi }} {{ $.Values.externalUrls.marketplaceRegistryApi }} {{ $.Values.externalUrls.marketplaceAdminApi }}"
            {{- if $allowedHosts }}
            - name: NG_ALLOWED_HOSTS
              value: "{{ join "," $allowedHosts }}"
            {{- end }}
            # Base URLs the renderer uses for its own calls. Without these it
            # would reach the APIs by their public hostname, leaving the cluster
            # and coming back in through the gateway for every page it renders.
            {{- with $.Values.marketplaceFrontend.internalApiUrls.catalog }}
            - name: CATALOG_API_INTERNAL_URL
              value: "{{ . }}"
            {{- end }}
            {{- with $.Values.marketplaceFrontend.internalApiUrls.registry }}
            - name: REGISTRY_API_INTERNAL_URL
              value: "{{ . }}"
            {{- end }}
            {{- with $.Values.marketplaceFrontend.internalApiUrls.admin }}
            - name: ADMIN_API_INTERNAL_URL
              value: "{{ . }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            # Read by the browser over HTTP and by the renderer straight off disk.
            - name: config
              mountPath: /app/dist/fundament-marketplace/browser/assets/config
              readOnly: true
            # Same file for the hot-reload image, which serves from the sources.
            - name: config
              mountPath: /app/public/assets/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: marketplace-frontend-config

---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-frontend
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-frontend" "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "marketplace-frontend") | nindent 4 }}

{{- if $.Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace-frontend
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-frontend" "component" "frontend") | nindent 4 }}
  {{- if $.Values.ingress.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.clusterIssuer }}
  tls:
    - hosts:
        - marketplace.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      secretName: marketplace-frontend-tls
  {{- end }}
  rules:
    - host: marketplace.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketplace-frontend
                port:
                  name: http
{{- end }}

{{- end }}
