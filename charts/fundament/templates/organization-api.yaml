{{- if $.Values.organizationApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "organization-api" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $.Values.organizationApi.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "organization-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "organization-api" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: organization-api
          image: {{ $.Values.images.organizationApi }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-fundament-api
                  key: uri
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            - name: LOG_LEVEL
              value: {{ .Values.organizationApi.logLevel }}
            - name: PROMETHEUS_URL
              value: {{ $.Values.organizationApi.prometheusURL | quote }}
            - name: LOGS_URL
              value: {{ $.Values.organizationApi.logsURL | quote }}
            {{- if $.Values.externalUrls.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ $.Values.externalUrls.corsAllowedOrigins }}
            {{- end }}
            {{- if $.Values.externalUrls.kubeApiProxy }}
            - name: KUBE_API_PROXY_URL
              value: {{ $.Values.externalUrls.kubeApiProxy }}
            # org-api's own calls to the proxy (plugin-pod logs) go over the
            # in-cluster Service; the external URL above is browser-facing.
            - name: KUBE_API_PROXY_INTERNAL_URL
              value: http://kube-api-proxy:8081
            {{- end }}
            {{- if $.Values.organizationApi.kubeApiProxyInsecure }}
            - name: KUBE_API_PROXY_INSECURE
              value: "true"
            {{- end }}
            - name: OPENFGA_API_URL
              value: http://openfga:{{ $.Values.openfga.apiPort | default 8080 }}
            - name: OPENFGA_STORE_ID
              valueFrom:
                configMapKeyRef:
                  name: openfga-config
                  key: store-id
            - name: OPENFGA_AUTHORIZATION_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: openfga-config
                  key: authorization-model-id
            {{- if $.Values.organizationApi.prometheusCASecret }}
            - name: PROMETHEUS_CA_FILE
              value: /etc/prometheus-ca/ca.crt
            {{- end }}
            {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
            - name: GARDENER_KUBECONFIG
              value: /etc/gardener/kubeconfig
            {{- end }}
          {{- if or $.Values.clusterWorker.gardenerKubeconfigSecret $.Values.organizationApi.prometheusCASecret }}
          volumeMounts:
            {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
            - name: gardener-kubeconfig
              mountPath: /etc/gardener
              readOnly: true
            {{- end }}
            {{- if $.Values.organizationApi.prometheusCASecret }}
            - name: prometheus-ca
              mountPath: /etc/prometheus-ca
              readOnly: true
            {{- end }}
          {{- end }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http") | nindent 10 }}
      {{- if or $.Values.clusterWorker.gardenerKubeconfigSecret $.Values.organizationApi.prometheusCASecret }}
      volumes:
        {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
        - name: gardener-kubeconfig
          secret:
            secretName: {{ $.Values.clusterWorker.gardenerKubeconfigSecret }}
        {{- end }}
        {{- if $.Values.organizationApi.prometheusCASecret }}
        - name: prometheus-ca
          secret:
            secretName: {{ $.Values.organizationApi.prometheusCASecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: organization-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "organization-api" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "organization-api") | nindent 4 }}

{{- if $.Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organization-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "organization-api" "component" "backend") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    {{- if $.Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.clusterIssuer }}
  tls:
    - hosts:
        - organization.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      secretName: organization-api-tls
  {{- end }}
  rules:
    - host: organization.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: organization-api
                port:
                  name: http
{{- end }}

{{- end }}
