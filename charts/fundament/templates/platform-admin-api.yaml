{{- if $.Values.platformAdminApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-admin-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "platform-admin-api" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $.Values.platformAdminApi.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "platform-admin-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "platform-admin-api" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: platform-admin-api
          image: {{ $.Values.images.platformAdminApi }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-platform-admin-api
                  key: uri
            # The fleet view is for staff: it validates the DCIM token
            # (FUN-23), like the marketplace review backoffice.
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            - name: STALE_AFTER
              value: {{ $.Values.platformAdminApi.staleAfter | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.platformAdminApi.logLevel }}
            {{- if $.Values.deploymentVersion }}
            # Served on /version so CI can tell which release is answering.
            - name: DEPLOYMENT_VERSION
              value: {{ $.Values.deploymentVersion | quote }}
            {{- end }}
            # Defaults to the DCIM frontend: this surface takes credentials,
            # and an empty list would mean a wildcard origin, which browsers
            # reject.
            - name: CORS_ALLOWED_ORIGINS
              value: {{ $.Values.externalUrls.corsAllowedOrigins | default $.Values.externalUrls.dcim }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http") | nindent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: platform-admin-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "platform-admin-api" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
      {{- with $.Values.grpcAppProtocol }}
      appProtocol: {{ . }}
      {{- end }}
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "platform-admin-api") | nindent 4 }}

{{- end }}
