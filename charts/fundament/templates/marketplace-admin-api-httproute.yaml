{{- if and $.Values.marketplaceAdminApi.enabled $.Values.marketplaceAdminApi.httproute.enabled }}
{{- if not $.Values.marketplaceAdminApi.httproute.parentRefs }}{{ fail "marketplaceAdminApi.httproute.parentRefs is required when httproute is enabled" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-marketplace-admin-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "marketplace-admin-api" "component" "gateway") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $.Values.marketplaceAdminApi.httproute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml $.Values.marketplaceAdminApi.httproute.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: marketplace-admin-api
          port: 8080
{{- end }}
