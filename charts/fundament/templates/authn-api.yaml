{{- if $.Values.authnApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authn-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "authn-api" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
    {{- if $.Values.authnApi.sandboxKubeconfigSecret }}
    # The sandbox kubeconfig Secret is created out of band after this pod is
    # running and mounted optional: true, so `auto` never sees it. Name it.
    secret.reloader.stakater.com/reload: {{ $.Values.authnApi.sandboxKubeconfigSecret | quote }}
    {{- end }}
spec:
  replicas: {{ $.Values.authnApi.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "authn-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "authn-api" "component" "backend") | nindent 8 }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      containers:
        - name: authn-api
          image: {{ $.Values.images.authnApi }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-fun-authn-api
                  key: uri
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            - name: OIDC_ISSUER
              value: {{ .Values.dex.issuer }}
            - name: OIDC_DISCOVERY_URL
              value: {{ .Values.dex.discoveryUrl }}
            - name: OIDC_CLIENT_ID
              value: fundament
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.externalUrls.authn }}/callback
            - name: FRONTEND_URL
              value: {{ .Values.externalUrls.console }}
            - name: COOKIE_DOMAIN
              value: {{ .Values.externalUrls.cookieDomain }}
            - name: COOKIE_SECURE
              value: "{{ hasPrefix "https://" .Values.externalUrls.authn }}"
            - name: LOG_LEVEL
              value: {{ .Values.authnApi.logLevel }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.externalUrls.corsAllowedOrigins | default .Values.externalUrls.console }}
            {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
            - name: GARDENER_MODE
              value: real
            - name: GARDENER_KUBECONFIG
              value: /etc/gardener/kubeconfig
            {{- end }}
            {{- if $.Values.authnApi.sandboxKubeconfigSecret }}
            - name: PLUGIN_SANDBOX_KUBECONFIG
              value: /etc/plugin-sandbox/kubeconfig
            {{- end }}
            - name: SHOOT_VERIFIER_MODE
              value: {{ $.Values.authnApi.shootVerifierMode | default "auto" | quote }}
            {{- if $.Values.authnApi.mockShootSecret }}
            - name: MOCK_SHOOT_SECRET
              value: {{ $.Values.authnApi.mockShootSecret | quote }}
            {{- end }}
            {{- if $.Values.authnApi.mockShootSecretAllowDefault }}
            - name: MOCK_SHOOT_SECRET_ALLOW_DEFAULT
              value: "true"
            {{- end }}
            # clusterId and organizationId name one tenant.clusters row and must move
            # together: the exchange refuses a verifier organization that differs
            # from the row (FUN-22, check 5).
            {{- if $.Values.pluginController.clusterId }}
            - name: LOCAL_CLUSTER_ID
              value: {{ $.Values.pluginController.clusterId | quote }}
            - name: LOCAL_ORGANIZATION_ID
              value: {{ required "pluginController.organizationId must be set together with pluginController.clusterId" $.Values.pluginController.organizationId | quote }}
            {{- end }}
            - name: OPENFGA_API_URL
              value: http://openfga:{{ $.Values.openfga.apiPort | default 8080 }}
            - name: OPENFGA_STORE_NAME
              value: {{ include "fundament.openfga.storeName" $ }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- if or $.Values.clusterWorker.gardenerKubeconfigSecret $.Values.authnApi.sandboxKubeconfigSecret }}
          volumeMounts:
            {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
            - name: gardener-kubeconfig
              mountPath: /etc/gardener
              readOnly: true
            {{- end }}
            {{- if $.Values.authnApi.sandboxKubeconfigSecret }}
            - name: plugin-sandbox-kubeconfig
              mountPath: /etc/plugin-sandbox
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $.Values.clusterWorker.gardenerKubeconfigSecret $.Values.authnApi.sandboxKubeconfigSecret }}
      volumes:
        {{- if $.Values.clusterWorker.gardenerKubeconfigSecret }}
        - name: gardener-kubeconfig
          secret:
            secretName: {{ $.Values.clusterWorker.gardenerKubeconfigSecret }}
        {{- end }}
        {{- if $.Values.authnApi.sandboxKubeconfigSecret }}
        - name: plugin-sandbox-kubeconfig
          secret:
            secretName: {{ $.Values.authnApi.sandboxKubeconfigSecret }}
            optional: true
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: authn-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "authn-api" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "authn-api") | nindent 4 }}

{{- if $.Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authn-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "authn-api" "component" "backend") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "false"
    {{- if $.Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.clusterIssuer }}
  tls:
    - hosts:
        - authn.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      secretName: authn-api-tls
  {{- end }}
  rules:
    - host: authn.{{ include "fundament.ingress.infix" . }}{{ $.Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authn-api
                port:
                  name: http
{{- end }}

{{- end }}
