{{- if $.Values.authzApi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "authz-api" "component" "backend") | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $.Values.authzApi.replicas }}
  selector:
    matchLabels:
      {{- include "fundament.selectorLabels" (dict "root" $ "name" "authz-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fundament.labels" (dict "root" $ "name" "authz-api" "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: authz-api
          image: {{ $.Values.images.authzApi }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "fundament.jwtSecretEnv" . | nindent 12 }}
            - name: LOG_LEVEL
              value: {{ $.Values.authzApi.logLevel }}
            {{- if $.Values.deploymentVersion }}
            - name: DEPLOYMENT_VERSION
              value: {{ $.Values.deploymentVersion | quote }}
            {{- end }}
            # The console calls authz-api with the session cookie. Left unset,
            # rs/cors answers "*", which a browser refuses for a credentialed call.
            {{- $corsOrigins := include "fundament.corsOrigins" (dict "root" $ "frontends" (list $.Values.externalUrls.console)) }}
            {{- if $corsOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ $corsOrigins | quote }}
            {{- end }}
            - name: OPENFGA_API_URL
              value: http://openfga:{{ $.Values.openfga.apiPort | default 8080 }}
            - name: OPENFGA_STORE_NAME
              value: {{ include "fundament.openfga.storeName" $ }}
          {{- include "fundament.livenessProbe" (dict "root" $ "port" "http") | nindent 10 }}
          {{- include "fundament.readinessProbe" (dict "root" $ "port" "http") | nindent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: authz-api
  labels:
    {{- include "fundament.labels" (dict "root" $ "name" "authz-api" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
      {{- with $.Values.grpcAppProtocol }}
      appProtocol: {{ . }}
      {{- end }}
  selector:
    {{- include "fundament.selectorLabels" (dict "root" $ "name" "authz-api") | nindent 4 }}

{{- end }}
