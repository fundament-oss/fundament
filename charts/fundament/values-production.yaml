# Sandbox environment values

db:
  enabled: true
  instances: 2
  reset: false
  storageSize: 5Gi

authnApi:
  enabled: true
  replicas: 2

organizationApi:
  enabled: true
  replicas: 2
  # Read cluster system logs from each shoot's own Vali through the Plutono
  # datasource proxy (ADR-0027) rather than serving generated data. Needs
  # clusterWorker.gardenerKubeconfigSecret set: without it organization-api
  # falls back to a noop Gardener client, resolution fails, and the console
  # reports "No log backend is configured".
  logsURL: per-shoot

consoleFrontend:
  enabled: true
  replicas: 2

docsFrontend:
  enabled: true
  replicas: 2

dcimApi:
  enabled: true
  replicas: 2

dcimFrontend:
  enabled: true
  replicas: 2

dex:
  enabled: true
  issuer: https://dex.sandbox.example.com
  staticClients:
    - id: fundament
      name: Fundament
      secret: "" # Set via secret management
      redirectURIs:
        - https://fundament.sandbox.example.com/callback

ingress:
  enabled: false
