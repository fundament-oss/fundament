dcimAuthnApi:
  enabled: true
  replicas: 1
  # ROPC login against dex static passwords. Acceptable for the shared
  # sandbox/PR test environments; keep disabled in production.
  passwordLoginEnabled: true

authzWorker:
  enabled: true
  replicas: 1
  logLevel: debug
  pollInterval: "2s"
  batchSize: 100

openfga:
  enabled: true
  # Use a non-standard API port since 8080 is used by ingress.
  # The playground auto-detects the API port from the URL it's served from.
  apiPort: 18080
  playground:
    # To use the playground, you must port-forward both the API and playground ports to localhost:
    #   kubectl port-forward svc/openfga 18080:18080 3000:3000
    # Then access the playground at http://localhost:3000/playground
    # This is due to CSP restrictions in the embedded play.fga.dev iframe.
    # See: https://github.com/openfga/openfga/issues/1174
    enabled: true

dcimApi:
  enabled: true
  replicas: 2

dcimFrontend:
  enabled: true
  replicas: 2

marketplaceFrontend:
  enabled: true
  replicas: 2
  internalApiUrls:
    catalog: http://marketplace-catalog-api:8080

# Developer portal: the same image as marketplaceFrontend built for the
# publishing audience (FUN-20). It holds the "Build a plugin" page the
# storefront hands off to; without it, externalUrls.marketplaceRegistry is
# empty and the storefront hides that hand-off altogether.
marketplaceRegistryFrontend:
  enabled: true
  replicas: 2
  internalApiUrls:
    registry: http://marketplace-registry-api:8080

# Review backoffice: the same image built for the reviewing audience (FUN-20).
# Reviewers sign in through DCIM, so this stays behind the staff host.
marketplaceAdminFrontend:
  enabled: true
  replicas: 2
  internalApiUrls:
    admin: http://marketplace-admin-api:8080

# Anonymous storefront API: the console's plugins page reads catalog.v1 from it.
marketplaceCatalogApi:
  enabled: true
  replicas: 2

# Authenticated publishing surface behind the developer portal: validates the
# developer's UserToken from authn-api.
marketplaceRegistryApi:
  enabled: true
  replicas: 2

# Review backoffice API: validates the reviewer's DCIM token (staff IDP).
marketplaceAdminApi:
  enabled: true
  replicas: 2

ingress:
  enabled: false
  tls:
    clusterIssuer: letsencrypt-prod
