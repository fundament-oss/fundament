dexDcim:
  enabled: true
  issuer: https://dex-dcim.fundament.projects.digilab.network
  discoveryUrl: http://dex-dcim:5556
  staticClients:
    - id: dcim
      name: "DCIM Auth API"
      redirectURIs:
        - https://dcim-authn.fundament.projects.digilab.network/callback
      public: true
  # DCIM is a separate trust domain from the console/tenant. The same test
  # credentials work here, but each user gets a DCIM-specific userID (019d0000
  # prefix) that is intentionally decoupled from the tenant userID in `dex`
  # above. dcim-authn-api derives the JWT subject from the dex `sub` and never
  # correlates it with tenant.users, so these IDs must stay distinct.
  staticPasswords:
    # acme-corp users
    - email: alice@acme-corp.com
      hash: "$2y$10$KdEtpACqX8Jh0AYF2n1sfeySkYkG8hRK6Tmn85/VpvaVVPgxL3Hsi"
      username: Alice
      userID: "019d0000-1000-7000-8000-000000000001"
