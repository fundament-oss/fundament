# Sandbox environment values

externalUrls:
  # Review webhook messages link here (marketplaceRegistryApi below).
  marketplaceAdmin: https://marketplace-admin.example.com

db:
  enabled: true
  instances: 2
  enablePDB: true
  storageSize: 5Gi

authnApi:
  enabled: true
  replicas: 2
  # Fundament SSO (Keycloak) signs people in, not Dex. The client is
  # confidential; its secret is created by secret management.
  oidc:
    issuer: https://login.example.com/realms/fundamentsso
    clientId: fundament
    displayName: Fundament SSO
    clientSecretRef:
      name: authn-api-oidc
      key: client-secret

organizationApi:
  enabled: true
  replicas: 2
  # Read cluster system logs from each shoot's own Vali through the Plutono
  # datasource proxy (ADR-0027) rather than serving generated data. Needs
  # clusterWorker.gardenerKubeconfigSecret set: without it organization-api
  # falls back to a noop Gardener client, resolution fails, and the console
  # reports "No log backend is configured".
  logsURL: per-shoot

consoleFrontend:
  enabled: true
  replicas: 2

docsFrontend:
  enabled: true
  replicas: 2

dcimApi:
  enabled: true
  replicas: 2

dcimFrontend:
  enabled: true
  replicas: 2

marketplaceRegistryApi:
  enabled: true
  replicas: 2
  # Mattermost incoming webhooks told about every new plugin review request.
  # The Secret (key "urls", comma-separated) is created by secret management;
  # links point at externalUrls.marketplaceAdmin.
  reviewWebhooksSecretRef:
    name: review-webhooks

dex:
  enabled: false
