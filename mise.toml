# KUBECONFIG below tests a path with `is exists`, which mise parses from 2026.7.2.
min_version = "2026.7.2"

[env]
JUST_ONE = true
# Local k3d registry for Skaffold image builds
SKAFFOLD_DEFAULT_REPO = "localhost:5111"
# Point functl at the local dev endpoints, and log at debug level.
FUNCTL_API_ENDPOINT = "https://organization.fundament.localhost:8443"
FUNCTL_AUTHN_URL = "https://authn.fundament.localhost:8443"
FUNCTL_REGISTRY_URL = "https://marketplace-registry-api.fundament.localhost:8443"
FUNCTL_DEBUG = "true"
# In the checkout, kubectl, helm and k9s read .dev/kubeconfig ahead of the shell's own
# kubeconfig (~/.kube/config by default), so the local clusters are the current context and
# a context switch is written to .dev/kubeconfig only. Inside the test-env VM the shell's
# own KUBECONFIG stays; the VM test matches the Justfile's. Windows separates the list with
# ';' and has no HOME in PowerShell.
KUBECONFIG = "{% if '/etc/fundament-test-env' is exists or get_env(name='FUNDAMENT_TEST_ENV', default='') == '1' %}{{ get_env(name='KUBECONFIG', default='') }}{% elif os() == 'windows' %}{{ config_root }}/.dev/kubeconfig;{{ get_env(name='KUBECONFIG', default=get_env(name='USERPROFILE', default='') ~ '/.kube/config') }}{% else %}{{ config_root }}/.dev/kubeconfig:{{ get_env(name='KUBECONFIG', default=get_env(name='HOME') ~ '/.kube/config') }}{% endif %}"

[tools]
# Scripting & Meta
just = "1.42.4"
act = "0.2.84"
jq = "1.7.1"
yq = "4.44.3"

# Database
"go:github.com/printeers/trek" = "0.12.6"

# Kubernetes & Deployment
mkcert = "1.4.4"
kubectl = "1.36.6"
helm = "3.22.0"
skaffold = "2.17.0"
k3d = "5.9.0"
kind = "0.27.0"
flux2 = "2.7.5"
opentofu = "1.11.3"

# Protobuf
"aqua:bufbuild/buf" = "1.72.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.20.0"

# Go
go = "1.27.4"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.20.1"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "0.25.0"
golangci-lint = "2.15.0"
"aqua:sqlc-dev/sqlc" = "1.30.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.4.1"
"go:google.golang.org/open2opaque" = "0.1.7"

# Console Frontend
node = "24"
bun = "1.4.3"
"npm:@bufbuild/protoc-gen-es" = "2.14.0"
"npm:@usebruno/cli" = "3.0.3"

[hooks]
postinstall = "just e2e::install"
